vocabulary:
- term: Product
  meaning: >-
    Anything sellable, of one of the twelve kinds. The record that carries names, channels, listing, media and policies.
  avoid:
  - Item (except on F&B and retail screens)
  - SKU (for tickets)
  - Offering
  source: contracts/spine/catalogue.yaml#/components/schemas/ProductKind
- term: Ticket type
  meaning: >-
    One sellable variant of an admission or event product (Adult, Child, Resident Adult), generated from the product's
    attributes. For retail and F&B the same record is labelled Variant.
  avoid:
  - Variant (on ticket screens)
  - Sub-product
  - Rate (that is a price)
  - Axis value
  source: contracts/spine/catalogue.yaml#updateProductVariant | DI-164 | DI-437
- term: Attribute
  meaning: >-
    A dimension that generates ticket types (Guest category, Residency, Tier, Length). Each has values; adding a
    value adds ticket types.
  avoid:
  - Axis
  - Component (the client's word; use it only in help text)
  - Option
  source: contracts/spine/catalogue.yaml#setProductAttributes | DI-164 | DI-450
- term: Entitlement
  meaning: >-
    What a ticket lets the holder do (validity, entries, re-entry, days, blackout dates, expiry, fast track, transfer),
    defined once on an entitlement template and shared by several products.
  avoid:
  - Access rights
  - Ticket rules
  - Validity profile
  source: contracts/spine/catalogue.yaml#createEntitlementTemplate | DI-171 | DI-451
- term: Eligibility rule
  meaning: >-
    Who may take part in or buy a product (age, height, supervision, waiver, certification). Distinct from a promotion's
    eligibility, which decides who gets a discount.
  avoid:
  - Restriction
  - Access rule (that is access control)
  source: contracts/spine/catalogue.yaml#setProductEligibilityRule | DI-463
- term: Price list
  meaning: >-
    A set of prices for one venue and a set of channels, valid between two dates, with a priority. Several coexist
    (B2C, B2B, season).
  avoid:
  - Price book
  - Rate card
  - Tariff
  source: contracts/spine/catalogue.yaml#createPriceList | DI-140 | DI-163
- term: Price category
  meaning: >-
    A standard rate type (Adult, Child, Member) reused across lists so venues do not invent "Adult Standard" and
    "Normal Adult".
  avoid:
  - Price band (that is a seat-category band)
  - Fare type (transport)
  source: >-
    contracts/spine/catalogue.yaml#setPriceCategoryRateType | screens/P08-venue-back-office.yaml#ADM-050
- term: Price band
  meaning: A priced band on a seat category (code, label, colour, amount, channel, from-date).
  avoid:
  - Price category
  - Zone price
  source: contracts/satellite/seating.yaml#/components/schemas/SeatPriceBand
- term: Promotion
  meaning: >-
    A rule that changes a price automatically or when a code is entered; draft until published; declares how it
    stacks.
  avoid:
  - Offer (except in guest copy)
  - Deal
  - Discount rule
  source: contracts/satellite/promotions.yaml#createPromotion | DI-173 | DI-174
- term: Coupon code
  meaning: >-
    A code issued from a coupon campaign that applies a promotion-style discount; one shared code or many single-use
    codes.
  avoid:
  - Voucher
  - Promo voucher
  source: contracts/satellite/promotions.yaml#createCouponCampaign | DI-173
- term: Voucher
  meaning: >-
    A code that carries money (face value, balance), sold or issued; a liability until redeemed or expired.
  avoid:
  - Coupon
  - Credit note
  source: >-
    contracts/satellite/promotions.yaml#listVoucherBatches | contracts/satellite/promotions.yaml#createVoucherBatch
- term: Bundle
  meaning: >-
    A product sold as one line whose price differs from the sum of its components, with a mandatory revenue allocation.
    "Package" is acceptable in guest copy.
  avoid:
  - Combo (that is an F&B meal deal)
  - Catalogue bundle
  source: contracts/satellite/promotions.yaml#createBundle | DI-220 | ADR-0019
- term: Catalogue release
  meaning: >-
    The signed snapshot of a venue's catalogue, prices, promotions and sale boards that tills, kiosks and devices
    pull. Its action label is "Publish to tills".
  avoid:
  - Bundle
  - Catalogue bundle
  - Sync
  - Deploy
  source: >-
    contracts/spine/catalogue.yaml#publishBundle | contracts/spine/catalogue.yaml#listCatalogueBundles | ADR-0013
- term: Approve / Publish / Save
  meaning: >-
    Save keeps a draft; Approve records that it is authorised (PRODUCT_APPROVE); Publish makes it live for guests
    and channels (PRODUCT_PUBLISH). Three different buttons, never merged.
  avoid:
  - Submit
  - Go live
  - Activate (except CatalogueConfigStatus active)
  - Deploy
  source: R091 | contracts/spine/catalogue.yaml#transitionProductLifecycle | DI-438
- term: Product states
  meaning: >-
    Draft, In review, Approved, Live, Withdrawn, Archived (ProductLifecycleState), always as coloured badges with
    these exact labels.
  avoid:
  - Published (for a product)
  - Pending
  - Inactive (for a product)
  source: contracts/spine/catalogue.yaml#/components/schemas/ProductLifecycleState
- term: Channel
  meaning: >-
    Where something is sold. Labels: pos Point of sale; kiosk Kiosk; web and guestWeb Website; mobile and guestApp
    App; b2b B2B partners; partner Partner; ota Travel agents (OTA); callCentre Call centre; api API; backOffice
    Back office.
  avoid:
  - Touchpoint
  - Outlet (an outlet is a business inside a venue)
  - raw enum values
  source: >-
    contracts/spine/catalogue.yaml#/components/schemas/Channel | contracts/shared/common.yaml#/components/schemas/SalesChannel
    | DI-140
- term: Refund
  meaning: >-
    Money returned after settlement, wholly or for some lines, under the venue's refund policy.
  avoid:
  - Return (that is retail goods)
  - Reversal
  - Void
  source: contracts/spine/orders.yaml#createRefund | DI-252
- term: Void
  meaning: >-
    Cancelling a whole order before settlement, within the same shift, with a reason from the void list. After settlement
    it is a refund.
  avoid:
  - Cancel order
  - Delete
  source: contracts/spine/orders.yaml#voidOrder | R222
- term: Exchange / Reschedule
  meaning: >-
    Exchange swaps lines for other products or dates and settles only the difference; Reschedule is the same product
    moved to another date or time.
  avoid:
  - Rebook
  - Date change (acceptable only in guest copy)
  - Refund and resell
  source: >-
    contracts/spine/orders.yaml#exchangeOrderLines | contracts/spine/orders.yaml#rescheduleOrder | DI-446
- term: Hold / Capture / Release
  meaning: >-
    A deposit or stored-value amount is held, then partly or fully captured, and the rest released. A held deposit
    is not a payment.
  avoid:
  - Charge
  - Pre-auth (in staff copy)
  - Block funds
  source: >-
    contracts/spine/orders.yaml#authoriseStoredValue | contracts/spine/orders.yaml#captureStoredValue | F25 step
    4
- term: Wallet (TICVAI wallet)
  meaning: >-
    The guest's stored-value balance on TICVAI, spent by hold and capture. Distinct from the tender "Apple Pay /
    Google Pay", which the contract also calls wallet.
  avoid:
  - Digital wallet (for stored value)
  - E-wallet
  - Credit (without a type)
  source: contracts/spine/orders.yaml#/components/schemas/TenderKind | R080
- term: Credit lot
  meaning: >-
    One amount of wallet credit of one credit type (cash, bonus, gift) with its own expiry; lots are spent nearest
    expiry first and the guest sees the breakdown but cannot choose.
  avoid:
  - Bucket
  - Batch
  - Top-up
  source: TRACKER Actions row 171 | contracts/satellite/wallet.yaml#expireCreditLots
- term: Venue map / Seat map
  meaning: >-
    A venue map is the wayfinding map of a park or a floor (points, paths, bookable places); a seat map is the seating
    layout of an auditorium or stand. Never just "map" where both could be meant.
  avoid:
  - Layout (alone)
  - Floor plan (unless it is a floor map)
  - Map (alone)
  source: contracts/satellite/venue-map.yaml#createVenueMap | contracts/satellite/seating.yaml
- term: Point / Bookable place
  meaning: >-
    A point is a place on a venue map (toilet, ride, restaurant, exit). A bookable place is a cabana, lounger, table
    or pitch placed on the map and sold through its price band.
  avoid:
  - Pin
  - POI
  - Marker
  - Resource (in staff copy)
  source: >-
    contracts/satellite/venue-map.yaml#setVenuePoint | contracts/satellite/venue-map.yaml#setPlacedResource | REV3-15
- term: Station / Route / Timetable / Departure / Fare table / Pass type
  meaning: >-
    A route is an ordered list of stations with offsets; a timetable generates departures up to its release horizon;
    a fare table prices a route per passenger type; a pass type is a multi-trip or unlimited pass sold as a product.
  avoid:
  - Stop (except in the stop list)
  - Line (except lineCode)
  - Schedule
  - Trip (except a guest's journey)
  source: contracts/satellite/transport.yaml | REV3-21
- term: Applies from
  meaning: >-
    The effective date of a change. Every dated change shows it, and sold items keep their old terms.
  avoid:
  - Effective date (in labels)
  - Start date (for a change)
  source: contracts/satellite/seating.yaml#updateSeatCategory | TRACKER Actions row 194
screens:
  BO-007:
    block: A
    summary: >-
      The venue's catalogue: every sellable product of every kind in one list, the entry point to product configuration
      (BO-008), pricing (BO-009), promotions (BO-010) and menus (BO-045). It must answer at a glance "what can we
      sell, where is each thing in its approval, and is it on sale on which channels", and it is where a new product
      starts. The one thing to get right is that lifecycle state, channels and "on tills" are three different facts
      and each needs its own column.
    inputs:
    - field: filters
      rule: >-
        Kind is a select of the twelve product kinds with plain labels (Admission, Timed admission, Dated admission,
        Open-dated, Seated, Membership, Bundle, Food & beverage, Retail, Rental, Add-on, Gift card); "Sellable"
        is a three-way filter (All, Sellable, Not sellable); add Lifecycle state and Channel filters. Venue comes
        from the shell (PR-1).
      source: >-
        contracts/spine/catalogue.yaml#/components/schemas/ProductKind | contracts/spine/catalogue.yaml#listProducts
        | DI-438
    - field: createProduct.code
      rule: >-
        Upper-case code, letters, digits, hyphen and underscore, at most 64; unique across the whole tenant, not
        just this venue, so the inline check says "used by Coastal Aqua" when another venue has it. Suggest it from
        the name (DUNE-DAYPASS) but let the user edit.
      source: contracts/spine/catalogue.yaml#createProduct | R108
    - field: createProduct path
      rule: >-
        "New product" offers the four creation paths the client asked for: start from scratch, from a saved template,
        clone an existing product, import a file (BO-117), plus "Describe it to the assistant" (BO-117). Kind is
        chosen first because it decides which sections the configuration shows.
      source: DI-439 | DI-440 | TRACKER Actions row 124
    outputs:
    - element: product table
      rule: >-
        Columns in this order: name (English, with the Arabic underneath in RTL), code, kind, lifecycle state badge,
        channels as small chips, on sale from-to, ticket types count, last changed. Hide the ids, scopePath and
        principal ids the generated layout lists; they are not for a merchandiser.
      source: >-
        contracts/spine/catalogue.yaml#/components/schemas/Product | DI-039 | screens/P08-venue-back-office.yaml#BO-007
    - element: lifecycle summary strip
      rule: >-
        Above the table, counts by state (Draft, In review, Approved, Live, Withdrawn) that act as filters, as the
        client asked for a lifecycle dashboard filterable by department.
      source: DI-438 | DI-577
    actions:
    - action: Bulk update
      result: >-
        Select rows (or "all matching the filter"), choose the change, always see the preview count first ("142
        products matched, 3 will fail: no price list") and confirm; the result reports succeeded and failed with
        the reason per failure.
      source: contracts/satellite/inventory.yaml#bulkUpdateProducts
    - action: Transition (approve, publish, withdraw, archive)
      result: >-
        The picker offers only transitions the user holds (approve needs PRODUCT_APPROVE, publish PRODUCT_PUBLISH);
        a reason is required; an approved product still shows "Not yet on tills" until the next catalogue release
        (PR-3).
      source: R091 | contracts/spine/catalogue.yaml#transitionProductLifecycle
    edgeCases:
    - case: A shared link to a product that has since been retired
      expected: >-
        Show the retired product read-only with what replaced it, or the catalogue if nothing did; never a blank
        page.
      source: screens/P08-venue-back-office.yaml#BO-007 | ADR-0030
    - case: Code already used at another venue of the tenant
      expected: >-
        Refused inline before submit, naming the other venue; the 409 from the server shows the same text.
      source: R108
    consistency:
    - with: BO-008
      note: >-
        Same product header (name, code, kind, state badge, channels, venue) on the directory's detail pane and
        on the product configuration (PR-10).
    - with: BO-045
      note: >-
        F&B and retail products list here too but are configured on the F&B and retail screens (fnb-retail process);
        the row opens the owning screen.
    sampleData:
      products:
      - name: Day Pass
        nameAr: تذكرة يوم
        code: DUNE-DAYPASS
        kind: datedAdmission
        state: Live
        channels:
        - Website
        - App
        - Point of sale
        - Kiosk
        ticketTypes: 4
        onSale: 2026-10-01 to 2027-09-30
      - name: Annual Pass Gold
        nameAr: الاشتراك السنوي الذهبي
        code: DUNE-ANNUAL-GOLD
        kind: membership
        state: In review
        channels:
        - Website
        - App
        ticketTypes: 2
      - name: Family Fun Bundle
        nameAr: باقة المرح العائلية
        code: DUNE-FAMILY-BUNDLE
        kind: bundle
        state: Approved
        channels:
        - Website
        ticketTypes: 1
      - name: Cabana B09 half day
        nameAr: كابانا B09 نصف يوم
        code: AQUA-CABANA-HALF
        kind: rental
        state: Draft
        channels:
        - Website
        - App
    corrections:
    - what: >-
        The generated layout draws "Venue id" and "Kind" as text fields and "Is sellable" as a toggle.
      why: >-
        Venue is the session scope (PR-1); kind is a closed enum and needs a select; a toggle cannot express "either".
      source: screens/P08-venue-back-office.yaml#BO-007 | contracts/spine/catalogue.yaml#listProducts
      status: fixed
      by: CHG-SBO-010
    - what: bulkUpdateProducts, a catalogue act on products, is declared in the inventory contract.
      why: >-
        The directory calls one product write in inventory and the rest in catalogue; permissions and audit for
        one record are split across two services.
      source: contracts/satellite/inventory.yaml#bulkUpdateProducts
      status: logged
      by: CHG-WIR-027
    - what: >-
        List operation(s) listAlternativeCodes return a bare array, not the paged list envelope (items, nextCursor,
        hasMore).
      why: >-
        The table cannot page, and a row without an id cannot open, edit or link to the record it summarises.
      source: contracts/spine/catalogue.yaml#listAlternativeCodes
      status: logged
      by: CHG-SBO-005
  BO-008:
    block: A
    summary: >-
      The one product configuration the client asked for (DI-465, DI-466): identity and classification, ticket types,
      what the guest sees, entitlement, eligibility, policies, channels and versions of one product, organised as
      sections of one record rather than separate screens. The flow the client described is basic information, ticket
      types, validation, publish (DI-432). The one thing to get right: a product that has sold must show what a
      change would affect before it is saved (PR-5).
    inputs:
    - field: attributes (setProductAttributes)
      rule: >-
        An attribute editor (Guest category: Adult, Child, Senior; Residency: Resident, Non-resident) that previews
        the ticket types it will generate before saving ("6 ticket types: 2 new, 1 retired"). Retired ticket types
        are never deleted because orders point at them. A time-window product sells by length: a Length attribute
        whose values carry minutes (60, 120, 240, 480; minimum 15), one per product.
      source: contracts/spine/catalogue.yaml#setProductAttributes | REV3-13 | DI-164 | DI-450
    - field: ticket type description
      rule: >-
        At most 300 characters per language; it is the text behind the (i) on the guest's ticket-type row when the
        booking flow shows card info. Setting "default" on one clears it on the others, so it is a radio across
        the ticket-type list, not a checkbox per row.
      source: contracts/spine/catalogue.yaml#updateProductVariant
    - field: guestListing and notBookableLabel
      rule: >-
        Three options with their consequence written under each: Bookable (listed and added to the basket), Information
        only (listed with details and the not-bookable label, never added to a basket), Hidden (staff channels only).
        The not-bookable label and the sales contact (phone or email, at least one) appear only for Information
        only.
      source: contracts/spine/catalogue.yaml#/components/schemas/GuestListing | REV3-14
    - field: displayTags
      rule: >-
        At most six tags; each picks an icon kind (clock, height, free, calendar, id) and a label of at most 40
        characters per language.
      source: contracts/spine/catalogue.yaml#/components/schemas/ProductDisplayTag
    - field: media
      rule: >-
        Picked from the asset library (ready assets only), exactly one primary, drag to order; alt text per language.
      source: contracts/spine/catalogue.yaml#/components/schemas/ProductMedia
    - field: consentQuestionIds and dataMaskValues
      rule: >-
        Consent questions are chosen from the venue's list (Are you able to swim?) and are not free text here; the
        data mask is the venue's custom fields (text, dropdown, radio, yes/no) with per-language labels and validation.
        Both decide what the guest is asked at booking.
      source: contracts/satellite/marketing-crm.yaml#listConsentQuestions | REV3-26 | DI-155 | DI-434
    - field: bookingFlowId
      rule: >-
        Optional; empty means the category's flow, then the venue's flow for this kind. Show which flow will actually
        apply.
      source: contracts/spine/catalogue.yaml#createProduct
    outputs:
    - element: change impact panel
      rule: >-
        Before Save on a product that has sold: tickets issued, orders affected, future performances, open carts,
        and whether the change propagates or is blocked (with the blocker named).
      source: contracts/spine/catalogue.yaml#assessProductChange
    - element: preview before publish
      rule: >-
        The client wants the reviewer to see every output: the B2C card, the PDF ticket and the Apple / Google Wallet
        pass, side by side.
      source: DI-444 | TRACKER Actions row 129
    - element: version history
      rule: >-
        Versions newest first with who, when and what changed; Restore creates a new version and says so.
      source: >-
        contracts/spine/catalogue.yaml#listProductVersions | contracts/spine/catalogue.yaml#restoreProductVersion
        | DI-938
    actions:
    - action: Clone
      result: >-
        Creates a draft with a new code and its ticket types, never its orders; the user lands on the clone.
      source: contracts/spine/catalogue.yaml#cloneProduct
    - action: Restore version
      result: >-
        Confirmation states that orders are untouched and that the restored state becomes a new version; tickets
        already sold keep their terms.
      source: contracts/spine/catalogue.yaml#restoreProductVersion
    edgeCases:
    - case: Product opened at an old version from a link
      expected: Read-only, labelled "Version 7 of 9, not current", with a link to the current version.
      source: screens/P08-venue-back-office.yaml#BO-008 | ADR-0030
    - case: Arabic name or description missing at publish
      expected: Publish warns and names the fields (PR-8).
      source: DI-019
    consistency:
    - with: BO-012
      note: >-
        A membership product is this same configuration with the membership sections expanded; same header and section
        order.
    - with: BO-161
      note: The eligibility section embeds BO-161's age and height rule rather than linking away.
    - with: BO-346
      note: >-
        The preview uses the ticket template BO-346 would select for this product kind and channel.
    sampleData:
      product:
        name: Day Pass
        nameAr: تذكرة يوم
        code: DUNE-DAYPASS
        kind: datedAdmission
        state: Live
        venue: Dune Park
      attributes:
      - name: Guest category
        values:
        - Adult
        - Child
        - Senior
      - name: Residency
        values:
        - UAE resident
        - Visitor
      ticketTypes:
      - name: Adult, Visitor
        nameAr: بالغ، زائر
        sku: DUNE-DAYPASS-AD-VIS
        default: true
      - name: Child (3-11), UAE resident
        nameAr: طفل (3-11)، مقيم
        sku: DUNE-DAYPASS-CH-RES
      displayTags:
      - kind: clock
        label: Full day
      - kind: height
        label: Some rides 120 cm+
      - kind: id
        label: Emirates ID for resident price
      impact:
        ticketsIssued: 18420
        ordersAffected: 9310
        futurePerformances: 212
        openCarts: 37
    corrections:
    - what: >-
        No operation renders the PDF ticket or Wallet pass preview for a product; printTicketProof works on a template,
        not on a product.
      why: The client's publish step needs all output formats previewed (DI-444).
      source: DI-444 | contracts/spine/orders.yaml#printTicketProof
      status: logged
      by: CHG-WIR-027
    - what: The screen's module is "Orders & Money" while it is the product configuration.
      why: Navigation would file the product record under money; it belongs with Sell beside BO-007.
      source: screens/P08-venue-back-office.yaml#BO-008
      status: fixed
      by: CHG-SBO-003
    - what: >-
        List operation(s) listProductVersions return a bare array, not the paged list envelope (items, nextCursor,
        hasMore).
      why: >-
        The table cannot page, and a row without an id cannot open, edit or link to the record it summarises.
      source: contracts/spine/catalogue.yaml#listProductVersions
      status: logged
      by: CHG-SBO-005
    decisions:
    - question: Which sections are visible for each product kind (for example no attributes on a gift card, no entitlement
        on retail)?
      decision: 'Drawn default accepted: Show identity, guest view, channels and versions for every kind; ticket types, entitlement,
        eligibility and policies for admission, timed, dated, open-dated, seated, membership and rental.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-102 | CHG-NOTE-006
      questionSource: contracts/spine/catalogue.yaml#/components/schemas/ProductKind | DI-433
  BO-009:
    block: A
    summary: >-
      Where the venue sets what each ticket type costs, per channel and per period: price lists, the prices in them,
      next season's copy and the dynamic rules that move prices. It must make the client's central "price matrix"
      visible: ticket types down, channels across, one price per cell, so each channel picks its price up automatically
      once published (DI-140).
    inputs:
    - field: price matrix (setPrices)
      rule: >-
        Edit as a grid (ticket type rows, price list or channel columns) rather than a list of rows; amounts in
        the region's currency and scale with no currency picker (PR-2); an empty cell means "not sold on this list",
        distinct from 0.00, which must be typed and confirmed.
      source: contracts/spine/catalogue.yaml#setPrices | DI-140 | TRACKER Actions row 196 | ADR-0008
    - field: priority
      rule: >-
        Integer with a stated direction; until the contract says which way it runs, label it "Higher number wins
        when two lists apply" and show the lists that overlap in date and channel.
      source: contracts/spine/catalogue.yaml#createPriceList | DI-595
    - field: copyPriceList adjustment
      rule: >-
        Percentage uplift with a rounding target ("round to 0.50"), and new validity dates; preview two or three
        example prices before confirming.
      source: contracts/spine/catalogue.yaml#copyPriceList
    - field: dynamic rule
      rule: >-
        Edited whole: conditions (when) and actions (what) on one panel, with the minimum and maximum price of each
        action shown beside it as the first thing a reviewer reads.
      source: >-
        contracts/spine/catalogue.yaml#setDynamicPriceRule | contracts/spine/catalogue.yaml#getDynamicPriceRule
    outputs:
    - element: price list list
      rule: >-
        Code, name, channels as chips, valid from-to, priority, status (Draft, Active, Inactive, Retired), currency
        read-only.
      source: >-
        contracts/spine/catalogue.yaml#/components/schemas/CatalogueConfigStatus | contracts/spine/catalogue.yaml#getPriceList
    - element: overlap warning
      rule: >-
        When two active lists share a channel and dates for the same ticket type, show which one wins under the
        hierarchy and why (no lowest-price default).
      source: DI-595 | screens/P08-venue-back-office.yaml#BO-441
    actions:
    - action: Bulk change prices
      result: >-
        Runs as a dry run first ("212 products matched, 640 prices change, 4 skipped"), then applies on confirmation.
      source: contracts/spine/catalogue.yaml#bulkChangePrices
    - action: Save prices
      result: >-
        Saved to the list; the list shows "Not yet on tills" until the next catalogue release (PR-3).
      source: contracts/spine/catalogue.yaml#publishBundle
    edgeCases:
    - case: A price in a currency the region does not use
      expected: >-
        Cannot be entered, because the currency is not editable; an imported file with another currency is rejected
        with the rows named.
      source: contracts/spine/catalogue.yaml#setPrices
    - case: A list valid from a future date
      expected: Shown as scheduled with its start date; today's prices still come from the current list.
      source: DI-357
    consistency:
    - with: ADM-049
      note: >-
        The TICVAI Console price list master edits the same concept; same columns, status badges and wording (PR-10).
    - with: BO-441
      note: >-
        Conflicts between rules are resolved on BO-441; this screen links there from the overlap warning.
    sampleData:
      priceLists:
      - code: DUNE-B2C-2026
        name: B2C 2026-27
        channels:
        - Website
        - App
        - Kiosk
        - Point of sale
        valid: 2026-10-01 to 2027-09-30
        priority: 10
        status: Active
      - code: DUNE-B2B-2026
        name: Tour operators 2026-27
        channels:
        - B2B partners
        priority: 20
        status: Active
      - code: DUNE-SUMMER-27
        name: Summer 2027
        channels:
        - Website
        - App
        valid: 2027-06-15 to 2027-08-31
        status: Draft
      prices:
        Day Pass, Adult: AED 295.00
        Day Pass, Child: AED 245.00
        Day Pass, Adult (B2B): AED 236.00
      dynamicRule:
        code: WEEKEND-UPLIFT
        when: Saturday or Friday, occupancy over 70%
        then: +10%
        minPrice: AED 295.00
        maxPrice: AED 349.00
    corrections:
    - what: >-
        Dynamic rule conditions and actions are free strings (type, ruleOperator, valueJson) and minPrice/maxPrice
        are plain numbers.
      why: >-
        A no-code builder needs enumerated condition types and operators; prices must be Money with the region's
        scale (ADR-0008).
      source: >-
        contracts/spine/catalogue.yaml#/components/schemas/PricingDynamicPriceCondition | contracts/spine/catalogue.yaml#/components/schemas/PricingDynamicPriceAction
      status: logged
      by: CHG-SBO-005
    - what: >-
        Price list priority has no stated direction (default 0), while promotions say "higher evaluates first" and
        the pack rule builders say "lower wins".
      why: The same word means opposite orders on adjacent screens; one direction must be fixed.
      source: >-
        contracts/spine/catalogue.yaml#createPriceList | contracts/satellite/promotions.yaml#createPromotion | contracts/spine/catalogue.yaml#setDemandOccupancyAvailability
      status: fixed
      by: CHG-SBO-010
    - what: >-
        List operation(s) listDynamicPriceRules return a bare array, not the paged list envelope (items, nextCursor,
        hasMore).
      why: >-
        The table cannot page, and a row without an id cannot open, edit or link to the record it summarises.
      source: contracts/spine/catalogue.yaml#listDynamicPriceRules
      status: logged
      by: CHG-SBO-005
  BO-010:
    block: A
    summary: >-
      The venue's promotions desk: promotions, coupon campaigns and their codes, voucher batches and the dashboard
      that says what each is costing. It must keep three different things apart (a promotion changes a price, a
      coupon code unlocks one, a voucher carries money) and it must never let a promotion go live without the stacking
      check.
    inputs:
    - field: discount
      rule: >-
        The kind is chosen first (Percentage, Fixed amount off, Fixed price, Buy X get Y, Free item, Tiered percentage)
        and only that kind's inputs show; Buy X get Y shows "Buy 2, get 1 at 100% off" as a sentence builder.
      source: >-
        contracts/satellite/promotions.yaml#/components/schemas/Discount | contracts/satellite/promotions.yaml#/components/schemas/DiscountKind
        | DI-174 | DI-357
    - field: stackingMode
      rule: >-
        Required, never defaulted silently: Exclusive, Stackable, Best only, Stack within group (group name then
        required); precedence shown as "evaluated first when several apply".
      source: contracts/satellite/promotions.yaml#/components/schemas/StackingMode
    - field: coupon campaign type
      rule: >-
        One shared code (with a redemption limit, for social media) or a batch of unique single-use codes; generating
        a batch is asynchronous, up to 50,000 at a time, and produces a file to download.
      source: >-
        contracts/satellite/promotions.yaml#createCouponCampaign | contracts/satellite/promotions.yaml#generateCouponCodes
        | DI-173
    - field: budgetCap
      rule: >-
        Money; explained as "stops the promotion at checkout once this much discount has been given".
      source: contracts/satellite/promotions.yaml#createPromotion | R101
    outputs:
    - element: promotion row
      rule: >-
        Status badge (Draft, Scheduled, Live, Paused, Expired, Ended), valid dates, redemptions, discount given
        against budget as a bar.
      source: contracts/satellite/promotions.yaml#getPromotionUsage
    - element: conflict analysis
      rule: >-
        Before Publish, the overlapping live promotions, the combined worst-case discount and the resulting line
        price.
      source: contracts/satellite/promotions.yaml#analysePromotionConflicts
    - element: simulation
      rule: >-
        Over a past period, orders that would have qualified, discount total, incremental orders and whether the
        budget would have been breached.
      source: contracts/satellite/promotions.yaml#simulatePromotion
    actions:
    - action: Publish
      result: >-
        Runs the conflict analysis; refused when a combination leaves a line at zero or below or under the venue's
        near-zero setting, naming the promotions; otherwise goes live or scheduled and reaches tills with the next
        catalogue release.
      source: contracts/satellite/promotions.yaml#publishPromotion | R101 | R096
    - action: Pause / End / Unschedule
      result: >-
        Pause keeps carts already priced at their price; End is a decision recorded with a reason, distinct from
        Expired; Unschedule returns a scheduled promotion to draft.
      source: >-
        contracts/satellite/promotions.yaml#pausePromotion | contracts/satellite/promotions.yaml#endPromotion |
        contracts/satellite/promotions.yaml#unschedulePromotion
    - action: Void code / void voucher
      result: >-
        Reason required; voiding a part-used voucher does not reverse what was already spent, and the dialog says
        so.
      source: >-
        contracts/satellite/promotions.yaml#voidVoucher | contracts/satellite/promotions.yaml#voidCouponCode
    edgeCases:
    - case: Editing a live promotion
      expected: Conditions and discount are locked; only pause, extend (end date) or end are offered.
      source: contracts/satellite/promotions.yaml#updatePromotion
    - case: A/B variants
      expected: >-
        Traffic percentages must total exactly 100; a variant at 0 is kept and shown as receiving no traffic.
      source: contracts/satellite/promotions.yaml#setPromotionVariants | R101
    consistency:
    - with: ADM-148
      note: >-
        The P09 rule builder edits promotions too; same states, stacking vocabulary and conflict panel (PR-10).
    - with: ADM-159
      note: Same coupon campaign concepts (shared vs unique) and wording.
    sampleData:
      promotions:
      - code: SUMMER-BOGO
        name: Buy 2 Day Passes, get the 3rd free
        nameAr: اشترِ تذكرتين واحصل على الثالثة مجاناً
        kind: buyXGetY
        status: Live
        stacking: Exclusive
        budgetCap: AED 50,000.00
        given: AED 18,240.00
      - code: RESIDENT-15
        name: UAE residents 15% off weekdays
        kind: percentage
        status: Scheduled
        validFrom: '2026-11-01'
      couponCampaign:
        code: INSTA-DUNE
        type: One shared code
        maxRedemptions: 500
        discount: 10%
      voucherBatch:
        name: Corporate gift vouchers Q4
        faceValue: AED 200.00
        quantity: 1000
        outstandingLiability: AED 164,400.00
    corrections:
    - what: >-
        The screen carries 26 operations (dashboards, reports, A/B tests, vouchers, campaigns) on one page.
      why: >-
        The client asked for consolidation, but a voucher batch (a liability) and a promotion (a price rule) are
        different records; draw them as tabs of one desk with separate lists, not one form.
      source: screens/P08-venue-back-office.yaml#BO-010 | DI-987
      status: fixed
      by: CHG-SBO-010
  BO-011:
    block: A
    summary: >-
      Where the venue builds what sells as one line: ticket bundles (admission plus meal plus retail), group packages
      (school trips, birthday parties), F&B meal combos and how each is priced. The thing to get right is the revenue
      allocation: it is mandatory, it is what the ledger splits, and components cannot change once a bundle has
      sold.
    inputs:
    - field: components and choice groups
      rule: >-
        Fixed components (ticket type and quantity) and, for a dynamic bundle, choice groups ("choose 3 of 5 attractions")
        on one canvas; the bundle price is fixed and the guest's choice only changes the allocation.
      source: contracts/satellite/promotions.yaml#createBundle | ADR-0019 | DI-435
    - field: allocation
      rule: >-
        Required before save; default proportional to the components' list prices, shown as amounts and percentages
        that must total the bundle price exactly (rounding remainder shown on one line).
      source: contracts/satellite/promotions.yaml#createBundle | R101 | ADR-0008
    - field: group package
      rule: >-
        Kind School or Party; maximum participants; duration (minimum 15 minutes); hosts included; priced per participant
        or per package; free leader ratio for schools (one teacher per 10 pupils by default); payment by invoice
        (schools), deposit (parties) or full.
      source: contracts/spine/catalogue.yaml#setGroupPackageDefinition
    - field: package pricing model
      rule: >-
        Fixed package price, sum of components, discounted component sum or component override; and whether the
        guest sees the total only, each component, or the component and the saving.
      source: contracts/spine/catalogue.yaml#setPackagePricingDefinition
    outputs:
    - element: saving
      rule: >-
        Savings amount and percentage against the components bought separately, as the guest will see it.
      source: contracts/satellite/promotions.yaml#createBundle
    - element: visual map of a multi-venue bundle
      rule: >-
        Which venues, meal vouchers, parking or upgrades the bundle includes, drawn as a small map or diagram.
      source: DI-469
    actions:
    - action: Publish to tills
      result: >-
        Publishes the venue's catalogue release (not the bundle alone); the confirmation says every pending catalogue
        change at the venue goes with it and shows how many workstations have applied the last release.
      source: >-
        contracts/spine/catalogue.yaml#publishBundle | contracts/spine/catalogue.yaml#reportBundleApplied
    edgeCases:
    - case: Editing a bundle that has sold
      expected: >-
        Components and allocation are read-only with "sold since 12 Oct"; name, price, end date and on-sale remain
        editable.
      source: contracts/satellite/promotions.yaml#updateBundle
    - case: Combo with a slot that has no default
      expected: Warn that every till will need extra taps; a default per slot is expected in practice.
      source: contracts/satellite/fnb.yaml#setComboSlots
    consistency:
    - with: ADM-179
      note: >-
        Bundle Definition & Setup on P09 edits the same bundle; same type names and sections (PR-10).
    - with: BO-045
      note: >-
        Meal combos are F&B (fnb-retail process); this screen shows them with the same slot editor.
    sampleData:
      bundle:
        code: DUNE-FAMILY4
        name: Family Fun Bundle (2 adults, 2 children, lunch)
        nameAr: باقة المرح العائلية
        price: AED 899.00
        saving: AED 181.00 (17%)
        allocation:
        - c: Day Pass Adult x2
          a: AED 491.30
        - c: Day Pass Child x2
          a: AED 407.70
      groupPackage:
        kind: school
        name: Half-day school trip
        maxParticipants: 30
        duration: 240
        pricing: per pupil
        freeLeaderRatio: 10
        payment: invoice
    corrections:
    - what: >-
        "Report bundle applied" (reportBundleApplied) is offered as a form on this screen, and publishBundle publishes
        the whole catalogue release, not the sellable bundle.
      why: >-
        A workstation reports a release; no person on a back-office screen does. The name collision (catalogue bundle
        vs bundle) is what put it here.
      source: >-
        contracts/spine/catalogue.yaml#reportBundleApplied | contracts/spine/catalogue.yaml#listCatalogueBundles
      status: fixed
      by: CHG-WIR-025
    - what: >-
        List operation(s) listCatalogueBundles return a bare array, not the paged list envelope (items, nextCursor,
        hasMore).
      why: >-
        The table cannot page, and a row without an id cannot open, edit or link to the record it summarises.
      source: contracts/spine/catalogue.yaml#listCatalogueBundles
      status: logged
      by: CHG-SBO-005
  BO-012:
    block: A
    summary: >-
      Membership products: what an annual pass or membership grants, for how long, and how it renews. It is the
      product configuration (BO-008) seen through the entitlement: validity anchor, entries, days, blackout dates,
      fast track, stored value and renewal. The thing to get right is expiry: "ends 31 December" and "a year from
      purchase" must be distinguishable at a glance.
    inputs:
    - field: entitlement template
      rule: >-
        Validity kind first (single use, dated, date range, rolling, unlimited, count limited), then the expiry
        anchor (days after, end of month, quarter, year, fixed date, season end); blackout dates on a calendar;
        entries allowed empty means unlimited.
      source: contracts/spine/catalogue.yaml#createEntitlementTemplate | DI-171 | DI-451 | DI-452
    - field: renewal
      rule: >-
        Auto-renew default, renewal term, grace days and the ticket type it renews into, grouped under "Renewal".
      source: contracts/spine/catalogue.yaml#createEntitlementTemplate | TRACKER Actions row 140
    - field: purchase eligibility
      rule: >-
        Residency, age and minimum loyalty tier for buying the membership, distinct from where it admits.
      source: contracts/spine/catalogue.yaml#createEntitlementTemplate | DI-463
    outputs:
    - element: entitlement summary sentence
      rule: >-
        The template rendered as one line a guest could read ("Unlimited entry, every day except public holidays,
        12 months from first visit, fast track Express").
      source: contracts/spine/catalogue.yaml#createEntitlementTemplate
    actions:
    - action: New entitlement template
      result: Created and selected on the product; reusable by other products at other prices.
      source: contracts/spine/catalogue.yaml#listEntitlementTemplates
    edgeCases:
    - case: First-use activation never used
      expected: >-
        A fallback expiry is required (for example issue date + 30 days) and the form will not save without it.
      source: DI-451
    consistency:
    - with: BO-008
      note: Same record and header; this screen is the membership view of it (PR-10).
    sampleData:
      membership:
        name: Annual Pass Gold
        nameAr: الاشتراك السنوي الذهبي
        code: DUNE-ANNUAL-GOLD
        price: AED 1,450.00
      entitlement:
        validity: rolling 365 days
        anchor: from purchase
        entries: unlimited
        blackout:
        - '2026-12-02'
        - '2026-12-31'
        fastTrack: express
        autoRenew: true
        graceDays: 14
    corrections:
    - what: >-
        List operation(s) listEntitlementTemplates, listAlternativeCodes return a bare array, not the paged list
        envelope (items, nextCursor, hasMore).
      why: >-
        The table cannot page, and a row without an id cannot open, edit or link to the record it summarises.
      source: >-
        contracts/spine/catalogue.yaml#listEntitlementTemplates | contracts/spine/catalogue.yaml#listAlternativeCodes
      status: logged
      by: CHG-SBO-005
  BO-013:
    block: B
    summary: >-
      Where each product may be sold and how much of a performance's capacity each channel may take: channel capacity
      ("envelopes"), the split across channels with a shared general pool, and OTA listings with their own allocation.
      The thing to get right: an allocation is a ceiling a channel sells against, and giving an OTA the whole envelope
      means the OTA sells all of it.
    inputs:
    - field: allocations
      rule: >-
        Per channel a number of units, shown as a stacked bar against capacity with the unallocated remainder labelled
        "General pool, any channel once its own share is used"; the total cannot exceed capacity and a channel cannot
        go below what it has sold (including units under an unexpired hold).
      source: contracts/spine/catalogue.yaml#setChannelAllocations | DI-170 | R101
    - field: OTA listing
      rule: >-
        Channel (Viator, Klook, Headout, GetYourGuide, Tiqets, Expedia, other), external product reference, allocation
        units, price list, push interval (default 15 minutes, labelled as the oversell window) and the guest data
        the OTA passes through.
      source: contracts/satellite/subscription.yaml#setChannelListing
    outputs:
    - element: per-channel sold and remaining
      rule: >-
        For each envelope, sold, held, remaining per channel and in the pool; OTA rows show last push time.
      source: contracts/spine/catalogue.yaml#setChannelAllocations
    actions:
    - action: Release allocation
      result: Returns a channel's unsold units to the pool with a reason; sold units stay sold.
      source: contracts/spine/catalogue.yaml#relinquishChannelAllocation
    edgeCases:
    - case: Reducing a channel below what it has sold
      expected: Refused with the sold count named ("B2B has sold 42; minimum 42").
      source: contracts/spine/catalogue.yaml#setChannelAllocations
    consistency:
    - with: BO-017
      note: Same envelope bar component and the same channel labels (vocabulary Channel).
