  BO-014:
    block: B
    summary: >-
      Push catalogue changes to the tills and devices now or on a schedule, and see what is pending: products approved
      but not released, price lists changed, items marked unavailable. Publishing is what changes what every till
      charges, so it is its own deliberate step (F78 step 4).
    outputs:
    - element: pending changes
      rule: >-
        A list of what the next catalogue release will carry (products, prices, promotions, sale boards) grouped
        by kind with who changed it and when; the current release version and how many workstations have applied
        it.
      source: >-
        F78 step 4 | contracts/spine/catalogue.yaml#publishBundle | contracts/spine/catalogue.yaml#reportBundleApplied
    actions:
    - action: Publish to tills
      result: >-
        Signs and publishes the venue's release with a note and a staleness bound; terminals pick it up and report;
        a terminal past its bound refuses to trade, so the staleness hours are shown.
      source: contracts/spine/catalogue.yaml#publishBundle
    - action: Mark item unavailable
      result: >-
        Immediate on every terminal and guest menu of the outlet, not waiting for a release; optional restore time.
      source: contracts/satellite/fnb.yaml#setItemAvailability | R110
    edgeCases:
    - case: Nothing pending
      expected: Publish is disabled with "Tills are up to date (version 2026.11.14-3)".
      source: designer default
    consistency:
    - with: BO-037
      note: Same release version identifier and the same "applied by N of M devices" component.
    sampleData:
      release:
        current: 2026.11.14-3
        published: 14 Nov 09:12 by Layla Hassan
        applied: 38 of 41 tills
        staleAfterHours: 48
      pending:
      - kind: price
        item: Day Pass Adult, B2C list
        change: AED 295.00 to AED 310.00 from 1 Dec
      - kind: product
        item: Twilight Ticket
        change: Approved, not released
    corrections:
    - what: >-
        The screen repeats the whole product editor (create, attributes, alternative codes, lifecycle) of BO-007
        and BO-008.
      why: >-
        A publishing screen needs the pending list and the release action; editing belongs to the product configuration
        (DI-987).
      source: screens/P08-venue-back-office.yaml#BO-014
      status: fixed
      by: CHG-SBO-017
    - what: >-
        List operation(s) listAlternativeCodes return a bare array, not the paged list envelope (items, nextCursor,
        hasMore).
      why: >-
        The table cannot page, and a row without an id cannot open, edit or link to the record it summarises.
      source: contracts/spine/catalogue.yaml#listAlternativeCodes
      status: fixed
      by: CHG-WIR-025
  BO-015:
    block: B
    summary: >-
      The calendar of performances (time slots, shows, sessions) with how full each is: create them in bulk from
      a pattern, edit capacity individually or in bulk, suspend, resume or cancel. The client asked that time-slot
      creation previews the slots before any is created (DI-995).
    inputs:
    - field: bulk creation
      rule: >-
        Start and end date, days of the week, first and last start time, interval between starts, slot length, minutes
        still sellable after start, entry window, language and format; a preview grid of the slots that will be
        created before Create.
      source: DI-995 | DI-167 | contracts/spine/catalogue.yaml#createPerformances | REV3-17
    - field: cancellation
      rule: >-
        Reason, guest message, refund percentage, an alternative performance to offer; a dry run first shows affected
        orders, guests and refund exposure; the real run needs a supervisor PIN on the device.
      source: contracts/spine/catalogue.yaml#cancelPerformance | R144 | F09 step 2
    outputs:
    - element: calendar views
      rule: >-
        Day, week, month and agenda; the day view by hour from the venue's day start hour; each slot shows sold
        of capacity as a fill bar and its status.
      source: DI-919 | DI-907
    edgeCases:
    - case: Link to a performance that has happened
      expected: Offers the next performance of the same event.
      source: screens/P08-venue-back-office.yaml#BO-015
    - case: Capacity above remaining venue admission capacity
      expected: Blocked with a validation message; override only for authorised users.
      source: DI-456
    consistency:
    - with: BO-016
      note: >-
        The template defines the pattern; this calendar generates from it. Same field names (slot length, turnaround).
    sampleData:
      slots:
      - at: Sat 15 Nov 2026 10:00
        product: Aquarium Tour (English)
        sold: 38
        capacity: 40
      - at: '10:30'
        product: Aquarium Tour (Arabic)
        sold: 12
        capacity: 40
      - at: '11:00'
        status: suspended
        reason: Tank maintenance
  BO-016:
    block: B
    summary: >-
      The pattern the calendar is generated from: slot length, turnaround, concurrent capacity, peak bands and the
      walk-in policy. Kept separate from the calendar (R276): change the template, then regenerate.
    inputs:
    - field: walkIn
      rule: >-
        Configured, not assumed; it decides whether a family turning up on a Sunday is turned away. Shown as a clear
        yes/no with the walk-in share.
      source: contracts/spine/catalogue.yaml#setPerformanceTemplate
    - field: bands
      rule: Peak and off-peak time bands drawn on a 24-hour bar with capacity per band.
      source: contracts/spine/catalogue.yaml#setPerformanceTemplate | DI-453
    sampleData:
      template:
        code: AQ-TOUR-30
        name: Aquarium tour every 30 minutes
        slotMinutes: 25
        turnaroundMinutes: 5
        concurrentCapacity: 40
        bands:
        - 10:00-14:00 peak
        - 14:00-20:00 standard
        walkIn: 10% of each slot
    corrections:
    - what: >-
        List operation(s) listPerformanceTemplates return a bare array, not the paged list envelope (items, nextCursor,
        hasMore).
      why: >-
        The table cannot page, and a row without an id cannot open, edit or link to the record it summarises.
      source: contracts/spine/catalogue.yaml#listPerformanceTemplates
      status: logged
      by: CHG-SBO-005
  BO-017:
    block: B
    summary: >-
      How many people a performance can take and how that is split: sales capacity per channel envelope, and the
      waitlist for sold-out performances. Sales capacity (tickets) and admission capacity (people inside, counted
      by scans) are two different numbers and must be shown apart.
    outputs:
    - element: two capacities
      rule: >-
        Sales capacity per performance and live admission count against venue admission capacity, side by side with
        different labels.
      source: DI-455 | DI-456
    - element: waitlist
      rule: >-
        Who is waiting, in order, and how many places each asked for; "Offer freed capacity" invites them in order.
      source: >-
        contracts/spine/catalogue.yaml#listWaitlistEntries | contracts/spine/catalogue.yaml#offerWaitlistCapacity
    inputs:
    - field: capacity change
      rule: Bulk edit across selected performances is allowed; reducing below sold is refused.
