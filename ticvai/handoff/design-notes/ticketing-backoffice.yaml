        a one-line reason for each.
      source: contracts/spine/tenancy.yaml#setOfflinePolicy | DI-142
    - field: ceilings
      rule: >-
        Maximum hours offline (1 to 72, default 24), value ceiling in the venue's currency, transaction ceiling
        (1 to 5,000); the action at breach (warn, block new sales, block all) and whether a manager may extend.
      source: contracts/spine/tenancy.yaml#/components/schemas/OfflinePolicy | DI-405
    - field: scope
      rule: >-
        The policy is set at a node (venue, department, workstation group) and inherited below it (PR-4).
      source: contracts/spine/tenancy.yaml#setOfflinePolicy | ADR-0018
