  BO-696:
    block: A
    summary: >-
      Clone an event for next season choosing exactly what comes with it: schedule, prices, seat map, resource plan,
      staff roster; never the sales. Most events are last year's event, so this is a frequent act and must be a
      short checklist, not a wizard.
    inputs:
    - field: what to copy
      rule: >-
        Checklist of the parts with their counts (212 performances, 2 price lists, 1 seat map, 1 resource plan),
        all ticked except roster by default; dates shifted by a chosen offset.
      source: contracts/spine/catalogue.yaml#cloneEvent
    actions:
    - action: Clone
      result: Creates a draft event and opens it; nothing goes on sale.
      source: >-
        contracts/spine/catalogue.yaml#cloneEvent | contracts/spine/catalogue.yaml#setEventLifecycleState
    sampleData:
      clone:
        from: Dune Nights Festival 2026
        to: Dune Nights Festival 2027
        shiftDays: 364
        copy:
        - schedule
        - prices
        - seat map
    corrections:
    - what: >-
        The purpose and purposeNote describe automatic invoice generation for event customers, not cloning.
      why: >-
        The pack text of another screen (board 1 no. 08) was attached; the name and the only operation (cloneEvent)
        are about duplication.
      source: screens/P08-venue-back-office.yaml#BO-696 | F234 step 4
      status: fixed
      by: CHG-WIR-026
    - what: cloneEvent's request body is not specified in the packet (only eventId comes back).
      why: The screen needs the parts-to-copy and date-shift inputs to exist in the contract.
      source: contracts/spine/catalogue.yaml#cloneEvent
      status: logged
      by: CHG-SBO-005
    - what: >-
        No read operation: the screen declares only cloneEvent and nothing that returns the current configuration.
      why: >-
        It opens as an empty form even where a configuration exists; it needs a get or list for the same record
        (PR-9).
