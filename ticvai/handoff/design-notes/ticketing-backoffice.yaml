  BO-1183:
    block: A
    summary: >-
      The stations a venue's routes stop at, the first step of transport setup. A station with coordinates is placed
      on the route map; one without is listed in the stop list only. A station on an active route cannot be deactivated.
    inputs:
    - field: code
      rule: Short operator code, unique in the venue, at most 32 characters (SHJ-JUB).
      source: contracts/satellite/transport.yaml#createTransportStation
    - field: name and shortName
      rule: Every tenant language; the short name is what the route diagram and the map pin show.
      source: contracts/satellite/transport.yaml#createTransportStation
    - field: coordinates
      rule: Picked on a small map or typed; optional, with the "not on map" consequence stated.
      source: contracts/satellite/transport.yaml#createTransportStation
    edgeCases:
    - case: Deactivate a station on an active route
      expected: Refused; the dialog lists the routes and offers to open them.
      source: contracts/satellite/transport.yaml#updateTransportStation
    sampleData:
      stations:
      - code: AQ-METRO
        name: Al Qudra Metro
        nameAr: مترو القدرة
        short: Metro
      - code: DP-MAIN
        name: Dune Park Main Gate
        nameAr: البوابة الرئيسية دون بارك
        short: Main Gate
      - code: HOTEL-D
        name: Hotel District
        short: Hotels
  BO-1184:
    block: A
    summary: >-
      Where a venue builds each transport line as an ordered list of its stations and controls whether the line
      is on sale. A route is created as a draft and sells nothing until it is active with a fare table (BO-1185)
      and a published timetable (BO-1186); the screen must make that readiness visible per route. Creating a route
      also creates its catalogue side (an event and a timed product).
    inputs:
    - field: stops
      rule: >-
        An ordered, drag-to-reorder list of stations picked from BO-1183, each with its offset in minutes from the
        origin; the first is fixed at 0 and each later offset must be greater than the one before; boarding and
        alighting allowed per stop.
      source: >-
        contracts/satellite/transport.yaml#/components/schemas/RouteStopInput | screens/P08-venue-back-office.yaml#BO-1183
    - field: pairedRouteId
      rule: >-
        Optional picker of the route that runs the same line the other way; labelled "Return route".
      source: contracts/satellite/transport.yaml#createTransportRoute
    - field: bookingCutoffMinutes
      rule: Minutes before departure that online sale stops, 0 to 1440, default 5.
      source: contracts/satellite/transport.yaml#createTransportRoute
    outputs:
    - element: readiness per route
      rule: >-
        Three checks on each row, Fare table, Published timetable, Active, so a draft explains why it is not on
        sale.
      source: screens/P08-venue-back-office.yaml#BO-1184 | REV3-21
    actions:
    - action: Suspend
      result: >-
        Stops new sales and keeps sold tickets valid; the confirmation says so and a reason is required (PR-6).
      source: contracts/satellite/transport.yaml#setTransportRouteStatus
    edgeCases:
    - case: Change the stops while a published timetable covers a future date
      expected: Refused; withdraw the timetable first. Name, colour and cut-off can still change.
      source: contracts/satellite/transport.yaml#updateTransportRoute
    - case: Retire a route with sold departures on sale
      expected: Refused; the dialog lists those departures and links to the departure board (BO-1187).
      source: contracts/satellite/transport.yaml#setTransportRouteStatus
    consistency:
    - with: BO-1186
      note: >-
        Same route picker and route header (code, colour chip, status badge) on fares, timetables and passes.
    sampleData:
      routes:
      - code: E101-Out
        lineCode: E101
        name: Dune Park Shuttle, Metro to Main Gate
        nameAr: حافلة دون بارك، المترو إلى البوابة الرئيسية
        colour: '#0D6EFD'
        stops:
        - Al Qudra Metro 0
        - Hotel District 12
        - Main Gate 25
        status: active
      - code: E101-In
        pairedWith: E101-Out
        status: draft
        readiness:
          fareTable: false
          timetable: false
    decisions:
    - question: Are the popular-route card's starting fare, featured order and image set per route in the back office?
      decision: 'Drawn default accepted: Routes carry a featured order and an image; the starting fare is computed from the
        lowest fare.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-106 | CHG-NOTE-006
      questionSource: DI-1119
  BO-1185:
    block: A
    summary: >-
      A route's fares and the passenger types it sells (adult, child, student, person of determination), and a preview
      of what a trip costs. Fares are set by a holder of TRANSPORT_PRICE, separately from the timetable, and apply
      from a date; sold tickets keep their price.
    inputs:
    - field: model
      rule: >-
        Stop count (base fare plus per stop) or a matrix (one adult fare per ordered pair; the reverse pair is its
        own cell); the matrix shown as a triangle grid of stations.
      source: contracts/satellite/transport.yaml#setTransportFareTable
    - field: passengerTypes
      rule: >-
        Code, name, picker description ("Age 5-11, half fare"), share of the adult fare 0 to 1, age limits, proof
        checked at boarding; exactly one default type.
      source: contracts/satellite/transport.yaml#/components/schemas/PassengerType
    - field: effectiveFrom
      rule: >-
        Required; the confirmation names the route and the date and lists passenger types added or removed (each
        adds or retires a ticket type).
      source: >-
        contracts/satellite/transport.yaml#setTransportFareTable | screens/P08-venue-back-office.yaml#BO-1185
    outputs:
    - element: preview
      rule: From, to and party; shows stops travelled, adult fare, price per type and total.
      source: contracts/satellite/transport.yaml#quoteTransportFare
    sampleData:
      fareTable:
        route: E101-Out
        model: stopCount
        baseFare: AED 5.00
        perStopFare: AED 2.50
        types:
        - code: adult
          share: 1
        - code: child
          share: 0.5
          proof: Age 5-11
        - code: determination
          share: 0
          proof: Sanad card
        effectiveFrom: '2026-11-01'
      preview:
        from: Al Qudra Metro
        to: Main Gate
        party: 2 adults, 1 child
        total: AED 25.00
    corrections:
    - what: >-
        The preview calls quoteTransportFare, whose audience is guest, public and service, not staff.
      why: >-
        The staff screen calls an operation that does not declare the staff audience; add staff or give the screen
        its own preview.
      source: contracts/satellite/transport.yaml#quoteTransportFare
      status: logged
      by: CHG-SBO-005
  BO-1186:
    block: A
    summary: >-
      A route's timetables: departure times from the origin by day of week, valid over dates, drafted then published.
      Publishing generates departures up to the release horizon (proposed 30 days) and a nightly job releases one
      more day; a published timetable is never edited, it is superseded by a new one from a later date.
    inputs:
    - field: runs
      rule: >-
        A weekly grid (rows are times HH:MM, columns Mon to Sun) rather than a list; times in venue local time.
      source: contracts/satellite/transport.yaml#/components/schemas/TimetableRun
    - field: seat capacity and seat map
      rule: >-
        Seats per departure 1 to 200; optional coach seat map for seat selection, empty sells unallocated seats.
      source: contracts/satellite/transport.yaml#createTransportTimetable
    actions:
    - action: Publish
      result: >-
        Names the dates and number of departures going on sale and the timetable it supersedes from when.
      source: >-
        screens/P08-venue-back-office.yaml#BO-1186 | contracts/satellite/transport.yaml#publishTransportTimetable
    - action: Withdraw
      result: >-
        Reason required; removes unsold future departures; refused while any future departure has sold seats.
      source: contracts/satellite/transport.yaml#withdrawTransportTimetable
    edgeCases:
    - case: Edit a published timetable
      expected: Not offered; "Draft a new timetable from" a later date instead.
      source: contracts/satellite/transport.yaml#updateTransportTimetable
    sampleData:
      timetable:
        name: Winter 2026-27
        validFrom: '2026-11-01'
        validTo: '2027-03-31'
        releaseHorizonDays: 30
        seatCapacity: 49
        runs:
        - at: 08:00
          days:
          - mon
          - tue
          - wed
          - thu
          - fri
          - sat
          - sun
        - at: 08:30
          days:
          - fri
          - sat
    decisions:
    - question: Is the 30-day release horizon right for the client?
      decision: 'Drawn default accepted: 30, editable per timetable.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-107 | CHG-NOTE-006
      questionSource: REV3-21 | contracts/satellite/transport.yaml#createTransportTimetable
  BO-1187:
    block: C
    summary: >-
      Every departure on a route with seats sold; change a run's coach or capacity; cancel a run.
    actions:
    - action: Change capacity
      result: Refused below seats sold.
      source: contracts/satellite/transport.yaml#updateTransportDeparture
    - action: Cancel run
      result: Stops sales, notifies holders and queues a bulk refund for approval.
      source: contracts/spine/catalogue.yaml#cancelPerformance
    consistency:
    - with: BO-1184
      note: Retiring a route sends the user here to cancel sold departures.
    sampleData:
      departures:
      - route: E101-Out
        at: Sat 22 Nov 08:00
        sold: 41
        capacity: 49
        coach: Coach 7
  BO-1188:
    block: A
    summary: >-
      Multi-trip and unlimited transport passes. Creating a pass type creates its catalogue product (open-dated,
      entries equal to trips), so a pass sells through the ordinary basket and each boarding consumes an entry.
      The price is a multiple of the single adult fare, and the saving is measured against a stated number of trips.
    inputs:
    - field: kind, trips and referenceTrips
      rule: >-
        Multi-trip needs trips (2 to 100); unlimited needs referenceTrips (the trips a week or month the saving
        is compared with).
      source: contracts/satellite/transport.yaml#createTransportPassType
    - field: fareMultiplier
      rule: >-
        Shown with the resulting price and saving for a sample journey ("10 trips at 8x the adult fare: AED 120.00,
        save AED 30.00").
      source: contracts/satellite/transport.yaml#createTransportPassType
    - field: routeIds
      rule: Empty means every active route; say so.
      source: contracts/satellite/transport.yaml#createTransportPassType
    edgeCases:
    - case: Change a pass type that has sold
      expected: Applies to passes sold after it; sold passes keep trips, validity and price.
      source: contracts/satellite/transport.yaml#updateTransportPassType
    sampleData:
      passTypes:
      - code: CARNET10
        name: 10-trip card
        nameAr: بطاقة 10 رحلات
        kind: multiTrip
        trips: 10
        fareMultiplier: 8
        validityDays: 60
      - code: WEEK-UNL
        name: 7-day unlimited
        kind: unlimited
        referenceTrips: 14
        fareMultiplier: 10
        validityDays: 7
  BO-1189:
    block: A
    summary: >-
      Bulk entry of a venue's network (stations, routes with stops, timetables) from a CSV bundle or a GTFS feed:
      upload, validate, review the preview and every finding, then a person applies. Nothing goes on sale on apply:
      routes arrive as drafts and timetables unpublished.
    outputs:
    - element: preview
      rule: >-
        Counts to create and update per kind (stations, routes, stops, timetables) and findings with row and file,
