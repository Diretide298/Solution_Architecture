  BO-037:
    block: B
    summary: >-
      What each device is enforcing right now: the catalogue release it applied, the offline access package it holds
      and the offline sales it has not yet synced or that were refused. Not what was configured, what is in force
      on the device (F89 step 3).
    outputs:
    - element: device table
