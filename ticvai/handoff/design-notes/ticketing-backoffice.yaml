      by: CHG-MOV-008
  ADM-049:
    block: A
    summary: >-
      The price list master on the TICVAI Console: the container that holds rates, its type, scope, owner, defaults
      (rate category, rounding profile, price hierarchy) and what it allows (overrides, inheritance, product-specific
      rates). Duplicate creates a new list from an old one (UAE Standard 2026 into UAE Standard 2027). Approval
      and publication of a list belong to the governance board, not here.
    inputs:
    - field: scope and venue context
      rule: >-
        Scope (global, country, market, brand, venue, event, business unit) decides which of market, country, brand
        and venue are asked; the tenant and venue come from the console context (PR-1).
      source: contracts/spine/catalogue.yaml#setPriceListMaster | R098
    - field: defaults
      rule: >-
        Default rate category, rounding profile and price hierarchy are pickers of records from ADM-050, ADM-075
        and ADM-055, never free codes.
      source: contracts/spine/catalogue.yaml#setPriceListMaster
    - field: status
      rule: >-
        Only Draft, Configured, Inactive and Archived are set here; Validated comes from structure validation (ADM-057),
        Active and Expired from governance. Show the others read-only.
      source: contracts/spine/catalogue.yaml#setPriceListMaster
    outputs:
    - element: consuming modules
      rule: >-
        The modules that use this list (ticketing, B2C, POS, kiosk, B2B, group sales, membership, F&B, retail, rental)
        as chips, so a change's reach is visible.
      source: contracts/spine/catalogue.yaml#setPriceListMaster
    - element: Where this screen lives
      rule: 'A venue screen: it moves to Venue Management (P08) and merges with BO-008 product, BO-009 price matrix, BO-010
        promotions and BO-011 bundles, so one surface edits each record. TICVAI staff reach it only under a platform-staff
        grant (R098).'
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-006)
    actions:
    - action: Duplicate
      result: New draft list with "copied from" set; the user is asked for the new code and validity.
      source: contracts/spine/catalogue.yaml#setPriceListMaster | DI-592
    consistency:
    - with: BO-009
      note: >-
        The venue's price lists on P08 are the same concept; same columns, badges and wording (PR-10).
    sampleData:
      list:
        code: UAE-STD-2027
        name: UAE Standard 2027
        nameAr: الأسعار القياسية الإمارات 2027
        type: venue
        scope: venue
        venue: Dune Park
        owner: Revenue manager
        clonedFrom: UAE-STD-2026
        consumingModules:
        - ticketing
        - b2c
        - pos
        - kiosk
    corrections:
    - what: >-
        setPriceListMaster takes a defaultCurrency, and creates price lists a second way beside createPriceList.
      why: >-
        Currency resolves from the region and cannot be chosen (ADR-0018, updatePriceList); two writers with two
        status vocabularies (draft, configured, inactive, archived vs CatalogueConfigStatus) for one record.
      source: >-
        contracts/spine/catalogue.yaml#setPriceListMaster | contracts/spine/catalogue.yaml#createPriceList | ADR-0018
      status: logged
      by: CHG-MOV-008
    - what: >-
        No read operation: the screen declares only setPriceListMaster and nothing that returns the current configuration.
      why: >-
        It opens as an empty form even where a configuration exists; it needs a get or list for the same record
        (PR-9).
      source: >-
        contracts/spine/catalogue.yaml#setPriceListMaster | screens/P08-venue-back-office.yaml#ADM-049
      status: fixed
      by: CHG-WIR-025
    decisions:
    - question: 'The pack-derived Commercial screens (ADM-048 to ADM-317, ADM-559 to ADM-698) live on the TICVAI Console but
        configure venue-scoped records that the venue also edits on P08 (BO-009, BO-010, BO-011). Who uses them: the venue''s
        own commercial team, or TICVAI staff acting for a tenant?'
      decision: 'The 410 workshop-pack screens on the TICVAI Console (370 Commercial, 20 Catalogue lifecycle, 20 Rules and
        workflow) are venue screens: move them to Venue Management (P08) and merge them with BO-008 product, BO-009 price
        matrix, BO-010 promotions, BO-011 bundles and the rules/workflow screens, so one surface edits each record. TICVAI
        staff reach them only through a platform-staff grant (R098).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-100 | CHG-NOTE-006
      questionSource: R098 | screens/P08-venue-back-office.yaml#ADM-049 | contracts/spine/catalogue.yaml#setPriceListMaster
    - question: Which way does price list priority run (does the higher or the lower number win)?
      decision: 'Drawn default stands (answer: "Default: higher number wins"): Label it "Higher number wins" and show the
        overlapping lists.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-101 | CHG-NOTE-006
      questionSource: contracts/spine/catalogue.yaml#createPriceList
  ADM-050:
    block: A
    summary: >-
      The tenant's standard library of price categories (who is priced: Adult, Child, Resident) and rate types (how:
      Standard, Peak, Member), so venues stop inventing "Adult Standard" and "Normal Adult". Standard entries ship
      with the tenant and can be deactivated, never deleted.
    inputs:
    - field: entryKind and code
      rule: >-
        Two tabs, Price categories and Rate types; code unique within its kind in the tenant, at most 40.
      source: contracts/spine/catalogue.yaml#setPriceCategoryRateType
    - field: parentId
      rule: A parent of the same kind only (Child under Youth), shown as a tree.
      source: contracts/spine/catalogue.yaml#setPriceCategoryRateType
    - field: localizedDisplayNames
      rule: The guest-facing name per language; the internal name stays English (PR-8).
      source: contracts/spine/catalogue.yaml#/components/schemas/PriceCategory
    edgeCases:
    - case: Deactivate a standard entry in use
      expected: >-
        Allowed, with the number of rates and ticket types using it shown first; delete is not offered for standard
        entries.
      source: contracts/spine/catalogue.yaml#/components/schemas/PriceCategory
    sampleData:
      priceCategories:
      - code: ADULT
        name: Adult
        nameAr: بالغ
        standard: true
      - code: CHILD
        name: Child (3-11)
        nameAr: طفل (3-11)
        standard: true
      - code: RESIDENT
        name: UAE resident
        nameAr: مقيم في الإمارات
      rateTypes:
      - code: STD
        name: Standard
      - code: PEAK
        name: Peak
      - code: MEMBER
        name: Member
    corrections:
    - what: >-
        The list operation is venue-scoped (PRODUCT_VIEW) while the write is tenant-scoped (PRICE_CONFIGURE).
      why: >-
        A tenant library read at venue scope may show a partial library; scope and permission vocabularies should
        match.
      source: >-
        contracts/spine/catalogue.yaml#listPriceCategoryRate | contracts/spine/catalogue.yaml#setPriceCategoryRateType
      status: logged
      by: CHG-MOV-008
  ADM-051:
    block: A
    summary: >-
      The core commercial configuration: the monetary rates inside a price list, as a matrix of price category by
      rate type with a unit basis (per ticket, per person, per hour, per performance, per package, per membership
      period). Derived rates (Child = Adult minus 25%, VIP = Standard plus AED 200) are relationships, not dynamic
      pricing. Validation on save: duplicates, missing amounts, unsupported currency, invalid or circular derived
      rates.
    inputs:
    - field: amount or derivedFrom
      rule: >-
        A cell holds either an amount or a derivation (base rate and adjustment); a derived cell shows its computed
        amount greyed with the formula on hover; amount is ignored when derived.
      source: contracts/spine/catalogue.yaml#setRateStructure
    - field: precision
      rule: 0 to 3 decimals, the third kept where the currency needs it.
      source: contracts/spine/catalogue.yaml#setRateStructure | DI-598
    actions:
    - action: Matrix actions
      result: >-
        Add rate, Duplicate, Edit, Disable, Sort, Copy across categories, Compare, as buttons on the matrix.
      source: contracts/spine/catalogue.yaml#setRateStructure
    edgeCases:
    - case: Circular derived rates (Adult from Child, Child from Adult)
      expected: Refused on save with the cycle drawn.
      source: contracts/spine/catalogue.yaml#setRateStructure
    sampleData:
      rates:
      - category: Adult
        type: Standard
        basis: perTicket
        amount: AED 295.00
      - category: Child
        type: Standard
        derivedFrom: Adult -25%
        amount: AED 221.25
      - category: Adult
        type: Peak
        derivedFrom: Standard +AED 40.00
    corrections:
    - what: setRateStructure accepts a currency per rate.
      why: >-
        Currency resolves from the region (ADR-0018); a rate in another currency is exactly what setPrices refuses.
      source: contracts/spine/catalogue.yaml#setRateStructure | ADR-0018
      status: logged
      by: CHG-MOV-008
    - what: >-
        Rates are written by setRateStructure here and by setPrices on BO-009, two writers for the price of one
        ticket type.
      why: The designer cannot tell which the tills read; the lead should name one writer.
      source: contracts/spine/catalogue.yaml#setPrices
      status: logged
      by: CHG-MOV-008
    - what: >-
        No read operation: the screen declares only setRateStructure and nothing that returns the current configuration.
      why: >-
        It opens as an empty form even where a configuration exists; it needs a get or list for the same record
        (PR-9).
      source: >-
        contracts/spine/catalogue.yaml#setRateStructure | screens/P08-venue-back-office.yaml#ADM-051
      status: fixed
      by: CHG-WIR-025
    - what: >-
        Pack actions with no operation: Per Ticket, Per Resource, Per Package, Per Membership Period.
      why: >-
        The workshop pack names them on this screen and no operation serves them; each needs an operation or removal
        from the screen.
      source: screens/P08-venue-back-office.yaml#ADM-051
      status: logged
      by: CHG-MOV-008
