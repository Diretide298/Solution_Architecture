    summary: >-
      Move product configuration between environments (development, sandbox, UAT, staging, production): export,
      import, reference mapping, missing references.
    outputs:
    - element: transfer jobs
      rule: Direction, source and target environment, products, missing references, status.
      source: contracts/spine/catalogue.yaml#listProductImportExport
    - element: How production changes
      rule: Never merge or reverse-migrate a production database. Schema goes forward only, through versioned migrations (expand,
        then contract). Configuration moves as a versioned package exported with stable keys, diffed against production, approved,
        applied as an idempotent upsert by key and audited; rollback re-applies the previous package. Secrets and environment
        settings never travel in it.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-006)
    sampleData:
