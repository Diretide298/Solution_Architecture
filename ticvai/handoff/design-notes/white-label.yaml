inputToOutput:
- input: 'CMS-005 Primary colour #0E7C86 (white text on it 4.9:1, passes AA)'
  output: >-
    Primary buttons (Continue, Add to basket unless addToCart is set), the active step of the step indicator, links,
    selected date and time chips, the selected seat, the active tab icon and the Buy tickets button (unless
    buyTicketsButton is set) all turn #0E7C86 after the publish.
  screens: [WEB-001, WEB-005, WEB-006, WEB-007, WEB-010, GST-001, GST-007, GST-008, GST-049, KSK-004]
  source: [contracts/satellite/white-label.yaml#/components/schemas/Theme, sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html]
