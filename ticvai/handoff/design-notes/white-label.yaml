    edgeCases:
    - case: Store build with the minimum version not yet approved
      expected: The guest is stuck until it is released; the tenant is warned on CMS-001 before setting it.
      source: contracts/satellite/white-label.yaml#/components/schemas/AppBuild
    consistency:
    - with: WEB-029
      note: Same states and wording.
    sampleData:
      forcedUpdate: {installed: 2.2.1, minimum: 2.3.0, en: Update Coastal Aqua to keep booking., ar: حدّث تطبيق كوستال أكوا لمتابعة الحجز.}
    corrections:
    - what: No maintenance state, although the screen is "Maintenance / Upgrade Page".
      why: isInMaintenance with its message and expected-back time is the main case.
      source: [contracts/satellite/white-label.yaml#setMaintenanceMode, DI-215]
