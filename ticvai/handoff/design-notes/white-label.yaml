# Design notes for the White Label & CMS process -- AUTHORED. Edit by hand; nothing regenerates it.
# Schema and rules: README.md beside this file. Read with the brief in scratchpad/process-split/BRIEF.md.
process: white-label
title: White Label & CMS
owner: white-label process agent (Claude), 1 October 2026
coverage: >-
  All 40 screens of the white-label TSV. Block A (32, the first release, per handoff/service-docs/tasks.csv and
  block-a-schedule.json): WEB-001, WEB-028, WEB-029, WEB-045, GST-001, GST-038, GST-040, GST-043, GST-047, GST-057,
  ADM-016, ADM-017, ADM-018, CMS-001 to CMS-008, CMS-011, CMS-012, CMS-014 to CMS-017, CMS-101 to CMS-104 and BO-839
  (written in full). Later (8, no first-release task): KSK-002, BO-599, BO-834, BO-835, BO-836, BO-837, BO-840, BO-843
  (summary, the thin inputs and outputs, sample data). No Block B screen is in this process.

processSummary:
  text: >-
    A tenant (one operator, one or many venues) brands and arranges its own guest surfaces, the guest web (P01), the
    guest app (P02) and the kiosk (P05), from the Venue CMS (P13, a section of the Venue Management app), and TICVAI
    platform staff can do the same from the console (P09 ADM-016..018) only under a time-boxed grant into the tenant.
    Everything is configuration over a fixed structure: the guest flow, the page structure and the components are
    TICVAI's and stay the same for every tenant; the tenant chooses graphics, colours, fonts, which modules and tabs
    appear, the order of homepage sections and booking steps within allowed limits, copy in each language, and its
    domain. It never adds components. Work happens in ONE working draft per tenant; nothing a guest sees changes until
    a person with TENANT_PUBLISH publishes the draft as an immutable version (with a note), and a rollback is restore
    into the draft, review the diff, then publish, never one click. Three things are deliberately outside the draft
    and take effect at once: the live app status (maintenance, minimum app version, contact, sold out or closed), a
    venue's Help me choose publish, and policies (each save is a new version). Build-time parts (app icons, native
    splash, custom font files, wallet and payment integrations) reach guests only with a new store build, which the
    client publishes under its own Apple and Google accounts (CMS-104). Staff surfaces (POS, scanner, staff app,
    kitchen display) never take tenant branding; every guest surface carries the "Powered by TICVAI" credit, a
    toggle that is on by default (decided 2 October 2026, CHG-NOTE-009; DI-297 amended). Arabic is a first-class layout: enabling `ar` requires an Arabic font, the whole layout
    mirrors (numbers, times, codes and logos do not), and every authored text is a per-language value. The step-based
    Site Builder (CMS-102) walks a new tenant through seven steps from a venue-type preset so that a logo, four colours
    and a publish are enough for a working site in about 30 minutes; every step opens the full screen for its details.
    Vocabulary below; the element-by-element model follows; inputToOutput at the end gives worked examples.
  source: [contracts/satellite/white-label.yaml#/info, DI-223, DI-285, DI-111, DI-297, DI-296, DI-298, DI-997, DI-998,
    DI-1014, R139, R073, F22 step 5, F22 step 6, docs/architecture/rtl-and-theming.md]
  elements:
  # ---------------------------------------------------------------- identity and assets
  - element: Primary logo
    configuredOn: [CMS-004, CMS-002, ADM-016]
    field: BrandIdentity.logoAssetRef
    values: a MediaAsset id; PNG or SVG, at most 2 MB, uploaded through assets createUpload then completeUpload
    default: none; required before any brand save, and a missing logo blocks publish (missingRequiredAsset)
    changeScope: runtime (reaches guests with the publish)
    changes: [appHeader on every P01, P02 and P05 screen, the powered-by strip, WEB-029, GST-047, KSK-002]
    source: [contracts/satellite/white-label.yaml#/components/schemas/BrandIdentity, R270, DI-108, DI-187]
  - element: Logo for dark backgrounds and logo variant
    configuredOn: [CMS-004]
    field: BrandIdentity.logoDarkAssetRef, BrandIdentity.logoVariant
    values: logoVariant light | dark | duotone; dark logo optional, falls back to the primary logo
    default: logoVariant light
    changeScope: runtime
    changes: [the nav-bar lockup on every guest screen, the theme tint that follows the logo's colours]
    source: [DI-1068, contracts/satellite/white-label.yaml#/components/schemas/BrandIdentity, sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html]
  - element: Favicon and web icons
    configuredOn: [CMS-004]
    field: BrandIdentity.faviconAssetRef; AppIcons.derived (web 16, 32, 48 px, 180 px touch icon, 192 and 512 px manifest)
    values: PNG or SVG at most 2 MB (favicon); the web icons are generated from the 1024 px app icon source
    default: none
    changeScope: runtime for web
    changes: [the browser tab and home-screen shortcut of every P01 page]
    source: [contracts/satellite/white-label.yaml#setAppIcons, R163]
  - element: App icon
    configuredOn: [CMS-004]
    field: AppIcons.sourceAssetRef
    values: one 1024 x 1024 PNG without transparency; iOS and Android store sets generated (iOS 1024..20 px, Android 512, 432 adaptive, 192..48 px)
    default: none; required by the store checklist
    changeScope: buildTime (requiresRebuild true until the next store release; liveVersion names the icon shipped)
    changes: [the installed P02 app icon and its store listing only]
    source: [contracts/satellite/white-label.yaml#setAppIcons, contracts/satellite/white-label.yaml#/components/schemas/AppIcons]
  - element: Splash screen
    configuredOn: [CMS-004]
    field: BrandIdentity.splashImageAssetRefs, splashDurationSeconds, splashBackgroundColour, showLoadingIndicator
    values: 'images shown in order; duration 0-10 s; background #RRGGBB; indicator on or off'
    default: duration 3 s, indicator on
    changeScope: buildTime on the native app, runtime on web (audit R163)
    changes: [P02 app launch before GST-001, P01 first load]
    source: [contracts/satellite/white-label.yaml#/components/schemas/BrandIdentity, R163]
  - element: Intro video
    configuredOn: [CMS-004]
    field: BrandIdentity.introVideoAssetRef, introVideoMode
    values: a video MediaAsset from the media library (CMS-010); mode off | firstLaunch | everyLaunch; anything but off needs the asset (400)
    default: off
    changeScope: runtime (streamed, no app build)
    changes: [GST-001 introVideo state (full screen, muted, Skip introduction always shown)]
    source: [DI-1020, contracts/satellite/white-label.yaml#/components/schemas/BrandIdentity, screens/P02-guest-mobile-app.yaml#GST-001]
  # ---------------------------------------------------------------- colour and shape
  - element: Colour tokens (palette)
    configuredOn: [CMS-005, ADM-016]
    field: Theme.primaryColour, secondaryColour, accentColour, backgroundColour, textColour
    values: '#RRGGBB each; primary, secondary, background and text required, accent optional; every pair checked against WCAG 2.2 AA (4.5:1 text) and a failing pair is refused (400 ContrastProblem), never warned'
    default: none in the contract; the Site Builder preset proposes a palette (CMS-102)
    changeScope: runtime
    changes: [every P01, P02 and P05 screen; staff surfaces never]
    source: [contracts/satellite/white-label.yaml#setTheme, R139, F22 step 2, DI-1066, DI-296, DI-298]
    notes: >-
      Role of each colour (prototype palette = brand, accent, ink and surface): primary = brand (primary buttons,
      active step, links, selected chips, tab-bar active icon); accent = highlights and badges; text = ink; background =
      the page behind the cards. Secondary has no role in the prototype: see the CMS-005 open question. Semantic colours
      (success, warning, danger) are never tenant colours.
  - element: Per-element colours
    configuredOn: [CMS-005]
    field: Theme.componentColours.primaryCta | payButton | addToCart | buyTicketsButton | link | badge (each {background, text})
    values: '#RRGGBB pairs, each optional and contrast-checked like the theme'
    default: empty = follows the theme colours
    changeScope: runtime
    changes: [primaryCta on every guest screen's main call to action, payButton on WEB-012 and GST-009, addToCart on WEB-005, WEB-008, GST-008, buyTicketsButton on the P02 Buy tickets button and WEB-001 header CTA, link everywhere, badge on product cards and tags]
    source: [DI-922, DI-918, contracts/satellite/white-label.yaml#/components/schemas/Theme]
  - element: Dark variant (deprecated)
    configuredOn: [nowhere; deprecated]
    field: Theme.darkMode {primaryColour, backgroundColour, textColour}
    values: 'kept in the contract for compatibility, ignored, never used or drawn; white label has no dark or light mode (decided 2 October 2026, CHG-NOTE-009)'
    default: ignored
    changeScope: none
    changes: [none: the venue's chosen theme applies on every guest surface]
    source: [contracts/satellite/white-label.yaml#/components/schemas/Theme, screens/P01-guest-web-storefront.yaml, screens/P02-guest-mobile-app.yaml]
  - element: Corner radius, surfaces, buttons
    configuredOn: [CMS-005]
    field: Theme.cornerRadius, Theme.surfaceStyle, Theme.buttonStyle
    values: radius 0-32 px (prototype slider 0-22); surfaceStyle glass | solid; buttonStyle solid | outline | pill
    default: radius none in the contract (prototype 10 px); glass; solid
    changeScope: runtime
    changes: [cards, inputs, chips, images and the cart on every guest screen; buttons keep their own shape from buttonStyle]
    source: [DI-1066, DI-1067, sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html]
  # ---------------------------------------------------------------- type
  - element: Fonts
    configuredOn: [CMS-003]
    field: FontConfig.primaryLatin, primaryArabic, secondaryLatin, secondaryArabic, customFontAssetRefs
    values: a bundled face name, or an uploaded font file; primaryArabic required when ar is enabled; secondaryArabic required when secondaryLatin is set and ar is enabled (400 otherwise)
    default: none in the contract (TICVAI default Manrope; the client reference pairs Tajawal for Arabic)
    changeScope: runtime for a bundled face, buildTime for an uploaded file
    changes: [every guest screen; headings use the secondary face where set, body the primary]
    source: [contracts/satellite/white-label.yaml#setFonts, R163, screens/_design-tokens.yaml, docs/architecture/rtl-and-theming.md]
  # ---------------------------------------------------------------- chrome and navigation
  - element: Header
    configuredOn: [CMS-007]
    field: HeaderConfig.layout, showLogo, showMenu, showNotifications, backgroundColour
    values: 'layout logoLeft | logoCentre | logoWithMenu; three switches; background #RRGGBB'
    default: layout none (required on save); switches on
    changeScope: runtime
    changes: [appHeader on every P01 and P02 screen; the header carries only logo, category tabs, language button, profile icon and cart, never a date picker]
    source: [contracts/satellite/white-label.yaml#/components/schemas/HeaderConfig, screens/_components.yaml, DI-990, DI-974, DI-975]
  - element: Footer
    configuredOn: [CMS-007]
    field: FooterConfig.columns, legalLinks (termsUrl, privacyUrl, accessibilityUrl, cookiePolicyUrl), copyrightText, socialLinks
    values: free columns of labelled links (a link may open cookie preferences); legal links held apart so they cannot be removed by reorganising
    default: none
    changeScope: runtime
    changes: [the footer of every P01 page; P02 reaches the same links from Account and Help]
    source: [contracts/satellite/white-label.yaml#setFooter, MATRIX 19.1.7]
  - element: Powered by TICVAI
    configuredOn: [CMS-104]
    field: a Powered by toggle (to be added to the contract)
    values: 'on | off: off only where the venue''s licence allows; recoloured only as far as it stays legible on the tenant''s background (decided 2 October 2026, CHG-NOTE-009)'
    default: 'on'
    changeScope: runtime
    changes: [P01 footer and the powered-by strip above the booking step indicator (also in embedded mode), P02 (Account and launch), P05]
    source: [DI-111, DI-297, DI-250, screens/_design-tokens.yaml, sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html]
  - element: Navigation (web menu, drawer)
    configuredOn: [CMS-009]
    field: NavigationConfig.kind (bottomNavigation | drawer | tabs), items[] {label, icon, target, isVisible, sortOrder}
    values: up to 12 items; a target is a module, content page, product, event, external URL or app section; an item targeting a disabled module is refused
    default: none for web
    changeScope: runtime
    changes: [P01 header navigation and its sub-menus]
    source: [contracts/satellite/white-label.yaml#setNavigation, DI-424, MATRIX 19.1.8]
  - element: Mobile tab bar arrangement
    configuredOn: [CMS-009]
    field: NavigationConfig (kind bottomNavigation) items[].target.appSection
    values: appSection home | explore | plan | tickets | map | account | buyTickets; at most five visible, the rest overflow; plan needs visitPlanner and map needs map enabled
    default: Home, Explore, Plan, Tickets with the Buy tickets button in the centre (Plan left out while visitPlanner is off)
    changeScope: runtime
    changes: [the bottomNav region of every P02 screen]
    source: [contracts/satellite/white-label.yaml#/components/schemas/NavigationConfig, DI-1081, DI-1087]
  - element: Buy tickets button
    configuredOn: [CMS-009]
    field: NavigationConfig.buyButton.style, buyButton.label
    values: raised (centre of the tab bar) | floating | flat | hidden; label per language
    default: raised
    changeScope: runtime
    changes: [every P02 screen except the booking and checkout steps; it opens GST-003]
    source: [contracts/satellite/white-label.yaml#/components/schemas/NavigationConfig, DI-1081]
  # ---------------------------------------------------------------- home and content
  - element: Homepage sections and their order
    configuredOn: [CMS-007]
    field: HomepageLayout.sections[] {kind, title, sortOrder, isVisible, maxItems, heroStyle, contentPageId}
    values: kind heroBanner | quickActions | tickets | whatsOn | attractions | membership | dining | shop | promotions | map | customContent | venueOverview | spacer; heroStyle carousel | video | poster | split; maxItems 1-2 on the mobile Home
    default: none (the preset proposes them)
    changeScope: runtime
    changes: [WEB-001, GST-001]
    source: [contracts/satellite/white-label.yaml#setHomepageLayout, contracts/satellite/white-label.yaml#/components/schemas/HomepageSectionKind, DI-1018]
    notes: A section whose module is off cannot be made visible (tickets needs ticketsAndBooking, whatsOn events, attractions attractions, membership membership, dining diningAndFnb, shop shop, map map).
  - element: Banners and promo blocks
    configuredOn: [CMS-008]
    field: Banner {title, subtitle, imageAssetRef, placement, linkTarget, startsAt, endsAt}; PromoBlock {title, description, iconAssetRef, promotionId, linkTarget, startsAt, endsAt}
    values: placement homepageHero | homepageBlock | explore | checkout; schedule in the tenant's time zone; a promo block that is active or expired can only be withdrawn
    default: none
    changeScope: scheduled (outside the publish; the timer moves draft, scheduled, active, expired)
    changes: [WEB-001 and GST-001 hero and blocks, GST-002 Explore, WEB-012 and GST-009 checkout]
    source: [contracts/satellite/white-label.yaml#createBanner, contracts/satellite/white-label.yaml#updatePromoBlock, MATRIX 19.1.10, MATRIX 19.1.11]
  - element: Content pages, FAQs, policies
    configuredOn: [CMS-007, ADM-018, CMS-018]
    field: ContentPage {slug, title, body, isEnabled, iconAssetRef, categoryCode}; FaqCategory; Policy (setPolicy)
    values: per-language text; a published page can only be archived; a policy needs en and ar to publish and every save is a new version
    default: none
    changeScope: pages with the publish; FAQs on save; policies live at once
    changes: [WEB-045, WEB-025, GST-040, GST-057, WEB-050, the footer legal links]
    source: [contracts/satellite/white-label.yaml#updateContentPage, contracts/satellite/white-label.yaml#setPolicy, R096, DI-190, DI-191]
  # ---------------------------------------------------------------- modules and features
  - element: Modules
    configuredOn: [CMS-001]
    field: ModuleEnablement.moduleKey, isEnabled (isLicensed is read-only, from the subscription)
    values: ticketsAndBooking, membership, events, attractions, virtualQueue, diningAndFnb, shop, parking, gamification, photoGallery, wallet, loyalty, lostAndFound, map, visitPlanner
    default: off until licensed and enabled
    changeScope: runtime
    changes: [a disabled module disappears from every guest surface (tabs, header items, homepage sections, Explore filters), never shown and refused]
    source: [contracts/satellite/white-label.yaml#setModuleEnablement, DI-193, DI-285]
  - element: Feature toggles
    configuredOn: [CMS-001]
    field: FeatureToggle.featureKey, isEnabled
    values: digitalCompanionMode, aiConciergeChat, lostAndFound, pushNotifications, socialSharing, multiLanguage, appleWallet, googlePay, applePay, cashOnDelivery, guestCheckout, uaePassLogin
    default: guestCheckout off; others as delivered
    changeScope: runtime, except wallet and payment integrations (buildTime on native)
    changes: [guestCheckout -> WEB-016 and GST-042 guest pop-up; aiConciergeChat -> WEB-044 and GST-031; appleWallet -> GST-013; multiLanguage -> the language button]
    source: [contracts/satellite/white-label.yaml#/components/schemas/FeatureToggle, ADR-0045]
  # ---------------------------------------------------------------- language and direction
  - element: Languages and default
    configuredOn: [CMS-011, ADM-018]
    field: LanguageConfig.languages, defaultLanguage (rtlLanguages derived; translationGaps reported)
    values: ISO 639-1 two-letter codes; at least one; the default must be enabled
    default: en and ar are the agreed minimum (Russian, Chinese, Spanish later)
    changeScope: runtime
    changes: [the language button EN / العربية in every P01 and P02 header, KSK-002, every LocalisedText on every guest screen]
    source: [contracts/satellite/white-label.yaml#setLanguages, DI-080, DI-975, DI-019]
  - element: Right-to-left behaviour
    configuredOn: [follows the guest's language; CMS-016 for the cart side]
    field: LanguageConfig.rtlLanguages (derived); BookingFlowSettings.cartSideInRtl
    values: cartSideInRtl keepRight | mirror
    default: keepRight (the client confirmed the basket stays right in Arabic)
    changeScope: runtime
    changes: [every guest screen mirrors; WEB-005, WEB-006, WEB-008, WEB-010 and GST-041 keep the cart right unless mirror]
    source: [DI-1051, DI-975, docs/architecture/rtl-and-theming.md]
  # ---------------------------------------------------------------- booking presentation
  - element: Booking UI preset
    configuredOn: [CMS-016]
    field: BookingFlowSettings.preset
    values: auto | ticketBox | playCentre | venueSite | marketplace | singleEvent | season | custom (L1-L6)
    default: auto (by venue type)
    changeScope: runtime
    changes: [all booking screens WEB-002..WEB-012, GST-003, GST-007..GST-009, GST-041]
    source: [DI-1065, contracts/satellite/white-label.yaml#/components/schemas/BookingFlowSettings]
  - element: Step-indicator style
    configuredOn: [CMS-016]
    field: BookingFlowSettings.stepIndicator
    values: bar | numbered | dots | segmented | breadcrumb | pills | ticks | none
    default: bar
    changeScope: runtime
    changes: [WEB-005..WEB-012, GST-007..GST-009, GST-041 (the indicator under the powered-by strip)]
    source: [DI-1093, DI-1070, DI-426, contracts/satellite/white-label.yaml#/components/schemas/BookingFlowSettings]
  - element: Card layout, card size, density
    configuredOn: [CMS-016]
    field: BookingFlowSettings.cardLayout, cardSize, density
    values: stackedRows | splitRows | cardsAcross | posterCards; compact | standard | large | extraLarge; compact | standard | roomy
    default: stackedRows, compact, compact
    changeScope: runtime
    changes: [WEB-001 rail, WEB-002, WEB-005, GST-002, GST-003; the two grid modes (cardsAcross, posterCards) wrap into equal-height grids, the two row modes stay one column]
    source: [DI-1040, DI-991, sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html]
  - element: Cart layout
    configuredOn: [CMS-016]
    field: BookingFlowSettings.cartLayout
    values: sidebarRight | sidebarLeft | slideInRight | slideUpBottom | singleColumn | floatingIcon
    default: sidebarRight
    changeScope: runtime
    changes: [WEB-005, WEB-006, WEB-008, WEB-010, GST-041]
    source: [DI-1051, DI-947, DI-991]
  - element: Hero, banner search, embed, single-event page
    configuredOn: [CMS-016]
    field: BookingFlowSettings.heroBanner, searchInBanner, eventBannerDates, embedMode, singleEventPage
    values: switches; embedMode fullPage | embedded (embedded drops the venue header, hero and footer but keeps the powered-by strip and progress)
    default: hero on, search off, banner dates off, fullPage, single-event page off
    changeScope: runtime
    changes: [WEB-001, WEB-002, WEB-004]
    source: [DI-945, DI-1033, DI-1070, DI-431]
  - element: Seated, timed and ticket rules (venue-wide)
    configuredOn: [CMS-016]
    field: seatPicker, mapView, seatViewPosition, seatTimeBar, timesPerPage, dayPartFilter, dayPartBoundaries, dateStripDays, ticketCategories, ticketTags, cardInfo, showInfoOnly, quantitiesOnAddOns, locationSwitcher, guestContactFields, conciergeMascot
    values: as BookingFlowSettings declares
    default: bowl, 3d, bottom, on, 24, on, 12:00 / 17:00, 7 (3-31), categoryThenSubcategory, on, on, on, on, off, [email], on
    changeScope: runtime; tenant value with a per-venue override laid over field by field
    changes: [WEB-004, WEB-005, WEB-006, WEB-007, WEB-008, GST-007, GST-008, GST-049, WEB-016, GST-042, WEB-044, GST-031]
    source: [DI-1063, DI-1041, DI-1045, DI-1046, DI-920, DI-1056, DI-1025, DI-1028, DI-1054, DI-1058, DI-1069, DI-1043]
  - element: Booking-flow steps and their order
    configuredOn: [CMS-103]
    field: BookingFlow {flowTypeKey, isDefaultForType, isEnabled, steps[] {stepKey, enabled, sortOrder, settings}, settings}
    values: 16 flow types from a fixed system catalogue; steps required, optional or conditional; the venue's order must respect the type's constraints (payment last, location first, date before time, Help me choose before products)
    default: the type's own steps and order
    changeScope: runtime (with the publish)
    changes: [WEB-004..WEB-012, GST-003, GST-007..GST-009, GST-041 read the published flow and draw only its enabled steps]
    source: [contracts/satellite/white-label.yaml#/components/schemas/BookingFlowType, MoM 29 Sep 1 W12, DI-989, DI-428]
  - element: Flow-level behaviour
    configuredOn: [CMS-103]
    field: BookingFlow.settings.performanceReveal, signInAt, seatEventDateMode, extrasStep, quickTour, consentQuestionIds
    values: dateTimeTicket | allAtOnce; afterAddOns | atPayment; inlineStep | popupOnSeatMap; auto | always | never; on or off; up to 10 consent questions
    default: dateTimeTicket, afterAddOns, inlineStep, auto, off, none
    changeScope: runtime
    changes: [WEB-005..WEB-012, GST-007..GST-009, GST-041]
    source: [DI-1042, DI-1043, DI-1044, DI-1060, contracts/satellite/white-label.yaml#/components/schemas/BookingFlowLevelSettings]
  - element: Help me choose
    configuredOn: [CMS-101]
    field: GuidedChoice {mode, showBanner, behaviour, showEverything, questions[]}
    values: mode button | popupOnArrival | off; behaviour filter | recommend; 1-4 questions of 2-4 answers each
    default: button, banner on, filter, Show everything on
    changeScope: live at once on publishGuidedChoice (not part of the site publish)
    changes: [WEB-002, WEB-004, WEB-005, GST-003, GST-004, GST-008, KSK-003]
    source: [contracts/satellite/white-label.yaml#/components/schemas/GuidedChoice, DI-1005, DI-1052, MoM 29 Sep 1 W4]
  # ---------------------------------------------------------------- domain, status, publishing
  - element: Domain
    configuredOn: [CMS-017, ADM-017]
    field: CustomDomain {hostname, kind, verificationMethod}
    values: kind guestWeb | guestApp | partnerPortal | developerPortal; verification dnsTxt (default) | cname | httpFile
    default: the tenant's TICVAI subdomain until a custom domain is active
    changeScope: live when verified and routed
    changes: [the address of every P01 page, links in emails and tickets]
    source: [contracts/satellite/white-label.yaml#claimCustomDomain, DI-283]
  - element: Live app status
    configuredOn: [CMS-001]
    field: setMaintenanceMode {isInMaintenance, message, expectedBackAt, minimumAppVersion {ios, android}, contact, availability, availabilityMessage}
    values: availability open | soldOut | closed; versions x.y.z; message per language
    default: not in maintenance, open, no minimum version
    changeScope: live at once (never published, never restored)
    changes: [WEB-029, GST-047, WEB-028, the sold-out banner on WEB-001 and GST-001]
    source: [contracts/satellite/white-label.yaml#setMaintenanceMode, R073]
  - element: Analytics platforms
    configuredOn: [CMS-016]
    field: StorefrontAnalyticsProvider {provider, measurementId, surfaces, consentCategory, isEnabled}
    values: googleAnalytics4 | googleTagManager | adobeAnalytics | metaPixel | matomo | other; tenant-wide or per venue
    default: consentCategory analytics
    changeScope: runtime (with the publish)
    changes: [nothing visible; the tag loader on WEB-001 and GST-001 starts a provider only after cookie consent grants its category]
    source: [contracts/satellite/white-label.yaml#setAnalyticsProvider, DI-393, MATRIX 22.10.29]
  - element: Store listing and app identity
    configuredOn: [CMS-104]
    field: StoreAccount.listing {appName, subtitle, description, keywords, category, supportUrl, privacyPolicyUrl, screenshotAssetRefs}
    values: per language; every tenant language required (400)
    default: none
    changeScope: buildTime (store)
    changes: [the App Store and Google Play pages of the P02 app]
    source: [contracts/satellite/white-label.yaml#setStoreAccounts, DI-993, DI-998]
  - element: Imagery and copy
    configuredOn: [CMS-010 (media), CMS-008 (banners), catalogue product screens (product media and descriptions), every LocalisedText field]
    field: MediaAsset ids; LocalisedText / LocalisedRichText values
    values: photos landscape at least 1600 px, clips mp4 6-12 s without audio (prototype asset list); interface strings are TICVAI's, only authored content is the tenant's
    default: stand-ins until the client supplies real photos
    changeScope: runtime
    changes: [product cards, heroes, banners, content pages]
    source: [DI-1080, DI-188, DI-442, handoff/localisation.md]
  - element: Not configurable (fixed by TICVAI)
    configuredOn: [nowhere]
    field: none
    values: page structure and step logic; semantic colours (success, warning, danger); numbers, times and codes stay left-to-right; the Powered by TICVAI credit; staff-surface branding; component set
    default: fixed
    changeScope: fixed
    changes: [all]
    source: [DI-223, DI-285, DI-296, screens/_design-tokens.yaml, docs/architecture/rtl-and-theming.md]
  - element: Asked for, not modelled yet
    configuredOn: [none]
    field: none
    values: scroll animation (Rise, Scale, Slide, Blur, None); continue-button style (Bottom bar, Floating pill, Full-width block); date picker style (Grid, Strip, List); step order (Tailored per product, One decision per screen); several branded sites per tenant; staging and production environments; per-surface header (web vs app)
    default: draw the contract's behaviour; see the corrections on CMS-007, CMS-016 and CMS-016's open questions
    changeScope: n/a
    changes: [WEB-001, GST-001, booking screens]
    source: [DI-1088, DI-110, DI-393, DI-285, sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html]

vocabulary:
- term: Draft
  meaning: The tenant's one working configuration. Every Save writes it; guests never see it.
  avoid: [Staging, Unsaved, Pending]
  source: contracts/satellite/white-label.yaml#/info
- term: Publish
  meaning: Make the draft the live version guests read, with a note. Needs TENANT_PUBLISH.
  avoid: [Go live, Deploy, Push, Save and publish]
  source: contracts/satellite/white-label.yaml#publishTenantConfig
- term: Save
  meaning: Write to the draft. Never publishes.
  avoid: [Apply, Update live]
  source: contracts/satellite/white-label.yaml#/info
- term: Version
  meaning: An immutable published snapshot, numbered, with who published it and the note.
  avoid: [Release, Revision, Backup]
  source: contracts/satellite/white-label.yaml#/components/schemas/ConfigVersion
- term: Restore into draft
  meaning: Copy an old version back into the draft. Publishes nothing.
  avoid: [Roll back, Revert, Undo]
  source: R139
- term: Live now
  meaning: The changes that bypass the draft and apply at once (maintenance, availability, minimum app version, contact, Help me choose publish, policies).
  avoid: [Instant publish]
  source: contracts/satellite/white-label.yaml#setMaintenanceMode
- term: Needs an app update
  meaning: A build-time change (app icon, native splash, uploaded font, wallet or payment integration) that reaches app users only with a new store build.
  avoid: [Rebuild required, Build-time, Pending release]
  source: contracts/satellite/white-label.yaml#/components/schemas/ChangeScope
- term: Theme
  meaning: The tenant's colours, corner radius, surfaces and buttons.
  avoid: [Skin, Template, Style sheet]
  source: contracts/satellite/white-label.yaml#/components/schemas/Theme
- term: Booking flow
  meaning: The ordered steps a guest goes through to book one kind of product at one venue.
  avoid: [Checkout flow, Journey, Funnel, Wizard]
  source: contracts/satellite/white-label.yaml#/components/schemas/BookingFlow
- term: Step
  meaning: One stage of a booking flow (Date, Time, Tickets, Extras, Payment...). Marked Required, Optional or Conditional.
  avoid: [Page, Stage, Screen]
  source: contracts/satellite/white-label.yaml#/components/schemas/BookingFlowStepKey
- term: Help me choose
  meaning: The venue's short set of questions that filters the products shown. Never a consent step.
  avoid: [Quiz, Experience builder, Wizard, Recommender]
  source: DI-1005
- term: Module
  meaning: A licensed product area a tenant switches on for guests (Dining, Shop, Map...). Off means hidden, not greyed.
  avoid: [Plugin, App, Feature]
  source: contracts/satellite/white-label.yaml#setModuleEnablement
- term: Feature
  meaning: A finer switch inside the guest app (guest checkout, AI concierge, Apple Wallet...).
  avoid: [Module, Add-on]
  source: contracts/satellite/white-label.yaml#setFeatureToggles
- term: Buy tickets
  meaning: The persistent button in the guest app that opens GST-003, and its label.
  avoid: [Book now, Shop, Purchase]
  source: DI-1081
- term: Powered by TICVAI
  meaning: The platform credit on every guest surface; a toggle, on by default, off only where the venue's licence allows.
  avoid: [Built by TICVAI, Made by TICVAI]
  source: DI-297 | decided 2 October 2026 by Chinmay (CHG-NOTE-009)
- term: Site Builder
  meaning: The seven-step guided set-up (CMS-102).
  avoid: [Wizard, Onboarding, Setup assistant]
  source: DI-997
- term: Venue override
  meaning: A booking setting one venue sets differently from the tenant; everything else is inherited.
  avoid: [Exception, Custom setting]
  source: DI-1063
- term: Sold out today / Closed
  meaning: The two availability signals guests see; sold out means come another day, closed means the venue is not open.
  avoid: [Unavailable, Error]
  source: R073
- term: Maintenance
  meaning: The tenant-branded page shown while the guest web and app are switched off, with when they are expected back.
  avoid: [Down, Outage, Offline]
  source: contracts/satellite/white-label.yaml#setMaintenanceMode
- term: Domain
  meaning: The web address the tenant's guests use; Verify proves the tenant controls it before a certificate is issued.
  avoid: [URL, Site address, DNS]
  source: contracts/satellite/white-label.yaml#claimCustomDomain

screens:
  # =====================================================================================================
  # P13 Venue CMS -- Block A
  # =====================================================================================================
  CMS-001:
    block: A
    summary: >-
      The CMS home: one look tells a tenant admin what guests see now, what is waiting in the draft, and what is live
      outside the draft (maintenance, sold out, minimum app version). It is also Site Builder step 1 (modules and
      features). The one thing to get right is the split between "Published", "Draft (unpublished changes)" and "Live
      now" controls, because only the last group changes guests without a publish.
    inputs:
    - field: modules[].isEnabled
      rule: >-
        A switch per module. A module whose isLicensed is false is shown locked with "Not in your licence" and cannot be
        switched on. Switching one off that navigation or a homepage section still uses is refused (400); show the
        referencedBy list from the refusal with links to CMS-009 and CMS-007 to clear them first.
      source: contracts/satellite/white-label.yaml#setModuleEnablement
    - field: modules[visitPlanner]
      rule: Off hides the app's Plan tab and WEB-050; say so beside the switch.
      source: contracts/satellite/white-label.yaml#/components/schemas/ModuleKey
    - field: features[].isEnabled
      rule: >-
        A switch per feature. appleWallet, googlePay, applePay (wallet and payment) carry a "Needs an app update" tag
        (changeScope buildTime). guestCheckout defaults off and its helper text says it decides whether a guest can pay
        without an account after a one-time code; the fields the code pop-up asks are set on CMS-016 (guestContactFields).
        requiresConfiguration true shows "Set up first" with where.
      source: [contracts/satellite/white-label.yaml#/components/schemas/FeatureToggle, ADR-0045]
    - field: setMaintenanceMode body
      rule: >-
        One "Live now" panel, never inside the publish. isInMaintenance switch with message per enabled language and
        expectedBackAt (date and time in the tenant's time zone); availability as three radio cards Open / Sold out today /
        Closed with availabilityMessage per language; minimumAppVersion iOS and Android as x.y.z (pattern ^\d+\.\d+\.\d+$,
        empty forces nothing); contact phone, email, WhatsApp, address and opening hours (prose, per language). Only the
        fields touched are sent: clearing maintenance must not clear contact.
      source: [contracts/satellite/white-label.yaml#setMaintenanceMode, R073]
    outputs:
    - element: Status header
      rule: >-
        Three badges, in this order: Published (publishedVersion and publishedAt, or "Never published"), Draft
        ("Unpublished changes" when hasUnpublishedChanges), Live now (Maintenance on / Sold out today / Closed / Update
        forced for iOS x.y.z). Counts: active modules of licensed modules, active pages.
      source: contracts/satellite/white-label.yaml#/components/schemas/TenantAppStatus
    - element: Recent changes
      rule: Newest first, area, description, who (name, never a raw principal id) and relative time; staff only.
      source: contracts/satellite/white-label.yaml#getTenantAppStatus
    - element: Site Builder card
      rule: Shown while minimumPathDone is false, with the next unfinished step; leads to CMS-102.
      source: [contracts/satellite/white-label.yaml#/components/schemas/SiteSetupProgress, DI-997]
    - element: Workspace tiles
      rule: >-
        Brand kit, Theme, Typography, Logo and assets, Homepage and pages, Navigation, Banners, Booking settings, Booking
        flows, Help me choose, Languages, Domain, Versions, Publish, App build. DAM, privacy and waiver command centres
        belong to other areas and sit in a separate group.
      source: screens/P13-white-label-cms.yaml#CMS-001
    actions:
    - action: Save modules
      result: Writes the draft (not live). Toast "Saved to draft. Publish to show guests." Refusal lists what still links to the module.
      source: contracts/satellite/white-label.yaml#setModuleEnablement
    - action: Save features
      result: Writes the draft; for a buildTime feature the toast adds "App users get this with the next app update (CMS-104)".
      source: contracts/satellite/white-label.yaml#setFeatureToggles
    - action: Apply now (live status)
      result: >-
        Confirmation names the consequence ("Guests on web and app see the maintenance page from now until you clear it")
        and applies at once; no publish needed and a later restore does not undo it.
      source: [contracts/satellite/white-label.yaml#setMaintenanceMode, R073]
    edgeCases:
    - case: Tenant has never published
      expected: Status says "Your site is not live yet"; guests get 404 not-configured; the Site Builder card is the primary action.
      source: contracts/satellite/white-label.yaml#getTenantConfig
    - case: Maintenance on while a draft is unpublished
      expected: Both badges show; publishing does not end maintenance (independent).
      source: contracts/satellite/white-label.yaml#setMaintenanceMode
    - case: Minimum app version set above the version in the stores
      expected: Warn before applying that every app user is locked out until a newer build is released (CMS-104 newest released versionName shown beside the field).
      source: [contracts/satellite/white-label.yaml#/components/schemas/MinimumAppVersion, contracts/satellite/white-label.yaml#/components/schemas/AppBuild]
    - case: Caller has TENANT_CONFIGURE but not TENANT_PUBLISH
      expected: Everything editable; the Publish tile shows "Ask someone with publish rights".
      source: contracts/satellite/white-label.yaml#publishTenantConfig
    consistency:
    - with: CMS-102
      note: Step 1 of the Site Builder opens this screen; the module and feature switches are the same components.
    - with: CMS-014
      note: The Published / Draft badges use the same component and wording as the publish gate.
    - with: WEB-029
      note: The availability radio labels match the guest wording (Sold out today, Closed).
    sampleData:
      tenant: Coastal Leisure Group (مجموعة كوستال للترفيه)
      publishedVersion: '14'
      publishedAt: 2026-09-30 18:05 GST
      draft: Unpublished changes (theme, homepage)
      modules: ticketsAndBooking on, diningAndFnb on, shop on, map on, visitPlanner off (licensed), parking not licensed
      features: guestCheckout off, aiConciergeChat on, applePay on (needs an app update)
      liveNow: {availability: soldOut, availabilityMessage: {en: 'Today is sold out. Book tomorrow from AED 249.', ar: 'نفدت تذاكر اليوم. احجز للغد ابتداءً من 249 درهم.'}, minimumAppVersion: {ios: 2.3.0, android: 2.3.0}}
      contact: {phone: '+971 2 555 0142', whatsapp: '+971 50 555 0142', email: hello@coastalaqua.ae}
    corrections:
    - what: The layout dumps every TenantConfig part (brand, theme, fonts, footer, header...) as a detail panel.
      why: The workspace is a status page; the parts are edited on their own screens. Show the status header, the three groups and tiles instead.
      source: screens/P13-white-label-cms.yaml#CMS-001
    - what: emptyFirstRun says "No tenant yet. Offers no create action".
      why: A tenant always exists here; the first-run state is "nothing published yet" and offers the Site Builder (CMS-102).
      source: contracts/satellite/white-label.yaml#getSiteSetupProgress
    - what: The navigation exits include DAM, privacy and waiver command centres (CMS-021..CMS-091) as if white-label.
      why: They are other modules' areas; group them apart so the white-label path stays short (30-minute site).
      source: DI-988
    - what: Maintenance, minimum app version, contact and availability are edited through one modal labelled "Save maintenance mode".
      why: Four different live controls behind one maintenance label; label the panel "Live now" and each control by what it does.
      source: R073
    decisions:
    - question: Should switching on a module or feature be possible without TENANT_PUBLISH approval when the tenant runs an
        approval matrix (ApprovalKind configurationChange)?
      decision: 'Drawn default accepted: Draw save-to-draft only; the approval appears on CMS-014 at publish.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-146 | CHG-NOTE-009
      questionSource: MATRIX 22.10.9

  CMS-002:
    block: A
    summary: >-
      The brand kit at a glance: the marks (logo, dark logo, favicon), the logo variant that drives the theme tint, and a
      read-only swatch of the current theme and fonts with links to edit them. It is a summary and an upload point, not a
      second theme editor. Get the upload right: one control that uploads, checks format and size, and attaches.
    inputs:
    - field: logoAssetRef / logoDarkAssetRef / faviconAssetRef
      rule: >-
        One drop zone each. Accept PNG or SVG only, at most 2 MB, checked in the browser before upload and again by the
        server (400); explain the limit under the zone. The upload (createUpload then completeUpload) is invisible
        plumbing: the user sees one progress bar and the preview. Alt text is asked once at upload (completeUpload altText).
      source: [contracts/satellite/white-label.yaml#setBrandIdentity, R270, DI-188]
    - field: logoVariant
      rule: Three thumbnails Light / Dark / Duotone, each showing the nav bar with that lockup; default Light.
      source: DI-1068
    outputs:
    - element: Brand preview strip
      rule: The guest header and the powered-by strip as they will look with the draft logo, theme and fonts, in English and Arabic side by side.
      source: [DI-187, DI-111, docs/architecture/rtl-and-theming.md]
    - element: Theme and fonts summary
      rule: Read-only swatches of primary, secondary, accent, background, text, and the two font pairs, each linking to CMS-005 or CMS-003.
      source: screens/P13-white-label-cms.yaml#CMS-002
    actions:
    - action: Save brand
      result: Writes the draft. Splash images are not here (CMS-004).
      source: contracts/satellite/white-label.yaml#setBrandIdentity
    edgeCases:
    - case: SVG with embedded raster or scripts, or a 3 MB PNG
      expected: Refused before upload with the reason; nothing replaces the current logo.
      source: R270
    - case: No dark logo
      expected: The Dark variant previews the primary logo on dark and says it falls back.
      source: contracts/satellite/white-label.yaml#/components/schemas/BrandIdentity
    consistency:
    - with: CMS-004
      note: The same logo upload component and limits; CMS-004 also holds icons, splash and intro video.
    - with: ADM-016
      note: Platform staff see the same brand panel through a grant.
    sampleData:
      logo: coastal-aqua-logo.svg (148 KB)
      logoDark: coastal-aqua-logo-white.svg (122 KB)
      favicon: coastal-aqua-favicon.png 512 x 512 (18 KB)
      logoVariant: duotone
    corrections:
    - what: formSetBrandIdentity lists splashChangeScope as an optional input.
      why: splashChangeScope is readOnly (server-owned, always buildTime on native); it must be shown, never sent.
      source: contracts/satellite/white-label.yaml#/components/schemas/BrandIdentity
    - what: Create upload and Complete upload are drawn as two separate buttons with their own modals (filename, contentType, sizeBytes).
      why: They are the two halves of one upload; a person never types a content type. One upload control.
      source: contracts/satellite/white-label.yaml#/info
    - what: CMS-002 and CMS-004 both edit the full BrandIdentity.
      why: Two editors of one record drift; CMS-002 owns the marks and variant, CMS-004 the icons, splash and intro video (F22 step 1 also uploads icons on CMS-002, which is CMS-004's job).
      source: [F22 step 1, screens/P13-white-label-cms.yaml#CMS-004]
    openQuestions: []

  CMS-003:
    block: A
    summary: >-
      Choose the font pairs the guest surfaces use: a primary (body) and an optional secondary (headings), each a Latin
      face and an Arabic face. The one thing to get right: an Arabic face is mandatory as soon as Arabic is an enabled
      language, and the preview must show both scripts at the same size so the pair can be judged.
    inputs:
    - field: primaryLatin / secondaryLatin
      rule: >-
        Pick from the bundled faces (runtime) or an uploaded file (buildTime for the app). Offer the prototype's pairs as
        presets: Archivo / IBM Plex Sans, Oswald / Barlow, Playfair Display / Karla, Fredoka / Nunito, Baloo 2 / Nunito
        Sans, Instrument Serif / Public Sans, Manrope.
      source: [contracts/satellite/white-label.yaml#/components/schemas/FontConfig, sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html]
    - field: primaryArabic / secondaryArabic
      rule: >-
        Required when ar is among the tenant languages (primary always; secondary when a secondary Latin is set). Mark the
        field required with the reason "Arabic is enabled"; the server refuses with 400 otherwise.
      source: [contracts/satellite/white-label.yaml#setFonts, R163]
    - field: customFontAssetRefs
      rule: >-
        Font files (WOFF2, TTF, OTF) through the media library. Tag "Needs an app update" because uploaded files are
        build-time on the app. Warn about display, script or very heavy weights overflowing banners and buttons.
      source: [contracts/satellite/white-label.yaml#/components/schemas/FontConfig, DI-188, TRACKER Actions row 43]
    outputs:
    - element: Specimen
      rule: >-
        Heading, body, a price (AED 249.00), a time range (09:00 – 17:00) and a button, in Latin and Arabic side by side and
        mirrored, at the guest sizes. Numbers and times stay left-to-right inside Arabic lines.
      source: docs/architecture/rtl-and-theming.md
    actions:
    - action: Save fonts
      result: Writes the draft; the response's changeScope decides whether the toast adds "Needs an app update".
      source: contracts/satellite/white-label.yaml#setFonts
    edgeCases:
    - case: Arabic enabled later on CMS-011 with no Arabic face set
      expected: Validation reports arabicFontMissing and the publish is blocked; this screen shows the gap at the top.
      source: contracts/satellite/white-label.yaml#/components/schemas/ConfigFindingKind
    consistency:
    - with: CMS-011
      note: Enabling ar on CMS-011 makes primaryArabic required here; link both ways.
    - with: CMS-005
      note: Colours are edited on CMS-005 only.
    sampleData:
      primary: {latin: Manrope, arabic: Tajawal}
      secondary: {latin: Fredoka, arabic: Baloo Bhaijaan 2}
      specimen: {en: Splash into summer, ar: انطلق في صيف من المرح}
    corrections:
    - what: Typography also reads and saves the Theme (setTheme, Save theme modal).
      why: The theme belongs to CMS-005; two save points for one record. Remove theme editing here.
      source: screens/P13-white-label-cms.yaml#CMS-005
      status: fixed
      by: CHG-WIR-015
    - what: Purpose says "the two typefaces and the scale under them".
      why: FontConfig has no type scale; the scale is TICVAI's fixed token set. Draw no scale control.
      source: [contracts/satellite/white-label.yaml#/components/schemas/FontConfig, screens/_design-tokens.yaml]
    - what: Entry parameters bannerId, pageId, policyKind, version and the "version link" cold entry.
      why: Typography has no banner, page, policy or version; left over from the 41-operation bulk attach.
      source: screens/P13-white-label-cms.yaml#CMS-003
    - what: formSetFonts sends changeScope.
      why: changeScope is readOnly and derived on read.
      source: contracts/satellite/white-label.yaml#/components/schemas/FontConfig
    decisions:
    - question: Which faces are bundled (runtime) and which need an upload? The contract stores a free face name.
      decision: 'Drawn default accepted: Offer the seven prototype pairs plus Tajawal and Baloo Bhaijaan 2 as bundled; anything
        else is an upload.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-147 | CHG-NOTE-009
      questionSource: contracts/satellite/white-label.yaml#/components/schemas/FontConfig

  CMS-004:
    block: A
    summary: >-
      The marks every surface needs at every size, and the parts of the app that only change with a store build: the
      1024 px app icon, the splash, plus the streamed intro video that does not. The one thing to get right: separate
      "changes with the next publish" from "needs an app update" visually, so nobody expects a new icon tomorrow.
    inputs:
    - field: sourceAssetRef (app icon)
      rule: >-
        One square drop zone: PNG, exactly 1024 x 1024, no transparency (400 otherwise, checked before upload). After save
        show the derived set as a grid by platform (iOS, Android, Web) with each size.
      source: contracts/satellite/white-label.yaml#setAppIcons
    - field: splashImageAssetRefs, splashDurationSeconds, splashBackgroundColour, showLoadingIndicator
      rule: Ordered thumbnails (drag to reorder), duration stepper 0-10 s (default 3), colour picker with hex, indicator switch.
      source: contracts/satellite/white-label.yaml#/components/schemas/BrandIdentity
    - field: introVideoMode, introVideoAssetRef
      rule: >-
        Segmented control Off / First launch / Every launch (default Off). Anything but Off requires picking a video from
        the media library (CMS-010); clips are muted, 6-12 s recommended.
      source: [DI-1020, contracts/satellite/white-label.yaml#/components/schemas/BrandIdentity, DI-1080]
    outputs:
    - element: Two bands
      rule: >-
        "Changes when you publish" (logo, favicon, web icons, web splash, intro video) and "Needs an app update" (app
        icons, app splash). The second band shows liveVersion (the icon in the store app) beside the draft icon while
        requiresRebuild is true, with a link to CMS-104.
      source: [contracts/satellite/white-label.yaml#/components/schemas/AppIcons, contracts/satellite/white-label.yaml#publishTenantConfig]
    - element: Device previews
      rule: Home-screen icon on an iPhone and an Android launcher, the splash at launch, the intro video frame with "Skip introduction".
      source: screens/P02-guest-mobile-app.yaml#GST-001
    actions:
    - action: Save app icon
      result: Writes the draft and returns requiresRebuild true; the toast says app users see it after the next app update.
      source: contracts/satellite/white-label.yaml#setAppIcons
    - action: Save splash and intro
      result: Writes the draft.
      source: contracts/satellite/white-label.yaml#setBrandIdentity
    edgeCases:
    - case: Icon with transparency or 1000 x 1000
      expected: Refused before upload with the rule.
      source: contracts/satellite/white-label.yaml#setAppIcons
    - case: Intro video mode set without a video
      expected: Save disabled with the reason (server 400 otherwise).
      source: contracts/satellite/white-label.yaml#/components/schemas/BrandIdentity
    consistency:
    - with: CMS-104
      note: The store checklist's "App icons" item turns done from this screen.
    - with: GST-001
      note: The intro video overlay drawn there is what this preview shows.
    sampleData:
      appIcon: coastal-aqua-icon-1024.png
      liveIcon: version 2.2.0 (old wave mark)
      splash: {images: [splash-wave.png], duration: 3, background: '#0E7C86', indicator: true}
      introVideo: {mode: firstLaunch, asset: coastal-aqua-intro.mp4 (9 s, muted)}
    corrections:
    - what: formSetBrandIdentity sends splashChangeScope.
      why: readOnly.
      source: contracts/satellite/white-label.yaml#/components/schemas/BrandIdentity
    - what: The favicon is set here as BrandIdentity.faviconAssetRef and also generated as web icons from the app icon (AppIcons.derived web 16/32/48).
      why: Two sources for the browser tab icon; the package must say which wins.
      source: contracts/satellite/white-label.yaml#setAppIcons
    decisions:
    - question: Which favicon does the guest web use when both faviconAssetRef and the derived web icons exist?
      decision: 'Drawn default accepted: faviconAssetRef when set, else the derived 32 px icon.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-148 | CHG-NOTE-009
      questionSource: contracts/satellite/white-label.yaml#setAppIcons

  CMS-005:
    block: A
    summary: >-
      Tune the guest colours, shape and button style and watch every guest component change at once. Colour pairs that
      fail WCAG 2.2 AA are refused, not warned: the editor must show the failure live while the user picks, so the save
      never comes as a surprise. Per-element colours (call to action, pay, add to cart, Buy tickets, links, badges) sit
      under the palette, empty by default.
    inputs:
    - field: primaryColour, secondaryColour, accentColour, backgroundColour, textColour
      rule: >-
        Colour pickers with a hex field (#RRGGBB, six digits; three-digit and rgba are not accepted). Primary, secondary,
        background and text required; accent optional. Offer named palette presets (prototype: Sunset amber, Deep teal,
        Stadium red, Playhouse plum, Saffron cream, Midnight ink, Desert gold, Ticvai blue...) which fill the five fields;
        a preset is not stored.
      source: [contracts/satellite/white-label.yaml#/components/schemas/Theme, DI-393, DI-1066, sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html]
    - field: live contrast check
      rule: >-
        On every change call setTheme with Prefer validate-only (nothing written) and mark each failing pair with its
        ratio and the 4.5:1 required, and where it is used (e.g. "white text on primary button 3.2:1"). Save stays enabled
        but the server will refuse while any pair fails.
      source: [contracts/satellite/white-label.yaml#setTheme, R139, DI-922]
    - field: componentColours.{primaryCta, payButton, addToCart, buyTicketsButton, link, badge}
      rule: Each a background and text pair, both optional; empty shows "Follows theme". Same contrast check per pair.
      source: [DI-922, contracts/satellite/white-label.yaml#/components/schemas/Theme]
    - field: cornerRadius
      rule: Slider 0-22 px as the prototype (the contract allows up to 32); buttons are not affected (buttonStyle).
      source: [DI-1066, sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html]
    - field: surfaceStyle, buttonStyle
      rule: Glass (default) / Solid; Solid (default) / Outline / Pill, each as a thumbnail.
      source: DI-1067
    - field: darkMode
      rule: 'Deprecated: the field stays in the contract for compatibility, is ignored and is never drawn. White label has
        no dark or light mode; the venue''s chosen theme applies.'
      source:
      - contracts/satellite/white-label.yaml#/components/schemas/Theme
      - screens/P01-guest-web-storefront.yaml
      - decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    outputs:
    - element: Live component sheet
      rule: 'The real guest components with the draft values: header, primary and secondary buttons, a ticket card with tags
        and a badge, the step indicator, the cart with Pay, the mobile tab bar with the Buy tickets button, a link, an input
        and an error message. LTR and RTL toggle (no light or dark toggle). Semantic colours (success, warning, danger) stay
        TICVAI''s and are labelled "Fixed".'
      source:
      - DI-918
      - screens/_design-tokens.yaml
      - docs/architecture/rtl-and-theming.md
      - decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    actions:
    - action: Save theme
      result: Writes the draft (runtime, so guests see it after publish). On 400 ContrastProblem the entered colours stay and each failure is listed; there is no save anyway.
      source: [contracts/satellite/white-label.yaml#setTheme, R139]
    - action: Open full preview
      result: Goes to CMS-006 with the draft.
      source: screens/P13-white-label-cms.yaml#CMS-006
    edgeCases:
    - case: 'Brand yellow #FFC845 as primary with white button text'
      expected: 'Marked live "white on #FFC845 1.5:1, needs 4.5:1"; suggest dark text #1F2937 which passes.'
      source: R139
    - case: Logo variant duotone changes the tint
      expected: The sheet re-reads the logo colours; the stored theme colours are still what is saved.
      source: DI-1068
    consistency:
    - with: CMS-006
      note: The same component sheet, larger, with versions.
    - with: ADM-016
      note: Same editor through a grant; ADM-016 must include surfaceStyle, buttonStyle and componentColours too.
    sampleData:
      primary: '#0E7C86'
      secondary: '#0B4F6C'
      accent: '#FFC845'
      background: '#F7FAFB'
      text: '#1F2937'
      cornerRadius: 12
      surfaceStyle: glass
      buttonStyle: pill
      componentColours: {payButton: {background: '#0B4F6C', text: '#FFFFFF'}}
      contrastFailure: {foreground: '#FFFFFF', background: '#FFC845', ratio: 1.54, required: 4.5, usage: badge text}
    corrections:
    - what: screens/_design-tokens.yaml whiteLabel.overridable says only three tokens (accentSolid, surfaceRaised, typography.family.ui) are tenant-overridable.
      why: The contract (CFG-2, CFG-3, M17-11) lets the tenant set five colours, a dark variant, six component colours, radius, surface and button style. The tokens file is stale and the generator renders from it.
      source: [screens/_design-tokens.yaml, contracts/satellite/white-label.yaml#/components/schemas/Theme, DI-922, DI-1066, DI-1067]
    - what: Theme.cornerRadius has no default.
      why: The prototype's default is 10 px; a theme saved without it leaves the guest radius undefined.
      source: sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html
    - what: emptyFirstRun "No theme editor yet. Offers no create action".
      why: Before the first save getTheme answers 404 not-configured and the first setTheme creates the part; first run is the editor pre-filled from the preset, with Save.
      source: contracts/satellite/white-label.yaml#/info
    decisions:
    - question: What does secondaryColour colour on guest surfaces? The prototype palette has brand, accent, ink and surface
        only.
      decision: 'Not answered: the workbook cell repeats the dark-mode answer. secondaryColour colours secondary buttons,
        the selected-tab underline and the footer background (drawn default).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-149 | CHG-NOTE-009
      questionSource: sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html
    - question: May a tenant choose a dark guest app? rtl-and-theming.md says the tenant chooses colour, not theme; the contract
        has darkMode and the mobile prototype a Light/Dark mode.
      decision: 'White label has no dark or light mode: the venue''s chosen theme is applied. Theme.darkMode is deprecated:
        kept in the contract for compatibility, ignored, never used or drawn; the guest app has no Light/Dark switch (Pre-apply
        round, 2 October).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-150 | CHG-NOTE-009
      questionSource:
      - docs/architecture/rtl-and-theming.md
      - contracts/satellite/white-label.yaml#/components/schemas/Theme
      - sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html

  CMS-006:
    block: A
    summary: Check the draft theme against every component that carries it, on web, iPhone and Android, LTR and RTL, and share
      a preview link before publishing. It is a preview screen, not version history.
    inputs:
    - field: createPreview {platform, theme, language, expiresInHours}
      rule: Platform web / ios / android; theme always light (the venue's theme; darkMode is deprecated); language from the
        enabled languages; link expiry 1-168 hours (default 24).
      source: contracts/satellite/white-label.yaml#createPreview | decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    outputs:
    - element: Component gallery
      rule: >-
        Every guest component in its states (default, hover, pressed, disabled, error, selected) rendered from the draft:
        buttons, cards in the four card layouts and four sizes, step indicator styles, cart layouts, tab bar and Buy tickets
        button styles, inputs, badges and tags, banners, the powered-by strip.
      source: [DI-036, DI-395, DI-1040]
    - element: Preview link
      rule: The URL with expiry time, copy and QR code for testing on a phone; says it shows the draft, not what is live.
      source: contracts/satellite/white-label.yaml#/components/schemas/Preview
    - element: PDF ticket and wallet pass
      rule: In Block A the preview also renders the PDF ticket and the Apple and Google Wallet passes with the draft theme.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    actions:
    - action: Create preview link
      result: A short-lived link rendering the working draft; nothing is published.
      source: contracts/satellite/white-label.yaml#createPreview
    edgeCases:
    - case: Preview link opened after expiry
      expected: The guest-side page says the preview expired and offers nothing else (never the live site under a preview label).
      source: contracts/satellite/white-label.yaml#/components/schemas/Preview
    consistency:
    - with: CMS-005
      note: The same component sheet.
    - with: CMS-012
      note: RTL preview is the same renderer with language ar.
    sampleData:
      preview: {platform: ios, theme: light, language: ar, expiresAt: 2026-10-02 18:00 GST, url: 'https://preview.coastalaqua.ticvai.com/p/7f3c...'}
    corrections:
    - what: The screen is wired to listConfigVersions, diffConfigVersion, publishTenantConfig and restoreConfigVersion (a version table and publish gate).
      why: That is CMS-015 and CMS-014. Component Preview needs getTheme, getFonts, getBrandIdentity, getBookingFlowConfig and createPreview.
      source: [screens/P13-white-label-cms.yaml#CMS-015, screens/P13-white-label-cms.yaml#CMS-014]
      status: fixed
      by: CHG-WIR-015
    - what: F102 step 3 to step 4 jumps from CMS-006 to ADM-016 (cross-device, platform console).
      why: A tenant's preview never hands over to the platform console; the next step is CMS-012 or CMS-014.
      source: [F102 step 3, F22 step 4]
    decisions:
    - question: Should the preview also render the PDF ticket and Apple / Google Wallet pass?
      decision: Previews of the PDF ticket and the Apple/Google Wallet pass are in Block A.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-151 | CHG-NOTE-009
      questionSource: TRACKER Actions row 129

  CMS-007:
    block: A
    summary: >-
      Arrange the guest homepage (web Home and app Home) from fixed section kinds, and set the header and footer and the
      content pages. Sections reorder by drag and drop; a section whose module is off cannot be added or shown. Get right
      that the tenant arranges and fills, never invents components.
    inputs:
    - field: sections[] (kind, sortOrder, isVisible, title, maxItems, heroStyle, contentPageId)
      rule: A vertical list of section cards, drag to reorder, eye icon for isVisible, title per language. heroStyle only
        on heroBanner (Carousel / Video / Poster / Split). Every customisation option in the approved wireframe, including
        the card count per section (maxItems). contentPageId only on customContent (a picker of pages). Disabled kinds show
        "Needs <module> (switch on in CMS-001)".
      source:
      - contracts/satellite/white-label.yaml#/components/schemas/HomepageLayout
      - R163
      - DI-1018
      - decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    - field: header (HeaderConfig)
      rule: Layout thumbnails Logo left / Logo centre / Logo with menu (required), switches for logo, menu, notifications, background colour.
      source: contracts/satellite/white-label.yaml#/components/schemas/HeaderConfig
    - field: footer (FooterConfig)
      rule: Columns of links (heading, label, URL, or "opens cookie preferences"), then a separate locked group of legal links
        (terms and privacy required, accessibility and cookie policy optional), copyright, social links. The Powered by TICVAI
        credit shows in the preview; whether it shows is the Powered by toggle (CMS-104, default on).
      source:
      - contracts/satellite/white-label.yaml#setFooter
      - DI-111
      - decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    - field: content page (slug, title, body, isEnabled, icon, categoryCode, sortOrder)
      rule: Slug lowercase letters, digits and hyphens, unique (409); title and body per enabled language; a published page is read-only except Archive.
      source: [contracts/satellite/white-label.yaml#createContentPage, contracts/satellite/white-label.yaml#updateContentPage]
    - field: Scroll animation
      rule: 'Per landing-page section: Rise, Scale, Slide, Blur or None (a field to be added).'
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    outputs:
    - element: Split preview
      rule: Web Home and app Home side by side with the draft order, updated on every drag.
      source: [DI-394, F22 step 3]
    - element: Pages list
      rule: Slug, title (default language), status Draft / Published / Archived, Enabled, "Linked" when isReferenced.
      source: contracts/satellite/white-label.yaml#/components/schemas/ContentPage
    actions:
    - action: Save homepage
      result: Writes the draft; 400 names a section whose module is off or whose page is missing.
      source: contracts/satellite/white-label.yaml#setHomepageLayout
    - action: Save header / Save footer
      result: Writes the draft.
      source: [contracts/satellite/white-label.yaml#setHeader, contracts/satellite/white-label.yaml#setFooter]
    - action: Delete page
      result: Refused 409 while navigation or the homepage links to it; the dialog names the links.
      source: contracts/satellite/white-label.yaml#deleteContentPage
    - action: Draft with AI
      result: Proposes section copy or a page from a brief; the author edits and applies; the choice is recorded.
      source: [MATRIX 22.10.16, screens/P13-white-label-cms.yaml#CMS-007]
    edgeCases:
    - case: Editing a published page
      expected: Fields read-only, banner "Published pages can only be archived. Archive it and create a new page." (409 published-page-locked).
      source: contracts/satellite/white-label.yaml#updateContentPage
    - case: Disabling a page that is on the homepage
      expected: Allowed (enablement is not publication); the section shows "Page disabled, section hidden".
      source: contracts/satellite/white-label.yaml#/components/schemas/ContentPage
    consistency:
    - with: WEB-001
      note: The web Home renders these sections in this order.
    - with: GST-001
      note: The app Home renders venueOverview, hero, type tiles and highlights from these sections.
    - with: CMS-009
      note: Navigation links to pages are made there; isReferenced comes from both.
    sampleData:
      sections: [heroBanner (video), venueOverview, tickets, attractions (2), dining (1), promotions, map]
      header: {layout: logoLeft, showNotifications: true}
      footer: {columns: [{heading: Visit, links: [Opening hours, Getting here, Accessibility]}, {heading: Help, links: [FAQ, Contact us, Cookie preferences]}], legal: {termsUrl: /p/terms, privacyUrl: /p/privacy}, copyright: © 2026 Coastal Leisure Group}
      page: {slug: plan-your-visit, title: {en: Plan your visit, ar: خطط لزيارتك}}
    corrections:
    - what: formCreateContentPage requires id and status and offers isReferenced and scopePath; formSetFooter requires id and scopePath.
      why: All four are readOnly server fields. FooterConfig is itself declared with required [id, scopePath] and used as the setFooter request body, so a client cannot send a valid body.
      source: [contracts/satellite/white-label.yaml#/components/schemas/FooterConfig, contracts/satellite/white-label.yaml#createContentPage]
    - what: setHeader is in apis but no control or form is drawn.
      why: The header is a Site Builder step 5 deliverable (W12) and no other screen sets it.
      source: [MoM 29 Sep 1 W12, screens/P13-white-label-cms.yaml#CMS-102]
    - what: One HomepageLayout and one HeaderConfig serve both web and app.
      why: The client asked for header and layout configurable independently for web and mobile (a different mobile header).
      source: [DI-285, DI-1097]
    - what: screens/_components.yaml defines an appHeader region (tenant-branded) and no footer region, and no guest screen reads HeaderConfig or FooterConfig.
      why: The footer carries the legal links a regulator checks and the fixed Powered by TICVAI credit; the guest shell needs both regions bound to the published configuration.
      source: [screens/_components.yaml, contracts/satellite/white-label.yaml#setFooter, DI-111]
    - what: Content blocks (createContentBlock, publishContentBlock) are declared by no Block A screen (only BO-839).
      why: The authoring surface the matrix contracted (BL-172, scheduled and personalised blocks) has no editor.
      source: [MATRIX 22.10.4, MATRIX 22.10.8, screens/P08-venue-back-office.yaml#BO-839]
    decisions:
    - question: Fixed 2-3 card layout or N-count for the experiences and dining section on the app landing?
      decision: Every customisation option in the approved wireframe/prototype, including the card count per section.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-152 | CHG-NOTE-009
      questionSource:
      - DI-396
      - DI-1018
    - question: Selectable scroll animations on the landing page (Rise, Scale, Slide, Blur, None) have no field.
      decision: Scroll animation (Rise, Scale, Slide, Blur, None) is a field on landing-page sections.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-153 | CHG-NOTE-009
      questionSource:
      - DI-1088
      - sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html

  CMS-008:
    block: A
    summary: >-
      Schedule banners and promotional blocks for the guest Home, Explore and checkout. Each has a time window in the
      tenant's time zone and moves by itself from draft to scheduled to live to expired. The one thing to get right: show
      the state and window clearly, and lock a promo block once it has gone live (withdraw only).
    inputs:
    - field: Banner {title, subtitle, imageAssetRef, placement, linkTarget, startsAt, endsAt, sortOrder}
      rule: >-
        Title and subtitle per language; image from the media library (landscape, at least 1600 px wide, crop preview for
        web and app); placement Home hero / Home block / Explore / Checkout; link picker (module, page, product, event, URL);
        startsAt required, endsAt optional and after startsAt (400).
      source: [contracts/satellite/white-label.yaml#/components/schemas/Banner, R163, DI-1080]
    - field: PromoBlock {title, description, iconAssetRef, promotionId, linkTarget, startsAt, endsAt}
      rule: A block may point at a promotion but never prices one; dates optional, end after start.
      source: contracts/satellite/white-label.yaml#createPromoBlock
    outputs:
    - element: Calendar strip and list
      rule: Each banner and block with its state badge (Draft, Scheduled, Live, Expired), window in the tenant time zone, placement and a thumbnail; filter by state.
      source: [contracts/satellite/white-label.yaml#listBanners, contracts/satellite/white-label.yaml#/components/schemas/ScheduleState]
    actions:
    - action: Save banner / Save block
      result: Saves; a scheduled one goes live at startsAt without anyone acting.
      source: contracts/satellite/white-label.yaml#createBanner
    - action: Withdraw block
      result: deletePromoBlock; the only change allowed once a block is live or expired (amend is 409 published-block-locked).
      source: contracts/satellite/white-label.yaml#updatePromoBlock
    - action: Delete banner
      result: Removes it; the dialog says whether it is live now.
      source: contracts/satellite/white-label.yaml#deleteBanner
    edgeCases:
    - case: A Ramadan banner from 18:00 to 02:00 next day
      expected: Window shown in GST with the date change; it starts and ends by the timer.
      source: contracts/satellite/white-label.yaml#createBanner
    - case: Banner linked to a disabled module
      expected: Draw the link picker without disabled modules.
      source: contracts/satellite/white-label.yaml#setNavigation
    consistency:
    - with: WEB-001
      note: homepageHero and homepageBlock placements render there.
    - with: GST-002
      note: explore placement renders there.
    sampleData:
      banner: {title: {en: Summer splash nights, ar: ليالي الصيف المائية}, placement: homepageHero, startsAt: 2026-10-10 16:00 GST, endsAt: 2026-11-30 23:59 GST, link: product Night Splash Pass}
      promoBlock: {title: {en: Family of four from AED 799, ar: عائلة من أربعة أفراد ابتداءً من 799 درهم}, state: active}
    corrections:
    - what: Create forms require id and offer state and scopePath (readOnly).
      why: Server-owned; state moves by the timer.
      source: contracts/satellite/white-label.yaml#/components/schemas/Banner
    - what: deleteBanner is in apis but no button; banners have no detail panel (only promo blocks).
      why: Banners need the same select, edit and delete as blocks.
      source: screens/P13-white-label-cms.yaml#CMS-008
    - what: Banners and promo blocks are scheduled outside the publish, while the header says every set* writes the draft.
      why: The screen must say "goes live on its schedule, not with Publish"; the contract header lists them as outside the draft, so make the UI say so.
      source: contracts/satellite/white-label.yaml#/info
    decisions:
    - question: Is a banner's isActive switch a manual pause on top of the schedule?
      decision: 'Drawn default accepted: Draw it as Pause / Resume; a paused banner does not show even inside its window.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-154 | CHG-NOTE-009
      questionSource: contracts/satellite/white-label.yaml#/components/schemas/Banner

  CMS-011:
    block: A
    summary: >-
      Choose the guest languages and the default, then see, per language, how much authored content is still missing and
      go fill it. Enabling a language never translates anything; the screen exists so nobody publishes a half-translated
      app. Translation of interface strings is TICVAI's; this screen covers the tenant's own content.
    inputs:
    - field: languages
      rule: >-
        A list of language chips (English, العربية, Русский, 中文, Español...), each a two-letter ISO 639-1 code; at least
        one. Arabic carries an "RTL" tag (derived, rtlLanguages). Adding ar warns that an Arabic font is now required (CMS-003).
      source: [contracts/satellite/white-label.yaml#setLanguages, DI-080, R163]
    - field: defaultLanguage
      rule: A select limited to the enabled languages (400 otherwise); the default is what a first-time guest sees before choosing.
      source: contracts/satellite/white-label.yaml#setLanguages
    outputs:
    - element: Translation gaps
      rule: >-
        Per enabled language, missingCount and the areas (pages, FAQs, banners, navigation labels, availability message),
        each a link to the screen that holds the text. 0 shows a tick. Sorted by missing count, largest first.
      source: [contracts/satellite/white-label.yaml#/components/schemas/LanguageConfig, handoff/localisation.md]
    actions:
    - action: Save languages
      result: Writes the draft and returns translationGaps; publish is blocked by missingTranslation findings (validateTenantConfig).
      source: [contracts/satellite/white-label.yaml#setLanguages, contracts/satellite/white-label.yaml#validateTenantConfig]
    - action: Translate gaps with AI
      result: Proposes drafts for the tenant's team to review (ai proposeTranslations on BO-793); nothing goes live unreviewed.
      source: [DI-081, MATRIX 22.10.15, screens/P08-venue-back-office.yaml#BO-793]
    edgeCases:
    - case: Removing a language that is the default
      expected: Refused until another default is chosen.
      source: contracts/satellite/white-label.yaml#setLanguages
    - case: Chinese
      expected: The two-letter code zh cannot say Simplified or Traditional; show "Chinese (Simplified)" and raise the question.
      source: [DI-020, contracts/satellite/white-label.yaml#/components/schemas/LanguageConfig]
    consistency:
    - with: ADM-018
      note: Same language control for platform staff.
    - with: GST-043
      note: The guest language button lists exactly these languages in this order.
    sampleData:
      languages: [en, ar, ru]
      defaultLanguage: en
      translationGaps: [{language: ar, missingCount: 7, areas: [pages, faqs, banners]}, {language: ru, missingCount: 42, areas: [pages, faqs, navigation, banners, availabilityMessage]}]
    corrections:
    - what: The screen declares only setLanguages and no read, so it cannot show the current languages or the gaps it exists for.
      why: Needs getTenantConfig (languages, translationGaps) on load.
      source: screens/P13-white-label-cms.yaml#CMS-011
      status: fixed
      by: CHG-WIR-015
    - what: Default language is drawn as a free textField.
      why: It must be one of the enabled languages (400).
      source: contracts/satellite/white-label.yaml#setLanguages
    - what: The translation workflow the client asked for (enter English, machine-translate, the tenant's team reviews before publishing) has no operation on this screen.
      why: ai proposeTranslations exists but is wired only to BO-785 and BO-793.
      source: [DI-081, DI-083, MATRIX 22.10.15]
      status: logged
      by: CHG-WIR-017
    decisions:
    - question: How are Simplified and Traditional Chinese told apart with two-letter codes?
      decision: 'Drawn default accepted: Treat zh as Simplified.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-155 | CHG-NOTE-009
      questionSource: contracts/satellite/white-label.yaml#/components/schemas/LanguageConfig

  CMS-012:
    block: A
    summary: >-
      See the draft as an Arabic reader sees it, mirrored, on web and app, and run the checks that block a publish. Arabic
      is a mirror, not a translation: the preview must show what flips and what must not (prices, times, phone numbers,
      codes, logos, media controls).
    inputs:
    - field: createPreview {language ar, platform, theme}
      rule: Platform and theme toggles beside a direction toggle; language fixed to ar (or any enabled RTL language).
      source: [contracts/satellite/white-label.yaml#createPreview, docs/architecture/rtl-and-theming.md]
    outputs:
    - element: Mirrored preview
      rule: >-
        Home, a booking step with the cart, the seat map and checkout in Arabic; the cart stays on the right unless
        cartSideInRtl is mirror; AED amounts and 09:00 – 17:00 stay left-to-right; untranslated strings are highlighted
        with the language they fell back to.
      source: [DI-1051, DI-975, docs/architecture/rtl-and-theming.md]
    - element: Findings
      rule: validateTenantConfig findings filtered to missingTranslation and arabicFontMissing first, each linking to its screen.
      source: contracts/satellite/white-label.yaml#validateTenantConfig
    actions:
    - action: Check what blocks a publish
      result: Runs validateTenantConfig (writes nothing).
      source: contracts/satellite/white-label.yaml#validateTenantConfig
    edgeCases:
    - case: ar not enabled
      expected: Offers to enable it on CMS-011; no preview.
      source: contracts/satellite/white-label.yaml#setLanguages
    - case: Long descriptions without Arabic copy
      expected: Shown in English inside the Arabic layout, highlighted, as agreed until final Arabic copy arrives.
      source: DI-975
    consistency:
    - with: CMS-006
      note: Same renderer; this screen is its RTL view plus the checks.
    - with: GST-043
      note: What the guest sees in Arabic is exactly this preview.
    sampleData:
      ar: {home: الرئيسية, buyTickets: اشترِ التذاكر, total: 'الإجمالي AED 498.00', hours: '09:00 – 17:00'}
    corrections:
    - what: The layout dumps the whole TenantConfig as a detail panel.
      why: The screen is a preview; it needs createPreview with language ar, not a field dump.
      source: [screens/P13-white-label-cms.yaml#CMS-012, F22 step 4]
    openQuestions: []

  CMS-014:
    block: A
    summary: >-
      Move the draft to live with someone accountable: see what changed since the live version, what still blocks,
      what will not reach app users until an app update, then publish now or at a set time with a note. Site Builder step
      7. The one thing to get right: nobody presses Publish meaning Save; the gate states the consequence first.
    inputs:
    - field: note
      rule: Required, 3-500 characters, plain words ("Summer theme and new homepage order").
      source: contracts/satellite/white-label.yaml#publishTenantConfig
    - field: scheduledFor
      rule: Optional date and time in the tenant's time zone (GST); a scheduled job activates it; must be in the future.
      source: contracts/satellite/white-label.yaml#publishTenantConfig
    - field: Review step (optional)
      rule: A venue can switch on a review or approval step; otherwise a permission holder simulates (preview) and publishes
        in one step.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    outputs:
    - element: What changes
      rule: >-
        diffConfigVersion of the live version against the draft, grouped by area (Theme, Fonts, Homepage, Navigation,
        Booking flows by venue, Pages), each change as before and after, with the products whose booking steps change.
      source: [contracts/satellite/white-label.yaml#diffConfigVersion, DI-194]
    - element: Blocking findings
      rule: Errors first (publish disabled with the count), then warnings; each links to the screen that fixes it.
      source: contracts/satellite/white-label.yaml#/components/schemas/ConfigValidationReport
    - element: Needs an app update
      rule: pendingBuildTimeChanges listed by area and platform, with a link to CMS-104.
      source: contracts/satellite/white-label.yaml#/components/schemas/ConfigVersion
    actions:
    - action: Publish now / Schedule
      result: >-
        Validates, snapshots and makes the new version current atomically. Web guests see it on next load; app guests on
        next launch. 409 lists every finding. Success shows the version number and the build-time items not yet shipped.
      source: [contracts/satellite/white-label.yaml#publishTenantConfig, F22 step 5]
    - action: Preview
      result: Opens CMS-006 / CMS-012 for the draft.
      source: screens/P13-white-label-cms.yaml#CMS-102
    edgeCases:
    - case: Nothing changed since the live version
      expected: Publish disabled with "No changes since version 14".
      source: contracts/satellite/white-label.yaml#/components/schemas/TenantAppStatus
    - case: Invalid booking flow at one venue
      expected: Finding bookingFlowInvalid names the venue and flow and links to CMS-103 with the flow open.
      source: contracts/satellite/white-label.yaml#validateTenantConfig
    - case: User lacks TENANT_PUBLISH
      expected: The diff and findings are visible; Publish replaced by "Ask someone with publish rights".
      source: contracts/satellite/white-label.yaml#publishTenantConfig
    - case: Arriving after a restore (from CMS-015)
      expected: Banner "Draft restored from version 12"; the diff is the live version against the restored draft.
      source: R139
    consistency:
    - with: CMS-015
      note: Same diff component.
    - with: CMS-103
      note: Its Publish site dialog is this gate.
    sampleData:
      live: version 14, 2026-09-30 18:05 GST, by Mariam Al Hashimi, "Autumn hours"
      draft: 'theme (primary #0B6E78 to #0E7C86), homepage (dining moved above shop), Kids Club Mirdif booking flow (extras turned off)'
      buildTime: app icon (iOS, Android)
      note: New teal and simpler Kids Club booking
    corrections:
    - what: The screen does not declare diffConfigVersion or createPreview.
      why: A review step needs a field-level diff (the contract's own reason for diffConfigVersion) and the client asked for a Review and Publish step.
      source: [contracts/satellite/white-label.yaml#diffConfigVersion, DI-194]
      status: fixed
      by: CHG-WIR-015
    - what: The detail panel shows maintenance fields as if publish affected them.
      why: Maintenance is live state, never published or restored; show it only as context.
      source: contracts/satellite/white-label.yaml#setMaintenanceMode
    decisions:
    - question: Does a publish go through the approval matrix (ApprovalKind configurationChange), and must the approver differ
        from the author as for content blocks?
      decision: 'Publishing: simulate (preview), then a single publish by a permission holder. An optional review/approval
        step the venue can switch on.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-156 | CHG-NOTE-009
      questionSource:
      - MATRIX 22.10.9
      - contracts/satellite/white-label.yaml#publishContentBlock

  CMS-015:
    block: A
    summary: >-
      Who published what, when and why, and the way back: restore a version into the draft, review the diff, then publish
      on CMS-014. Never a one-click rollback.
    outputs:
    - element: Version list
      rule: Newest first; version, published at (GST), by name, note, Current badge, Scheduled for, Needs an app update chips. contentHash and scopePath are not shown.
      source: contracts/satellite/white-label.yaml#/components/schemas/ConfigVersion
    - element: Compare
      rule: diffConfigVersion of the selected version against the draft (or ?against another version), grouped by area, before and after, changeScope tag.
      source: contracts/satellite/white-label.yaml#diffConfigVersion
    actions:
    - action: Restore into draft
      result: >-
        Confirmation names the version and says unpublished draft changes are replaced and guests still see the live
        version; then lands on the diff with "Review and publish" to CMS-014. Needs TENANT_PUBLISH.
      source: [contracts/satellite/white-label.yaml#restoreConfigVersion, R139, F22 step 6]
    edgeCases:
    - case: Restoring while the draft has unpublished changes
      expected: The dialog lists them (from the diff) before they are overwritten.
      source: contracts/satellite/white-label.yaml#restoreConfigVersion
    - case: Old version with a different app icon
      expected: After restore and publish, the icon still needs an app update; say so.
      source: contracts/satellite/white-label.yaml#/components/schemas/ConfigVersion
    - case: Maintenance or availability
      expected: Not part of any version; the restore leaves them as they are and says so.
      source: contracts/satellite/white-label.yaml#setMaintenanceMode
    consistency:
    - with: CMS-014
      note: Same diff component; restore always ends there.
    sampleData:
      versions: [{version: '14', at: 2026-09-30 18:05, by: Mariam Al Hashimi, note: Autumn hours, current: true}, {version: '13', at: 2026-09-21 10:12, by: Omar Saeed, note: Water park map tab}, {version: '12', at: 2026-09-14 09:40, by: Mariam Al Hashimi, note: Launch theme}]
    corrections:
    - what: emptyNoAccess cites only TENANT_CONFIGURE.
      why: restoreConfigVersion needs TENANT_PUBLISH; the Restore button must be hidden or explained for a configure-only user.
      source: contracts/satellite/white-label.yaml#restoreConfigVersion
    openQuestions: []

  CMS-016:
    block: A
    summary: >-
      The venue-wide booking presentation every booking screen inherits, at tenant level with a per-venue override: preset,
      step indicator, card and cart layout, density, hero and embed, seated and timed rules, guest-checkout fields, plus the
      analytics platforms. The one thing to get right: at venue level each field shows the inherited tenant value and
      whether this venue overrides it; clearing a field returns to inheritance.
    inputs:
    - field: Settings for
      rule: All venues (tenant) or one venue; sends effectiveForVenueId to show the resolved values. Overridden fields carry an "Overrides tenant" chip and a Reset.
      source: [DI-1063, contracts/satellite/white-label.yaml#/components/schemas/BookingFlowVenueOverride]
    - field: preset
      rule: Auto (by venue type) / Ticket box / Play centre / Venue site / Marketplace / Single event / Season / Custom; picking one fills the fields below, which stay editable (then Custom).
      source: DI-1065
    - field: stepIndicator
      rule: Thumbnails of Bar, Numbered, Dots, Segmented, Breadcrumb (step names), Pills, Ticks, None; default Bar.
      source: [DI-1093, DI-1070]
    - field: cardLayout, cardSize, density
      rule: Stacked rows (default) / Split rows / Cards across / Poster cards; Compact (default) / Standard / Large / Extra large; Compact (default) / Standard / Roomy. Thumbnails, not words.
      source: DI-1040
    - field: cartLayout, cartSideInRtl
      rule: Six cart thumbnails (default sidebar right; floating basket icon with count); Arabic cart side Keep right (default) / Mirror.
      source: DI-1051
    - field: heroBanner, searchInBanner, eventBannerDates, embedMode, singleEventPage
      rule: Hero on (default) for venues without their own site; search off; event dates in banner off; Full page / Embedded (embedded keeps the powered-by strip and progress).
      source: [DI-945, DI-1033, DI-431, sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html]
    - field: timesPerPage, dayPartFilter, dayPartBoundaries
      rule: 8 / 12 / 24 (default) / All; chips on; afternoon starts 12:00 and evening 17:00 by default, afternoon before evening (400).
      source: DI-1041
    - field: dateStripDays
      rule: Stepper 3-31, default 7.
      source: DI-920
    - field: guestContactFields
      rule: Email only (default) / Email + name / Email + mobile + name; must include the contact the code is sent to (400). Shown only when the guestCheckout feature is on.
      source: [MoM 29 Sep 1 W1, contracts/satellite/white-label.yaml#/components/schemas/BookingFlowSettings]
    - field: analytics providers
      rule: Provider, measurement id (G-..., GTM-..., pixel id; format checked, 422), surfaces web / app, consent category (Analytics default; never Strictly necessary), tenant-wide or per venue, enabled; reporting credential write-only.
      source: [contracts/satellite/white-label.yaml#setAnalyticsProvider, DI-393]
    outputs:
    - element: Mini preview per setting
      rule: Every option shows the guest result (a card, the cart, the step indicator) because the client wants every option to visibly change something.
      source: DI-988
    - element: Venues that differ
      rule: One row per venue override listing only the changed fields; a closed venue's override greyed with "No effect".
      source: [DI-1063, contracts/satellite/white-label.yaml#/components/schemas/BookingFlowConfig]
    actions:
    - action: Save booking settings
      result: Sends the tenant settings plus every override (the whole BookingFlowConfig) to the draft; guests see it after publish.
      source: contracts/satellite/white-label.yaml#setBookingFlowConfig
    - action: Save analytics platform
      result: Upsert keyed on venue and provider; effective with the publish.
      source: contracts/satellite/white-label.yaml#setAnalyticsProvider
    edgeCases:
    - case: Two admins edit different venues' overrides at once
      expected: The body is the whole configuration, so the second save overwrites the first; warn on load when the draft changed since opening.
      source: contracts/satellite/white-label.yaml#setBookingFlowConfig
    - case: Tenant with one venue
      expected: Hide Settings for and the location switcher (no effect).
      source: contracts/satellite/white-label.yaml#/components/schemas/BookingFlowSettings
    consistency:
    - with: CMS-103
      note: Flow-level settings (performance reveal, sign-in point, extras, quick tour, consent questions) are there, not here; link both ways.
    - with: WEB-005
      note: The step indicator and cart styles are drawn there.
    sampleData:
      tenant: {preset: venueSite, stepIndicator: numbered, cardLayout: cardsAcross, cardSize: compact, cartLayout: sidebarRight, dateStripDays: 7, guestContactFields: [email, mobile, name]}
      override: {venue: Kids Club Mirdif (كيدز كلوب مردف), settings: {cardLayout: posterCards, cartLayout: floatingIcon, timesPerPage: '12'}}
      analytics: {provider: googleAnalytics4, measurementId: G-7Q2K9XW4LM, surfaces: [guestWeb, guestApp], consentCategory: analytics}
    corrections:
    - what: The layout dumps the whole TenantConfig, and listAnalyticsProviders / setAnalyticsProvider have no component.
      why: The screen is the booking presentation plus analytics; the analytics platforms need their own list and form.
      source: screens/P13-white-label-cms.yaml#CMS-016
    - what: stepIndicator values (bar, numbered, dots, segmented, breadcrumb, pills, ticks, none) do not match the client's words (bars, dots, counters, step names) or the prototypes (web Bar / Numbered steps / Dots; mobile Bars / Dots / Counter / Step names / Line).
      why: Three vocabularies for one control; the designer cannot tell which label means which value.
      source: [DI-1093, sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html, sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html]
    - what: No guest booking screen declares stepIndicator, embedMode, singleEventPage or HeaderConfig.
      why: The settings change nothing a builder can trace; WEB-005..WEB-012 and GST-007..GST-009 must read them.
      source: contracts/satellite/white-label.yaml#/components/schemas/BookingFlowSettings
    - what: The mobile prototype offers controls the contract lacks (continue button Bottom bar / Floating pill / Full-width block; date picker Grid / Strip / List; step order Tailored per product / One decision per screen).
      why: Either they become fields or the prototype drops them; the client sees them today.
      source: sources/designs/guest-rev3-30-september/TICVAI Mobile App v4.dc.html
    decisions:
    - question: Map the stepIndicator values to labels.
      decision: 'Drawn default accepted: bar = Bar, numbered = Numbered steps (counter), dots = Dots, breadcrumb = Step names,
        segmented = Segments, pills = Pills, ticks = Ticks, none = None.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-157 | CHG-NOTE-009
      questionSource: DI-1093
    - question: Staging and production environments per site (asked 20 August).
      decision: 'Drawn default accepted: Not modelled; the preview link (CMS-006) is the staging view.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-158 | CHG-NOTE-009
      questionSource:
      - DI-393
      - TRACKER Actions row 102

  CMS-017:
    block: A
    summary: >-
      Point the tenant's own domain at its guest web (or app links, partner or developer portal): claim, publish the DNS
      record shown, and let the platform verify and issue the certificate. The screen is opened when something is wrong,
      so the status and the exact record to publish matter most.
    inputs:
    - field: hostname
      rule: A fully qualified host such as tickets.coastalaqua.ae (lowercase, no scheme, no path).
      source: contracts/satellite/white-label.yaml#claimCustomDomain
    - field: kind
      rule: Guest website / Guest app links / Partner portal / Developer portal.
      source: contracts/satellite/white-label.yaml#/components/schemas/CustomDomain
    - field: verificationMethod
      rule: DNS TXT (default) / CNAME / HTTP file, with one line on when to use each.
      source: contracts/satellite/white-label.yaml#claimCustomDomain
    outputs:
    - element: Record to publish
      rule: verificationRecord type, name and value, each with a copy button, exactly as the DNS provider needs them.
      source: contracts/satellite/white-label.yaml#/components/schemas/CustomDomain
    - element: Status
      rule: Pending, Verifying, Verified, Issuing certificate, Active, Failed (with failureReason), Expired, Revoked; last checked time; certificate expiry date, amber within 30 days.
      source: [contracts/satellite/white-label.yaml#listCustomDomains, contracts/satellite/white-label.yaml#/components/schemas/CustomDomain]
    - element: Default address
      rule: The tenant's TICVAI subdomain, always working, shown above the custom domains.
      source: DI-283
    actions:
    - action: Claim
      result: 201 with the record; 409 "This domain is not available" without saying who holds it.
      source: contracts/satellite/white-label.yaml#claimCustomDomain
    - action: Check now
      result: Verification is retried by a job; the button only triggers an early check and says DNS can take hours.
      source: contracts/satellite/white-label.yaml#verifyCustomDomain
    - action: Release
      result: Refused 409 while it is the only active domain for a published app, naming what would break; otherwise unroutes at once.
      source: [contracts/satellite/white-label.yaml#relinquishCustomDomain, R096]
    edgeCases:
    - case: Hostname already routed to another tenant at verify
      expected: 409 hostname-taken; "This domain is in use elsewhere. Contact support."
      source: contracts/satellite/white-label.yaml#verifyCustomDomain
    - case: Certificate renewal fails on a weekend
      expected: Renewal is a job; a failed renewal shows Failed with the reason and the expiry countdown.
      source: contracts/satellite/white-label.yaml#/components/schemas/CustomDomain
    consistency:
    - with: ADM-017
      note: Same list and actions for platform staff through a grant.
    sampleData:
      default: coastal-leisure.ticvai.com
      domains: [{hostname: tickets.coastalaqua.ae, kind: guestWeb, status: active, certificateExpiresAt: 2026-12-28}, {hostname: book.summitpeaks.ae, kind: guestWeb, status: verifying, record: {type: TXT, name: _ticvai-verify.book.summitpeaks.ae, value: ticvai-site-verification=4f9c2e81b7}}]
    corrections:
    - what: The table shows verificationToken but not verificationRecord.
      why: The tenant needs the record (type, name, value) to publish; the token alone is not usable.
      source: contracts/satellite/white-label.yaml#/components/schemas/CustomDomain
    - what: emptyFirstRun reads "Not found — it may have been deleted or moved out of scope".
      why: For a list, first run is "No custom domain yet; your site is at <subdomain>" with Claim.
      source: DI-283
    - what: Nothing in the contract returns the tenant's default TICVAI subdomain.
      why: Small tenants run on it; the screen and every share link need it.
      source: DI-283
    openQuestions: []

  CMS-101:
    block: A
    summary: >-
      Set up a venue's Help me choose: a few questions whose answers filter the products a guest sees (or end on one
      recommended result), review the set the AI proposes from the venue's products, preview the filtered list, and
      publish. It is never a consent step. The one thing to get right: an answer that leaves nothing bookable must be
      visible before publishing.
    inputs:
    - field: questions[]
      rule: 1 to 4 questions, each of a kind Choice / Yes-No / Age / Level / Certification, title per language, in order.
      source: [contracts/satellite/white-label.yaml#/components/schemas/GuidedChoice, MoM 29 Sep 1 W4]
    - field: answers[]
      rule: >-
        2 to 4 per question; title, one-liner (at most 140 characters per language), icon, optional badge (at most 24
        characters, e.g. Best value). With behaviour filter each answer needs a filter (products, categories, segment tags,
        age range, swimmer yes or no, certificate held or not); with recommend each last-question answer needs a target.
      source: [contracts/satellite/white-label.yaml#/components/schemas/GuidedChoice, DI-984]
    - field: consentPrefill
      rule: An answer may pre-fill one booking consent question (e.g. Can everyone swim? -> Are you able to swim?); the guest still ticks it.
      source: [MoM 29 Sep 1 W4, DI-1005]
    - field: mode, showBanner, showEverything
      rule: Button on the booking page (default) / Also a pop-up on first arrival / Off; dark banner under the products on by default; Show everything link on by default.
      source: [DI-1052, contracts/satellite/white-label.yaml#/components/schemas/GuidedChoice]
    outputs:
    - element: AI suggestion review
      rule: A suggestion is labelled "Suggested by AI" and shows why each question and answer was proposed (ai getGuidedChoiceSuggestion); the label stays after editing.
      source: [contracts/satellite/white-label.yaml#proposeGuidedChoice, DI-1006]
    - element: Filtered-list preview
      rule: For each answer combination, the products left; a combination with none bookable is flagged red.
      source: screens/P13-white-label-cms.yaml#CMS-101
    actions:
    - action: Publish to guests
      result: Live at once at this venue (not part of the site publish); the venue's previous published set-up returns to draft. 422 names the answer whose target is not on sale or whose filter is missing.
      source: contracts/satellite/white-label.yaml#publishGuidedChoice
    - action: Unpublish
      result: Guests stop seeing it at once; back to draft.
      source: contracts/satellite/white-label.yaml#unpublishGuidedChoice
    - action: Edit a published set-up
      result: Refused 409; offer "Unpublish to edit" or "Duplicate as draft".
      source: contracts/satellite/white-label.yaml#updateGuidedChoice
    edgeCases:
    - case: Product in an answer's filter goes off sale after publish
      expected: The guest list simply narrows; the next publish attempt flags it.
      source: contracts/satellite/white-label.yaml#publishGuidedChoice
    consistency:
    - with: WEB-005
      note: The Help me choose button, banner and pop-up drawn there come from this set-up.
    - with: KSK-003
      note: The kiosk shows the same filtered list (server applies the filter).
    sampleData:
      name: Water park day planner
      questions:
      - kind: yesNo
        title: {en: 'Can everyone in your group swim?', ar: 'هل يستطيع جميع أفراد مجموعتك السباحة؟'}
        answers: [All of us, Some of us, None of us]
      - kind: age
        title: {en: 'How old is the youngest?', ar: 'كم عمر الأصغر سنًا؟'}
        answers: [Under 4, 4 to 11, 12 and over]
      result: None of us -> Splash and river pass (Adult AED 175, Junior AED 135, Child AED 125)
    corrections:
    - what: Notes and formCreateGuidedChoice say one or two questions and a target per answer.
      why: W4 (29 September) made it 1-4 questions with filter as the default behaviour, where a target is optional; the screen text predates it (DI-984 also says up to 2).
      source: [contracts/satellite/white-label.yaml#/components/schemas/GuidedChoice, MoM 29 Sep 1 W4, DI-984]
    openQuestions: []

  CMS-102:
    block: A
    summary: >-
      The step-based Site Builder: pick a preset (theme park, water park, museum, theatre and arena, single attraction,
      play centre, several venues), then seven saved steps, each opening the full screen and coming back. The minimum path
      (logo, four colours, one valid booking flow, a publish) is always visible, so a client gets a working site in about
      30 minutes. Every option the builder touches must visibly change something in a preview.
    inputs:
    - field: presetKey
      rule: Seven picture cards; picking one proposes modules, booking flow types, homepage sections and tabs, and writes nothing until each step is accepted.
      source: [contracts/satellite/white-label.yaml#/components/schemas/SiteSetupProgress, DI-997]
    - field: steps[].status
      rule: Not started / In progress / Done / Skipped; steps 4 (Help me choose) and 6 (Mobile app) may be skipped. Saved on every return.
      source: contracts/satellite/white-label.yaml#setSiteSetupProgress
    outputs:
    - element: Step rail
      rule: 1 Venue and modules · 2 Ticketing flows · 3 Compose steps · 4 Help me choose · 5 Look and feel · 6 Mobile app · 7 Preview and publish, each with status and the screens it opens.
      source: contracts/satellite/white-label.yaml#/components/schemas/SiteSetupStepKey
    - element: Minimum path checklist
      rule: Logo, four theme colours, at least one enabled valid booking flow, a published version; ticked from the server (minimumPathDone).
      source: contracts/satellite/white-label.yaml#/components/schemas/SiteSetupProgress
    - element: Live preview
      rule: The guest Home updates as steps are accepted.
      source: DI-988
    actions:
    - action: Add these flows
      result: Creates each ticked preset flow type at the venue with its default steps (isDefaultForType on).
      source: contracts/satellite/white-label.yaml#createBookingFlowDefinition
    - action: Mark Preview and publish done
      result: Refused 409 until a version is published.
      source: contracts/satellite/white-label.yaml#setSiteSetupProgress
    edgeCases:
    - case: Operator leaves halfway and returns a week later
      expected: Opens on currentStep with the preset still chosen.
      source: contracts/satellite/white-label.yaml#getSiteSetupProgress
    - case: Tenant with several venues
      expected: Steps 2 and 3 repeat per venue; the rail shows venue progress (2 of 4 venues have valid flows).
      source: contracts/satellite/white-label.yaml#listBookingFlows
    consistency:
    - with: CMS-001
      note: Step 1 is CMS-001's module and feature switches.
    - with: CMS-104
      note: After the first publish, the builder offers the app build.
    sampleData:
      preset: waterPark
      steps: {venueAndModules: done, ticketingFlows: done, composeSteps: inProgress, helpMeChoose: skipped, lookAndFeel: notStarted, mobileApp: notStarted, previewAndPublish: notStarted}
      minimumPath: {logo: true, colours: true, validFlow: false, published: false}
    corrections:
    - what: CMS-009 Navigation & Menus, which steps 5 and 6 open for the header menu, the tab bar and the Buy tickets button, is filed under module Food & Beverage and mixes F&B menus (listMenus with an outlet filter, createMenu, setMenuSections) into the navigation editor.
      why: Navigation menus and food menus are different things; the step opens a screen whose list is restaurant menus. Cross-process with fnb-retail, which owns CMS-009.
      source: screens/P13-white-label-cms.yaml#CMS-009
    decisions:
    - question: Which modules, flows, sections and tabs does each preset propose? No source lists them.
      decision: 'Drawn default accepted: Water park proposes ticketsAndBooking, diningAndFnb, shop, map; datedDayPass and
        cabanaMap; heroBanner, tickets, attractions, dining; tabs Home, Explore, Map, Tickets.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-159 | CHG-NOTE-009
      questionSource: contracts/satellite/white-label.yaml#/components/schemas/SiteSetupProgress

  CMS-103:
    block: A
    summary: >-
      Pick the venue's booking flows from the fixed catalogue, turn optional steps on or off, reorder within the type's
      constraints with a live preview, set step and flow settings, assign flows to products and categories, and validate.
      Flows publish with the whole site. The one thing to get right: a drag that breaks a constraint is refused before it
      lands, with the constraint in words.
    inputs:
    - field: flowTypeKey
      rule: >-
        Cards for the 16 types (dated day pass, timed entry, open-dated, seated fixed performance, seated date-time-seat map,
        workshop, surf or session, meeting room, cabana on a map, cabana by size, guided tour by language, transport, table
        reservation, membership, gift card, several locations), each listing its steps with Required / Optional /
        Conditional marks.
      source: contracts/satellite/white-label.yaml#/components/schemas/BookingFlowType
    - field: steps[] order and enabled
      rule: >-
        Drag handles; Required steps locked on; Conditional steps show their condition in words (e.g. "Only when the tenant
        has more than one venue"). Each drop is checked with validateBookingFlow and the proposed steps before it lands.
      source: contracts/satellite/white-label.yaml#validateBookingFlow
    - field: step settings
      rule: Only the names the type gives (e.g. tour languages, room hours 1-8 by 60 minutes, party size 1-12); an unknown name is refused (400).
      source: contracts/satellite/white-label.yaml#/components/schemas/BookingFlowStep
    - field: flow settings
      rule: Performance reveal Date then time then ticket (default) / All at once; sign in After add-ons (default) / At payment; seated date Inline (default) / Pop-up over the seat map; extras Auto / Always / Never; Quick tour off by default; up to 10 consent questions.
      source: [DI-1042, DI-1043, DI-1044, DI-1060, contracts/satellite/white-label.yaml#/components/schemas/BookingFlowLevelSettings]
    outputs:
    - element: Live preview
      rule: The flow step by step on web and mobile, with the step indicator style from CMS-016, beside the published flow for comparison.
      source: screens/P13-white-label-cms.yaml#CMS-103
    - element: Validation
      rule: Problems by kind (required step off, order broken, condition never holds, step not in type, duplicate, unknown setting) each naming the step and the fix.
      source: contracts/satellite/white-label.yaml#/components/schemas/BookingFlowValidation
    actions:
    - action: Save flow
      result: Saves to the draft even when invalid (isValid false), so work can stop halfway; the publish refuses an invalid enabled flow.
      source: contracts/satellite/white-label.yaml#updateBookingFlowDefinition
    - action: Remove flow
      result: Refused 409 while products or categories name it or it is the default for products on sale; offer reassignment.
      source: contracts/satellite/white-label.yaml#deleteBookingFlow
    edgeCases:
    - case: Turning extras off for a flow whose products have add-ons
      expected: Allowed; the preview shows the flow collapse to Tickets -> Cart -> Checkout.
      source: DI-428
    - case: A product names a disabled flow
      expected: It falls back to the venue default for its kind; show which products fall back.
      source: contracts/satellite/white-label.yaml#/components/schemas/BookingFlow
    consistency:
    - with: CMS-016
      note: Venue-wide settings shown read-only beside the step that uses them.
    - with: WEB-006
      note: Times per page, day parts and reveal order drawn there follow these settings.
    sampleData:
      venue: Coastal Aqua Yas Island
      flow: {name: Day pass with cabana, type: cabanaMap, steps: [date, resourceMap, consent, extras, review, payment], settings: {signInAt: afterAddOns, extrasStep: auto}}
      invalidDrop: "Payment can't move above Review: payment is always last."
    corrections:
    - what: The surfSession type's level step has a broken stepSettings note in the contract (a stray key "from the products' segmentTags" with a null value).
      why: A YAML colon inside the note split it; the generated catalogue carries a bogus setting name.
      source: contracts/satellite/white-label.yaml#/components/schemas/BookingFlowType
    openQuestions: []

  CMS-104:
    block: A
    summary: >-
      Get the tenant's branded app into the App Store and Google Play under the client's own accounts: a checklist of what
      only the client can do (D-U-N-S, Apple and Google developer accounts), the store listing, a build from a published
      version, then download to upload or submit with the client's credential, and follow store review. A guide walks the
      client through each outside step.
    inputs:
    - field: accounts[] (per store)
      rule: Legal name as the store knows it; Apple needs a nine-digit D-U-N-S number (400); Team ID or Play developer id; bundle / application id (e.g. ae.coastalaqua.app); API credential optional, write-only, shown as "Credential stored".
      source: [contracts/satellite/white-label.yaml#/components/schemas/StoreAccount, DI-993]
    - field: listing
      rule: App name, subtitle, description and keywords in every tenant language (400 if one is missing), category, support and privacy URLs, screenshots.
      source: contracts/satellite/white-label.yaml#setStoreAccounts
    - field: requestAppBuild {platform, configVersion, releaseNotes, submitToStore}
      rule: Platform iOS / Android; version defaults to the current published one; release notes per language; Submit to the store only with a stored credential.
      source: contracts/satellite/white-label.yaml#requestAppBuild
    outputs:
    - element: Checklist
      rule: Apple D-U-N-S, Apple Developer account, Google Play account (marked "Only you can do this"), store listing, app icons, a published configuration; each open item with its next step.
      source: [contracts/satellite/white-label.yaml#/components/schemas/StorePublishingChecklist, DI-994]
    - element: Builds
      rule: Platform, version name and build number, configuration version, status (Queued, Building, Built, Failed, Submitted, In review, Approved, Rejected, Released), times; download link for the signed .ipa or .aab.
      source: contracts/satellite/white-label.yaml#/components/schemas/AppBuild
    - element: Powered by TICVAI
      rule: 'A configuration toggle, default on: shown on the launch screen under the splash and at the foot of Account, unless
        the venue''s licence allows switching it off.'
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    actions:
    - action: Request a build
      result: 202 queued; 409 says which of no store account, nothing published, or a build already running. Needs TENANT_PUBLISH.
      source: contracts/satellite/white-label.yaml#requestAppBuild
    - action: Ask the guide
      result: The in-platform publishing guide answers; unavailable until its assistant profile exists, the checklist guidance still works.
      source: [DI-994, screens/P13-white-label-cms.yaml#CMS-104]
    edgeCases:
    - case: Store rejects the build
      expected: Status Rejected with the store's reason (when a credential is stored) and a link to the guide.
      source: contracts/satellite/white-label.yaml#/components/schemas/AppBuild
    - case: No credential stored
      expected: Status stays Built after download; the client uploads by hand and the screen says the review status will not update here.
      source: contracts/satellite/white-label.yaml#/components/schemas/AppBuild
    consistency:
    - with: CMS-004
      note: The icons and splash built come from there.
    - with: CMS-001
      note: After a release, the minimum app version can force older apps to update.
    sampleData:
      apple: {accountHolderName: Coastal Leisure Group LLC, dunsNumber: '565123987', developerAccountId: 9KX2B7Q4LM, appIdentifier: ae.coastalaqua.app}
      google: {developerAccountId: '7182736455091827364', appIdentifier: ae.coastalaqua.app}
      build: {platform: ios, versionName: 2.4.0, buildNumber: 41, configVersion: '14', status: inReview}
    corrections:
    - what: ADR-0006 says TICVAI builds, signs and submits and tenants do not self-publish, and that shared-tier tenants get a branded PWA.
      why: M24-08 lets the client download and upload the build itself, and CMS-104 offers native builds to every tenant; the ADR and the screen disagree.
      source: [ADR-0006, DI-998, DI-993]
    - what: The listing has no place for the TICVAI credit the client asked to keep visible in published apps.
      why: Qossai asked that the TICVAI name always remain visible to app users; nothing says where in the app or listing.
      source: [DI-250, DI-224]
    decisions:
    - question: Where does "Powered by TICVAI" appear in the published app (launch, Account, About)?
      decision: '"Powered by TICVAI" is a configuration toggle, default on: shown unless the venue''s licence allows switching
        it off (Pre-apply round, 2 October; DI-297 amended).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-160 | CHG-NOTE-009
      questionSource:
      - DI-250
      - DI-297

  # =====================================================================================================
  # P09 TICVAI console -- Block A
  # =====================================================================================================
  ADM-016:
    block: A
    summary: >-
      Platform staff look at, and when asked by the tenant change, a tenant's branding: brand marks, app icons, theme,
      versions, preview and publish. Every action runs inside the tenant's cell under a time-boxed, audited grant the
      tenant can see. The one thing to get right: it is unmistakably acting on someone else's site, with the grant and its
      countdown always visible, and it reuses the tenant's own editors rather than a second, older form.
    inputs:
    - field: Tenant picker, then grant
      rule: >-
        Pick a tenant (code and name); until a grant is open every tenant action is disabled. The grant asks the reason,
        ticket reference and expiry (at most 8 hours) after a second factor; permissions preselected to TENANT_CONFIGURE,
        plus TENANT_PUBLISH only if publishing is part of the request.
      source: [screens/P09-platform-admin-console.yaml#ADM-016, R098]
    - field: Brand, icons and theme
      rule: The same panels as CMS-002, CMS-004 and CMS-005, including logoVariant, intro video, surfaceStyle, buttonStyle and componentColours, with the same limits and contrast refusal.
      source: [contracts/satellite/white-label.yaml#/components/schemas/Theme, contracts/satellite/white-label.yaml#/components/schemas/BrandIdentity]
    outputs:
    - element: Grant bar
      rule: Pinned at the top in a caution colour, never the tenant's colours; tenant, permissions, reason, time left; at expiry the screen returns to the grant-required state.
      source: R098
    - element: Tenant brand in a frame
      rule: The tenant's theme renders only inside preview frames; the console chrome stays TICVAI-branded.
      source: DI-296
    actions:
    - action: Publish on the tenant's behalf
      result: Same gate as CMS-014 (note required, diff, findings); the version records the platform operator as publisher and the tenant sees it in its audit log.
      source: [contracts/satellite/white-label.yaml#publishTenantConfig, R098]
    - action: Generate site package (self-hosted)
      result: 'For a venue that hosts its own site: exports the published site as a package the venue deploys. For a site
        hosted with TICVAI, platform staff publish under a grant instead.'
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    edgeCases:
    - case: Grant expires mid-edit
      expected: Unsaved edits are kept in the form, actions disable, and a new grant is offered; nothing is half-sent.
      source: R098
    consistency:
    - with: CMS-005
      note: Same theme editor component, same contrast check.
    - with: CMS-014
      note: Same publish gate.
    sampleData:
      tenant: {code: CLG, name: Coastal Leisure Group}
      grant: {operator: Priya Nair (TICVAI support), reason: Client asked to fix contrast on the pay button, ticketRef: SUP-20431, expiresAt: '2026-10-01 17:30 GST'}
    corrections:
    - what: The theme and brand forms here omit surfaceStyle, buttonStyle, componentColours, logoVariant and the intro video, and send splashChangeScope.
      why: A stale copy of the tenant editors; platform staff would save a theme that silently drops the tenant's per-element colours.
      source: [screens/P13-white-label-cms.yaml#CMS-005, screens/P13-white-label-cms.yaml#CMS-004]
      status: fixed
      by: CHG-SBO-014
    - what: Purpose says "for this venue" and entry parameters bannerId, pageId and policyKind.
      why: Branding is per tenant; the parameters are left from the bulk attach.
      source: screens/P09-platform-admin-console.yaml#ADM-016
      status: fixed
      by: CHG-WIR-016
    - what: F102 hands over from the tenant's CMS-006 to this console screen as step 4.
      why: A tenant's journey never continues on the platform console.
      source: F102 step 3
      status: logged
      by: CHG-SBO-020
    decisions:
    - question: May platform staff publish a tenant's site, or only prepare the draft for the tenant to publish?
      decision: 'Hosted with TICVAI: platform staff may publish a tenant''s site under a grant. Self-hosted: the venue uses
        ''Generate site package'' (export).'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-144 | CHG-NOTE-009
      questionSource:
      - MATRIX 19.1.24
      - R098

  ADM-017:
    block: A
    summary: >-
      Platform staff help a tenant with its custom domains: see each domain's status and the record the tenant must
      publish, trigger an early check, and release a domain on request, inside a grant. Same model as CMS-017.
    outputs:
    - element: Domain list
      rule: Hostname, kind, status, record to publish, last checked, certificate expiry (amber within 30 days), failure reason; sorted with problems first.
      source: [contracts/satellite/white-label.yaml#listCustomDomains, contracts/satellite/white-label.yaml#/components/schemas/CustomDomain]
    actions:
    - action: Release
      result: Refused 409 for the only active domain of a published app; otherwise unroutes at once and keeps the row for audit.
      source: contracts/satellite/white-label.yaml#relinquishCustomDomain
    edgeCases:
    - case: hostname-taken at verify
      expected: Platform staff see which tenant holds it only if their own permissions allow; the tenant never does.
      source: contracts/satellite/white-label.yaml#claimCustomDomain
    consistency:
    - with: CMS-017
      note: Same table and actions; the tenant normally works there.
    sampleData:
      domain: {hostname: book.summitpeaks.ae, status: failed, failureReason: TXT record not found after 48 hours}
    corrections:
    - what: openQuestions says "No contract — not specified".
      why: The domain operations exist since 24 August.
      source: contracts/satellite/white-label.yaml#claimCustomDomain
      status: fixed
      by: CHG-SBO-014
    - what: F103 "A tenant claims a domain" runs on this platform screen.
      why: The tenant claims on CMS-017; ADM-017 is the support path.
      source: [F103 step 1, screens/P13-white-label-cms.yaml#CMS-017]
      status: fixed
      by: CHG-WIR-016
    - what: Shows verificationToken instead of verificationRecord; entry parameters bannerId, pageId, policyKind, version.
      why: The record is what support reads out to the tenant; the parameters are bulk-attach leftovers.
      source: contracts/satellite/white-label.yaml#/components/schemas/CustomDomain
      status: fixed
      by: CHG-WIR-015
    openQuestions: []

  ADM-018:
    block: A
    summary: >-
      Platform staff set a tenant's languages and help with its FAQs and policies inside a grant. The one thing to get
      right: policies are versioned and every save publishes a new version that guests may have to re-consent to, so a
      policy save is never a casual Save.
    inputs:
    - field: languages, defaultLanguage
      rule: Same control as CMS-011.
      source: contracts/satellite/white-label.yaml#setLanguages
    - field: FAQ categories and entries
      rule: Category name per language, entries with question per language and rich-text answer per language, published switch per entry, drag to order. FAQs are also the AI concierge's grounding, so an answer is content, not a ticket.
      source: contracts/satellite/white-label.yaml#setFaqs
    - field: policy {kind, body, requiresReconsent, effectiveFrom}
      rule: Kind Privacy / Terms and conditions / Refund / Cookie / Accessibility; body must have English and Arabic (400); requiresReconsent asks existing guests to consent again on next launch.
      source: [contracts/satellite/white-label.yaml#setPolicy, R096]
    - field: Interface languages
      rule: A tenant can add or select interface languages beyond English and Arabic.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    outputs:
    - element: Policy history
      rule: Current version per kind; with history, every version newest first; versions are read-only.
      source: contracts/satellite/white-label.yaml#listPolicies
    actions:
    - action: Publish policy version
      result: Live at once as a new version; the confirmation says whether guests must re-consent.
      source: contracts/satellite/white-label.yaml#setPolicy
    edgeCases:
    - case: Arabic body missing
      expected: Publish refused with the missing language named.
      source: R096
    consistency:
    - with: CMS-018
      note: The tenant's own policy editor.
    - with: CMS-011
      note: Same language control.
    sampleData:
      policy: {kind: refund, version: '3', effectiveFrom: 2026-10-15, requiresReconsent: false}
      faq:
        category: {en: Tickets, ar: التذاكر}
        question: {en: 'Can I change my visit date?', ar: 'هل يمكنني تغيير موعد زيارتي؟'}
    corrections:
    - what: The name says Localisation & Language Pack and the content is FAQs and policies.
      why: A platform language pack (adding a new interface language as configuration, DI-083) has no operation; FAQs and policies are tenant content that also live on CMS-018.
      source: [DI-083, screens/P13-white-label-cms.yaml#CMS-018]
      status: fixed
      by: CHG-SBO-014
    - what: formSetPolicy has no kind selector and the screen sends effectiveFrom, which setPolicy's body does not declare as required.
      why: setPolicy is keyed by the policyKind path parameter; the form must ask for the kind.
      source: contracts/satellite/white-label.yaml#setPolicy
      status: fixed
      by: CHG-SBO-014
    decisions:
    - question: Which screen adds a new interface language (UI strings) for the platform?
      decision: A tenant can add or select interface languages beyond English and Arabic.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-145 | CHG-NOTE-009
      questionSource:
      - DI-083
      - handoff/localisation.md

  # =====================================================================================================
  # P01 Guest web -- Block A (the guest screens the configuration changes)
  # =====================================================================================================
  WEB-001:
    block: A
    summary: 'The guest web home, entirely in the tenant''s brand: header, hero, the tenant''s homepage sections in its order,
      the ticket categories, banners, the footer with the Powered by TICVAI credit (shown by default). A first visit asks
      for the venue first. The one thing to get right for white-label: everything visual comes from the published configuration
      resolved for the chosen venue, and nothing renders for a disabled module.'
    inputs:
    - field: Your venue
      rule: >-
        On first open, before anything else, a venue picker from the tenant's published, active venues (name, city,
        today's hours), remembered on the device; Change venue in the header. A tenant with one venue skips it.
      source: [R267, contracts/satellite/white-label.yaml#getTenantAppStatus]
    - field: Language
      rule: EN / العربية button in the header (only the tenant's enabled languages); the whole page mirrors in Arabic.
      source: [DI-975, contracts/satellite/white-label.yaml#setLanguages]
    outputs:
    - element: Header
      rule: >-
        HeaderConfig layout (logo left, logo centre or logo with menu) with the logoVariant lockup, navigation items from
        NavigationConfig, language button, single profile icon, cart. Never a date picker in the header.
      source: [contracts/satellite/white-label.yaml#/components/schemas/HeaderConfig, DI-990, DI-974]
    - element: Hero
      rule: Shown when heroBanner is on (default) and embedMode is fullPage; a video hero streams with a poster fallback; the search box only when searchInBanner is on (default off). Banners with placement homepageHero rotate here in their schedule.
      source: [DI-945, DI-738, DI-1070, contracts/satellite/white-label.yaml#/components/schemas/Banner]
    - element: Sections
      rule: HomepageLayout sections in sortOrder, visible ones only; a section whose module is off does not render at all (no empty frame).
      source: [contracts/satellite/white-label.yaml#setHomepageLayout, screens/P01-guest-web-storefront.yaml#WEB-001]
    - element: Category and product cards
      rule: >-
        cardLayout decides the arrangement: Cards across and Poster cards wrap into an equal-height grid; Stacked rows and
        Split rows stay one column and the Discover rail scrolls sideways. cardSize and density scale them. Info-only
        products show their label when showInfoOnly is on.
      source: [DI-1040, DI-1009, sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html, DI-1054]
    - element: Footer
      rule: The tenant's columns, the legal links (always present), copyright and social links, then the "Powered by TICVAI"
        line unless the venue switched it off (CMS-104).
      source:
      - contracts/satellite/white-label.yaml#setFooter
      - DI-111
      - decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    - element: Availability banner
      rule: Sold out today or Closed with the tenant's message, under the header; nothing while open.
      source: R073
    - element: Layout
      rule: The client-approved web and app wireframes are the layout; change them only where the spec breaks.
      source: decided 2 October 2026 by Chinmay (CHG-NOTE-009)
    actions:
    - action: Change venue
      result: Replaces the remembered venue; every venue-scoped screen and the venue's booking-setting overrides reload.
      source: [R267, DI-1063]
    edgeCases:
    - case: Tenant has never published
      expected: getTenantConfig answers 404 not-configured; show a neutral "This site is opening soon" with Powered by TICVAI, no tenant brand.
      source: contracts/satellite/white-label.yaml#getTenantConfig
    - case: Maintenance on
      expected: The branded maintenance page (WEB-029) replaces the home, not a banner on it.
      source: contracts/satellite/white-label.yaml#setMaintenanceMode
    - case: Embedded mode
      expected: No venue header, hero or footer; the powered-by strip and progress stay.
      source: sources/designs/guest-rev3-30-september/TICVAI Engine Controls Manual.dc.html
    consistency:
    - with: GST-001
      note: Same venue picker, availability banner and section order (app shows its own Home sections).
    - with: CMS-007
      note: What CMS-007 previews is this page.
    sampleData:
      venues: [{name: Coastal Aqua Yas Island, city: Abu Dhabi, hours: '10:00 – 19:00'}, {name: Kids Club Al Barsha, city: Dubai, hours: '09:00 – 21:00'}, {name: Kids Club Mirdif, city: Dubai, hours: '09:00 – 21:00'}]
      hero: {en: Make a splash this weekend, ar: استمتع بعطلة نهاية أسبوع مليئة بالمرح}
      categories: [Day passes, Cabanas, Annual passes, Gift cards]
    corrections:
    - what: The context panel shows staff-only TenantAppStatus fields (draftVersion, hasUnpublishedChanges, counts, recentChanges) and TenantConfig.isDraft on a guest screen.
      why: A guest response never carries them; a guest reads the published configuration to style the page, never to display it.
      source: contracts/satellite/white-label.yaml#getTenantAppStatus
      status: fixed
      by: CHG-GST-003
    - what: getTenantConfig (the theme, fonts, header, navigation, homepage) needs a guest session or a staff session; a first-time visitor has neither.
      why: The storefront must render in the tenant's brand before anyone signs in; getTenantAppStatus, getPublishedBookingFlow and getPublishedGuidedChoice already allow an anonymous call.
      source: [contracts/satellite/white-label.yaml#getTenantConfig, contracts/satellite/white-label.yaml#getTenantAppStatus]
      status: fixed
      by: CHG-GST-001
    - what: The product table lists staff columns (createdByPrincipalId, approvedByPrincipalId, scopePath) and filters Kind and Is sellable as text fields.
      why: Guest cards show name, image, from-price, tags and availability only.
      source: [DI-026, screens/P01-guest-web-storefront.yaml#WEB-001]
      status: fixed
      by: CHG-GST-003
    - what: TenantConfig.venues (name as LocalisedText, from tenancy, active venues) and TenantAppStatus.venues (name as a string, published venues only) describe the same picker differently.
      why: Two shapes and two inclusion rules for one list; the picker cannot show an Arabic venue name from the status read.
      source: [contracts/satellite/white-label.yaml#/components/schemas/TenantConfig, contracts/satellite/white-label.yaml#/components/schemas/TenantAppStatus]
    decisions:
    - question: Is the web homepage arranged by the same HomepageLayout as the app Home, or does it need its own (DI-285 asks
        web and mobile independently)?
      decision: The client-approved web and app wireframes are the layout; change them only where the spec breaks.
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-163 | CHG-NOTE-009
      questionSource:
      - DI-285
      - contracts/satellite/white-label.yaml#/components/schemas/HomepageSectionKind

  WEB-028:
    block: A
    summary: >-
      How a guest reaches the venue: phone, WhatsApp, email, address and opening hours as the tenant wrote them, plus
      today's hours per venue. Each channel is one tap. Missing ones are left out, never shown blank.
    outputs:
    - element: Contact cards
      rule: Phone (tel:), WhatsApp (wa.me link), email (mailto:), address with a map link, opening hours prose; phone numbers stay left-to-right in Arabic.
      source: [contracts/satellite/white-label.yaml#/components/schemas/VenueContact, docs/architecture/rtl-and-theming.md]
    - element: Venues today
      rule: Each venue with city and today's hours, or "Closed today".
      source: contracts/satellite/white-label.yaml#/components/schemas/TenantAppStatus
    edgeCases:
    - case: Status read fails
      expected: Show the contact details cached with the last configuration and their age.
      source: screens/P01-guest-web-storefront.yaml#WEB-028
    consistency:
    - with: WEB-029
      note: The closed state reuses these hours.
    sampleData:
      contact:
        phone: '+971 2 555 0142'
        whatsapp: '+971 50 555 0142'
        email: hello@coastalaqua.ae
        address: {en: 'Yas Island, Abu Dhabi', ar: 'جزيرة ياس، أبوظبي'}
        openingHours: {en: 'Daily 10:00 to 19:00, Fridays 13:00 to 21:00', ar: 'يوميًا من 10:00 إلى 19:00، الجمعة من 13:00 إلى 21:00'}
    corrections:
    - what: Contact is one VenueContact for the whole tenant, while the screen is "for this venue" and a tenant has several venues.
      why: Kids Club Al Barsha and Kids Club Mirdif have different phones and addresses; the guest picked one.
      source: [contracts/satellite/white-label.yaml#/components/schemas/VenueContact, R267]
    - what: The detail panel lists the staff-only TenantAppStatus fields.
      why: Not returned to a guest.
      source: contracts/satellite/white-label.yaml#getTenantAppStatus
    decisions:
    - question: Per-venue contact details?
      decision: 'Drawn default accepted: Show the tenant contact and each venue''s hours until the contract carries per-venue
        contact.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-164 | CHG-NOTE-009
      questionSource: contracts/satellite/white-label.yaml#/components/schemas/VenueContact

  WEB-029:
    block: A
    summary: >-
      The branded page that tells a guest whether to wait or leave: maintenance (come back at a time), sold out today
      (come another day), closed (the venue is not open), or the platform not answering. Always in the tenant's brand from
      the last configuration the browser holds; never a generic error.
    outputs:
    - element: Maintenance
      rule: The tenant's maintenance message and "Expected back at 22:00" in the guest's time format; no booking actions; contact links.
      source: contracts/satellite/white-label.yaml#setMaintenanceMode
    - element: Sold out today
      rule: The tenant's availability message and a date picker for another day; browsing still works.
      source: [R073, contracts/satellite/white-label.yaml#/components/schemas/AppAvailability]
    - element: Closed
      rule: The message and the opening hours from contact.
      source: R073
    - element: Platform not answering
      rule: When the status call fails or times out; "We can't reach the booking service right now", retry, and contact; uses the cached brand.
      source: screens/P01-guest-web-storefront.yaml#WEB-029
    edgeCases:
    - case: Guest's own connection drops
      expected: The offline banner, never this page.
      source: screens/_guest-pairs.yaml
    consistency:
    - with: GST-047
      note: The same four states and wording; the app adds the forced update.
    sampleData:
      maintenance: {en: "We're adding new slides. Back at 22:00 tonight.", ar: 'نضيف منزلقات جديدة. نعود الساعة 22:00 الليلة.'}
      soldOut: {en: Today is sold out. Tomorrow has space from AED 249., ar: نفدت تذاكر اليوم. تتوفر أماكن غدًا ابتداءً من 249 درهم.}
    corrections:
    - what: The screen has no maintenance state (isInMaintenance, maintenanceMessage, expectedBackAt) though its name and the maintenance operation point to it; the prototype labels this state Maintenance.
      why: Maintenance is the main case setMaintenanceMode renders.
      source: [contracts/satellite/white-label.yaml#setMaintenanceMode, DI-215]
    - what: The prototype's sold-out page offers Join the waitlist, which this screen cannot call.
      why: Either a waitlist operation joins the screen or the prototype drops it.
      source: screens/P01-guest-web-storefront.yaml#WEB-029
    openQuestions: []

  WEB-045:
    block: A
    summary: >-
      One Help view with tabs FAQ, My cases, Policies, Accessibility, plus app status and What's new. Public: a guest who
      is not signed in can read every answer and policy. All text is the tenant's, per language.
    outputs:
    - element: FAQ
      rule: Categories in the tenant's order, published entries only, search across questions, answers as sanitised rich text.
      source: contracts/satellite/white-label.yaml#listFaqs
    - element: Policies
      rule: Current version of each policy, with version number and effective date.
      source: contracts/satellite/white-label.yaml#/components/schemas/Policy
    - element: Accessibility
      rule: The tenant's accessibility statement and pages (step-free routes, facilities, what to expect).
      source: [DI-190, DI-243]
    - element: What's new
      rule: Up to 10 public release notes, newest first, localised.
      source: [DI-1073, contracts/satellite/white-label.yaml#/components/schemas/TenantAppStatus]
    edgeCases:
    - case: No FAQs published
      expected: Show contact options (WEB-028) instead of an empty list.
      source: contracts/satellite/white-label.yaml#listFaqs
    consistency:
    - with: GST-040
      note: Same tabs and wording in the app.
    - with: WEB-025
      note: One implementation, both ids.
    sampleData:
      faq:
        question: {en: 'Can I bring my own food?', ar: 'هل يمكنني إحضار طعامي الخاص؟'}
        answer: {en: 'Sealed snacks and water are welcome. Glass is not allowed.'}
    corrections:
    - what: listPolicies is staff-only (TENANT_CONFIGURE, no guest security), so the Policies tab has nothing a guest can read.
      why: The guest must read the current terms, privacy, refund and cookie policies.
      source: contracts/satellite/white-label.yaml#listPolicies
      status: fixed
      by: CHG-GST-002
    - what: emptyNoAccess says "Sign in to see this"; listFaqs and listContentPages need a guest session.
      why: Help is public; FAQs and pages must be readable anonymously.
      source: [contracts/satellite/white-label.yaml#listFaqs, contracts/satellite/white-label.yaml#listContentPages]
      status: fixed
      by: CHG-GST-002
    - what: No rule says which content page is the accessibility statement (a categoryCode, a slug, FooterConfig.legalLinks.accessibilityUrl or the accessibility Policy).
      why: Three places can hold it.
      source: [contracts/satellite/white-label.yaml#/components/schemas/FooterConfig, contracts/satellite/white-label.yaml#/components/schemas/PolicyKind]
      status: fixed
      by: CHG-GST-003
    decisions:
    - question: Where does the accessibility statement live?
      decision: 'Drawn default accepted: The accessibility Policy is the statement; content pages with categoryCode accessibility
        are the practical guides.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-165 | CHG-NOTE-009
      questionSource:
      - contracts/satellite/white-label.yaml#/components/schemas/PolicyKind
      - DI-243

  # =====================================================================================================
  # P02 Guest app -- Block A
  # =====================================================================================================
  GST-001:
    block: A
    summary: >-
      The app's Home tab: optional intro video on launch, then the venue in the tenant's brand (hero in the tenant's chosen
      style, the venue overview with today's hours, type tiles, one or two highlights per type), the tab bar the tenant
      arranged and the persistent Buy tickets button. It never opens straight into booking.
    inputs:
    - field: Your venue
      rule: Same first-open picker and Change venue as WEB-001; on a visit day the ticket's venue is suggested, never switched automatically.
      source: R267
    outputs:
    - element: Intro video
      rule: introVideoMode firstLaunch (first open on this device) or everyLaunch; full screen, muted, Skip introduction always visible; Home loads behind it.
      source: [DI-1020, contracts/satellite/white-label.yaml#/components/schemas/BrandIdentity]
    - element: Hero
      rule: heroStyle Carousel / Video / Poster / Split from the heroBanner section; a video falls back to its poster image.
      source: [contracts/satellite/white-label.yaml#/components/schemas/HomepageLayout, DI-1018]
    - element: Venue overview
      rule: Description, today's opening hours, before-you-go; then type tiles (rides, dining, events, shops) and maxItems (1-2) highlights per type, in the section order.
      source: [DI-1018, contracts/satellite/white-label.yaml#/components/schemas/HomepageSectionKind]
    - element: Tab bar and Buy tickets
      rule: The tenant's tabs (default Home, Explore, Plan, Tickets; Plan only with visitPlanner); the Buy tickets button raised in the centre, floating, flat or hidden, labelled per language; opens GST-003.
      source: [DI-1081, DI-1087, contracts/satellite/white-label.yaml#/components/schemas/NavigationConfig]
    edgeCases:
    - case: Forced update
      expected: Below minimumAppVersion the app shows GST-047 instead of Home.
      source: R073
    - case: Offline at launch
      expected: Home from the last cached configuration with its age; the intro video is skipped.
      source: screens/P02-guest-mobile-app.yaml#GST-001
    consistency:
    - with: WEB-001
      note: Same venue picker and availability banner.
    - with: CMS-009
      note: Tab arrangement and Buy tickets style come from there.
    sampleData:
      venue: {name: Coastal Aqua Yas Island, nameAr: كوستال أكوا جزيرة ياس, hoursToday: '10:00 – 19:00'}
      tabs: [Home, Explore, Buy tickets (raised), Map, Tickets]
      highlights: {rides: [Tornado Tower, Lazy River], dining: [Surf Shack Grill]}
    corrections:
    - what: The highlights note names a field itemsPerSection set on CMS-007.
      why: The field is HomepageLayout.sections[].maxItems.
      source: contracts/satellite/white-label.yaml#/components/schemas/HomepageLayout
      status: fixed
      by: CHG-GST-003
    - what: The venue overview's description and before-you-go text have no source; TenantAppStatus.venues carries name, city and today's hours only.
      why: Home cannot show a venue description that nothing stores.
      source: contracts/satellite/white-label.yaml#/components/schemas/TenantAppStatus
    - what: The guest Home reads getGuestProfile with engagementScore, lifetimeValue and tags, and emptyNoAccess cites GUEST_VIEW.
      why: Staff CRM fields and a staff permission on a guest screen.
      source: MATRIX 19.2.7
      status: fixed
      by: CHG-GST-003
    decisions:
    - question: Where is the venue description for the Home overview authored?
      decision: 'Drawn default accepted: A content page per venue with categoryCode venueOverview.'
      decidedBy: Chinmay
      date: '2026-10-02'
      source: DEC-161 | CHG-NOTE-009
      questionSource: DI-1018

  GST-038:
    block: A
    summary: >-
      At the Venue: the in-park mode with Map, Waits, Food, Shows, Shop and Services and a Happening now panel. From the
      white-label angle, each view exists only when its module is on, and the map, pins and route line wear the tenant's
      theme.
    outputs:
    - element: View switcher
      rule: Only views whose module is enabled (Food = diningAndFnb, Shop = shop, Map = map, Waits needs queue data); no greyed views.
      source: [contracts/satellite/white-label.yaml#setModuleEnablement, DI-193]
    - element: Map styling
      rule: Route line and selected pin in the primary colour; semantic colours for wait levels stay fixed.
      source: [screens/_design-tokens.yaml, DI-1102]
    edgeCases:
    - case: Map module off
      expected: The Map tab is not in the tab bar and this screen opens on the first enabled view.
      source: contracts/satellite/white-label.yaml#/components/schemas/LinkTarget
    consistency:
    - with: GST-021
      note: The Map view is GST-021, one implementation.
    sampleData:
      views: [Map, Waits, Food, Shows]
      happeningNow: [Dolphin show 15:30 (in 12 min), Order 1042 ready at Surf Shack Grill]
    corrections:
    - what: Guest filters Venue id, Kind and Is sellable as text fields, and emptyNoAccess cites PRODUCT_VIEW.
      why: Staff controls and a staff permission on a guest screen; the venue comes from the session.
      source: screens/P02-guest-mobile-app.yaml#GST-038
      status: fixed
