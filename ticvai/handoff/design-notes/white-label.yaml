  output: Only the Pay button changes; every other button stays primary.
  screens: [WEB-012, GST-009]
  source: DI-922
- input: 'CMS-005 accent #FFC845 used as badge background with white text'
  output: Refused on save (400 ContrastProblem, 1.5:1 against 4.5:1); nothing changes for guests; the editor marks the pair.
