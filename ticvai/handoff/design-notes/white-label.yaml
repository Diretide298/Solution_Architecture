  GST-043:
    block: A
    summary: >-
      The Arabic experience: choosing the language and what changes when Arabic is chosen. The whole layout mirrors and
      interface text switches; venue, show and dish names stay as the tenant wrote them; numbers, times, prices and codes
      stay left-to-right; the cart stays on the right unless the tenant chose mirror.
    inputs:
    - field: Language
      rule: The tenant's enabled languages only, each in its own script (English, العربية, Русский); the choice is kept on the device and, when signed in, as the guest's preferred language.
      source: [DI-975, contracts/satellite/white-label.yaml#setLanguages]
    outputs:
    - element: Mirrored layout
      rule: Back arrows, steppers, progress, drawers and the tab bar order flip; clocks, logos, media controls, QR codes and phone numbers do not. Fonts switch to the tenant's Arabic faces.
      source: [docs/architecture/rtl-and-theming.md, contracts/satellite/white-label.yaml#/components/schemas/FontConfig]
    - element: Missing Arabic copy
      rule: Long descriptions without Arabic stay in English inside the Arabic layout, left-aligned as an embedded run.
      source: DI-975
    consistency:
    - with: CMS-012
      note: What the tenant previews is this.
    sampleData:
      ar: {buyTickets: اشترِ التذاكر, total: 'الإجمالي AED 498.00', time: '15:30', venue: Coastal Aqua Yas Island}
    corrections:
    - what: The screen declares no operation and no layout.
      why: It needs the published languages (getTenantConfig.languages) and a place to store the guest's choice.
      source: screens/P02-guest-mobile-app.yaml#GST-043
    openQuestions: []

  GST-047:
    block: A
    summary: >-
      The page every journey can land on when the app cannot go on: forced update (store button only), maintenance (back
      at a time), sold out today, closed. In the tenant's brand from the cached configuration.
    outputs:
    - element: Forced update
      rule: When the app's version is below minimumAppVersion for iOS or Android; one button to the store listing; nothing else works.
      source: [R073, contracts/satellite/white-label.yaml#/components/schemas/MinimumAppVersion]
    - element: Maintenance, Sold out today, Closed
