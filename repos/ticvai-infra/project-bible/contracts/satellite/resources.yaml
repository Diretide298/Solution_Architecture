openapi: 3.1.0
info:
  title: TICVAI — Resources
  version: 1.0.0
  x-ticvai-screen-count: 9
  x-ticvai-tier: satellite
  x-ticvai-module: "1 — Ticketing Catalogue"
  x-ticvai-platforms:
    - P08 Venue Management
  # Derived from screens/*.yaml on 18 August — every platform with a screen that calls an
  # operation in this contract. **Six contracts declared none**, which the viewer reports as
  # missing taxonomy and no package checker tested for.
  description: >
    **A bookable resource is a specific object checked out to a named guest and returned.** A
    cabana, a locker, a wheelchair, a stroller, an AV rig, an instructor, an auditorium.

    ## Why this is not a product

    **A product with an availability envelope sells a slot.** It answers *"can somebody have a
    cabana at 2pm"* and it cannot answer *"which cabana, held by whom, returned when, with what
    deposit against it."*

    Ten requirements define the entity directly, 7.6 is fifteen rows of rentals with none served,
    and **the utilisation reporting behind them has no source** — you cannot report on the
    utilisation of something the model does not know exists.

    ## The three things that make it a context rather than a table

    **A calendar with conflict detection.** Two bookings on one cabana is not a pricing problem, it
    is a guest arriving to find somebody in their chair. **Conflict detection before assignment is
    the whole point**, and nothing in the package computed it.

    **Check-out and check-in.** A rental leaves with a guest and comes back, or does not. **A
    deposit is held against the object, not against the order** — which is why `orders` could not
    carry this: an order completes and a rental is still out.

    **Setup and teardown.** An auditorium booked 14:00–16:00 is unavailable 13:30–16:30, and a
    calendar that cannot express that double-books every time.

    ## What it deliberately does not own

    **Not staff scheduling.** `workforce` owns rotas. A resource of kind `person` points at a
    principal and the rota still says when they work — **this says whether they are qualified and
    whether they are already committed.**

    **Not stock.** `inventory` owns quantities of interchangeable things. **A resource is not
    interchangeable** — that is the whole distinction, and a venue with forty identical strollers
    has forty resources because guest number twelve returned stroller number twelve.

servers:
  - url: https://api.ticvai.com/v1

paths:
  /resources:
    get:
      operationId: listResources
      x-ticvai-consumed-by:
        - "P08 BO-095 Resources"
      summary: Resources at this venue
      tags: [resources]
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: kind
          in: query
          schema: { type: string }
        - name: availableFrom
          in: query
          schema: { type: string, format: date-time }
        - name: availableTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Resource' }
    post:
      operationId: createResource
      x-ticvai-consumed-by:
        - "P08 BO-095 Resources"
      summary: Define a bookable resource
      tags: [resources]
      x-ticvai-permission: RESOURCE_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Resource' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }

  /resources/{resourceId}/availability:
    parameters:
      - name: resourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getResourceAvailability
      x-ticvai-consumed-by:
        - "P08 BO-096 Resource Calendar"
      summary: When it is free, with conflicts already resolved
      description: >
        **Returns free windows, not a list of bookings for the caller to subtract.** A client
        computing availability from bookings will forget setup time, and a cabana booked 14:00–16:00
        with a 30-minute turnaround is not free at 16:00.

        Includes maintenance windows and blackouts. **A resource under repair is unavailable for a
        different reason from one that is booked**, and the response says which — an operator
        looking for something free needs to know whether to wait or to look elsewhere.
      tags: [resources]
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Free windows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceAvailability' }

  /resource-bookings:
    post:
      operationId: bookResource
      x-ticvai-consumed-by:
        - "P08 BO-096 Resource Calendar"
      summary: Reserve a specific resource for a window
      description: >
        **Refuses on conflict, including setup and teardown.** This is the operation the whole
        context exists for — **two bookings on one cabana is a guest arriving to find somebody in
        their chair**, and it must be impossible rather than unlikely.

        Where the caller does not care which one, `resourceId` may be omitted and a kind supplied:
        **the platform picks and tells you which.** A guest booking *a* cabana does not choose
        cabana seven, and a system that makes them choose has leaked its model.
      tags: [resources]
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                resourceId: { type: string, format: uuid, nullable: true }
                resourceKind: { type: string, nullable: true }
                from: { type: string, format: date-time }
                to: { type: string, format: date-time }
                subjectId: { type: string, format: uuid, nullable: true }
                orderId: { type: string, format: uuid, nullable: true }
                recurrence:
                  type: object
                  nullable: true
                  description: >
                    **A weekly swimming lesson is one booking, not twelve.** Conflict detection runs
                    across every occurrence before any of them is written — booking eight of twelve
                    failing after seven succeeded is worse than the whole thing refusing.
                  properties:
                    pattern: { type: string, enum: [daily, weekly, monthly] }
                    daysOfWeek: { type: array, items: { type: string } }
                    until: { type: string, format: date }
      responses:
        '201':
          description: Booked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceBooking' }
        '409':
          description: >
            **Conflicts, and the response names them with times.** *"Not available"* on a resource a
            guest can see in front of them is not an answer.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /resource-bookings/{bookingId}/check-out:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: checkOutResource
      x-ticvai-consumed-by:
        - "P08 BO-097 Check Out & Check In"
      summary: Hand it over, with a deposit against it
      description: >
        7.6. **A rental leaves with a guest, and the deposit is held against the object rather than
        the order** — which is why `orders` could not carry this: an order completes and a rental is
        still out.

        Holds through `authoriseStoredValue` (CF-126) rather than taking payment. **A deposit taken
        and refunded is two transactions and a fee; a deposit held and released is neither**, and a
        guest who returns a stroller intact should not wait three days for their money.

        Records condition at handover. **The condition note taken on the way out is the only defence
        against a dispute on the way back.**
      tags: [resources]
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId]
              properties:
                subjectId: { type: string, format: uuid }
                depositAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                depositInstrument: { $ref: '../shared/common.yaml#/components/schemas/StoredValueKind' }
                conditionNote: { type: string, nullable: true }
                conditionPhotoRefs: { type: array, items: { type: string } }
                dueBackAt: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Checked out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceBooking' }

  /resource-bookings/{bookingId}/check-in:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: checkInResource
      x-ticvai-consumed-by:
        - "P08 BO-097 Check Out & Check In"
      summary: Take it back, and settle the deposit
      description: >
        **Releases the hold, or captures part of it against damage.** Partial capture is the normal
        case for a damaged item and the reason two-phase spend was worth building.

        **Marks the resource unavailable where it comes back broken**, so the next booking cannot
        take it. A returned item that goes straight back into the pool with a cracked wheel is how
        the second guest gets hurt.
      tags: [resources]
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [condition]
              properties:
                condition: { type: string, enum: [good, minorDamage, majorDamage, notReturned] }
                captureAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                note: { type: string, nullable: true }
                blockFurtherBookings: { type: boolean, default: false }
      responses:
        '200':
          description: Returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceBooking' }

  /resources/{resourceId}/qualifications:
    parameters:
      - name: resourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setResourceQualifications
      x-ticvai-consumed-by:
        - "P08 BO-098 Qualifications"
      summary: What a person resource is certified to do, and until when
      description: >
        1.2.36. **`RotaAssignment` carried `requiredRoleId` alone, and a role is not a skill.**

        The requirement is that the qualification is checked **before** the assignment is made — and
        **a lifeguard certificate that lapsed last month is a safety failure, not a data quality
        one.**

        Expiry is the field that matters. A certification with no expiry is a certification nobody
        renews.
      tags: [resources]
      x-ticvai-permission: RESOURCE_MANAGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qualifications]
              properties:
                qualifications:
                  type: array
                  items: { $ref: '#/components/schemas/Qualification' }
      responses:
        '200':
          description: Set
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Qualification' }

  /sessions/{sessionId}/manifest:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSessionManifest
      x-ticvai-consumed-by:
        - "P08 BO-099 Session Manifest"
      summary: Who is in a session, in what order
      description: >
        1.3.44. **Distinct from duration, which variants already handle.**

        A session holding a mix of first-time and experienced participants needs a running order,
        **because the order is operational rather than administrative** — an instructor takes the
        beginners first, and a manifest sorted by booking time gives them a beginner between two
        advanced riders.
      tags: [resources]
      x-ticvai-permission: RESOURCE_VIEW
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Manifest
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionParticipant' }

    put:
      operationId: reorderSessionManifest
      x-ticvai-consumed-by:
        - "P08 BO-099 Session Manifest"
      summary: Change the running order
      tags: [resources]
      x-ticvai-permission: RESOURCE_BOOK
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: lastWriterWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Reordered
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionParticipant' }

components:
  schemas:
    Resource:
      type: object
      x-ticvai-persistence: "resources.resource"
      description: >
        **A specific object, not a quantity of interchangeable ones.** A venue with forty identical
        strollers has forty resources, because guest number twelve returned stroller number twelve.
      required: [id, code, name, kind, venueId]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [cabana, locker, wheelchair, stroller, equipment, room, auditorium, vehicle,
                 instructor, staff, table, pitch, studio, mealPlan, other]
          description: >
            BL-135. **`locker` was an entitlement kind in `orders` and nothing issued, assigned or
            released one.** A locker is a specific object checked out to a named guest and returned
            — which is this context exactly, and modelling it as an entitlement would have needed a
            second check-out mechanism.

            **`mealPlan` is the exception and is listed here to be refused**: 5.5.8b groups it with
            lockers and parking, and a meal plan is a balance rather than an object. It resolves to
            `retail.Wallet` with a `mealPlan` credit kind (CF-126), not to a resource.
        venueId: { type: string, format: uuid }
        scopePath: { type: string }
        parentResourceId:
          type: string
          format: uuid
          nullable: true
          description: >
            **A pool cabana belongs to the pool area; a seat belongs to an auditorium.** Booking a
            parent takes its children with it, which is the behaviour a venue expects and would
            otherwise have to enforce by hand.
        principalId:
          type: string
          format: uuid
          nullable: true
          description: >
            For a person resource. **`workforce` still owns their rota** — this says whether they
            are qualified and whether they are already committed.
        attributes:
          type: object
          additionalProperties: true
          description: Configurable per kind — capacity, size, shade, power, poolside.
        setupMinutes:
          type: integer
          default: 0
          description: >
            **Before the booking, not inside it.** An auditorium booked 14:00–16:00 is unavailable
            from 13:30 with a 30-minute setup, and a calendar that cannot express that double-books
            every time.
        teardownMinutes: { type: integer, default: 0 }
        requiresQualification:
          type: array
          items: { type: string }
          description: Qualification codes a person must hold to be assigned to this.
        depositAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        status: { type: string, enum: [available, booked, checkedOut, maintenance, retired] }
        isActive: { type: boolean, default: true }

    ResourceAvailability:
      type: object
      description: >
        **Free windows, with setup and teardown already subtracted.** A client computing this from
        bookings will forget the turnaround.
      properties:
        resourceId: { type: string, format: uuid }
        freeWindows:
          type: array
          items:
            type: object
            properties:
              from: { type: string, format: date-time }
              to: { type: string, format: date-time }
        blockedWindows:
          type: array
          description: >
            **With a reason, because they are not the same.** Booked and under repair need different
            responses from an operator looking for something free — wait, or look elsewhere.
          items:
            type: object
            properties:
              from: { type: string, format: date-time }
              to: { type: string, format: date-time }
              reason: { type: string, enum: [booked, setup, teardown, maintenance, blackout, closed] }

    ResourceBooking:
      type: object
      x-ticvai-persistence: "resources.booking"
      required: [id, resourceId, from, to, status]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid, nullable: true }
        orderId: { type: string, format: uuid, nullable: true }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        status: { type: string, enum: [reserved, checkedOut, returned, overdue, cancelled, noShow] }
        recurrenceGroupId:
          type: string
          format: uuid
          nullable: true
          description: >
            Ties the occurrences of a recurring booking. **Cancelling one week does not cancel the
            series**, and cancelling the series is a separate act with a separate confirmation.
        depositAuthorisationId:
          type: string
          format: uuid
          nullable: true
          description: >
            The hold, through `orders.authoriseStoredValue` (CF-126). **A deposit taken and refunded
            is two transactions and a fee; held and released is neither.**
        checkedOutAt: { type: string, format: date-time, nullable: true }
        dueBackAt: { type: string, format: date-time, nullable: true }
        returnedAt: { type: string, format: date-time, nullable: true }
        conditionOut: { type: string, nullable: true }
        conditionIn: { type: string, nullable: true }

    Qualification:
      type: object
      x-ticvai-persistence: "resources.qualification"
      description: >
        1.2.36. **A role is not a skill**, and the check happens before assignment rather than after.
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        issuedAt: { type: string, format: date, nullable: true }
        expiresAt:
          type: string
          format: date
          nullable: true
          description: >
            **The field that makes this worth having.** A certification with no expiry is one nobody
            renews, and a lifeguard certificate that lapsed last month is a safety failure rather
            than a data-quality one.
        issuer: { type: string, nullable: true }
        documentAssetId: { type: string, format: uuid, nullable: true }

    SessionParticipant:
      type: object
      x-ticvai-persistence: "resources.session_participant"
      description: >
        1.3.44. **The running order is operational.** An instructor takes beginners first, and a
        manifest sorted by booking time puts one between two advanced riders.
      required: [id, sessionId, subjectId, position]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        position: { type: integer }
        experienceLevel: { type: string, enum: [firstTime, beginner, intermediate, advanced], nullable: true }
        packageName: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        hasSignedWaiver:
          type: boolean
          readOnly: true
          description: >
            2.15.9. **Shown on the manifest because that is where it is acted on** — an instructor
            about to start does not want to discover an unsigned waiver at the water's edge.
