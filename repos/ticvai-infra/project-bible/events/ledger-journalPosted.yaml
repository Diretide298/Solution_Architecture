# ledger.journalPosted v1 — published by ledger
# Checked by tools/check-states.py against states/ and the contracts.

name: ledger.journalPosted
version: 1
publisher: ledger
description: A journal entry has been posted and is now immutable.
aggregate: journalEntry
emittedWhen: JournalStatus draft or pendingApproval to posted
payload:
- field: journalEntryId
  type: string
- field: legalEntityId
  type: uuid
- field: fiscalPeriodId
  type: uuid
- field: source
  type: string
  notes: sale, refund, shift, settlement, revaluation, manual
- field: sourceId
  type: string
- field: lineCount
  type: integer
- field: totalDebit
  type: Money
- field: totalCredit
  type: Money
  notes: Equal to totalDebit. A posted entry that does not balance was never posted
- field: postedAt
  type: timestamp
consumers:
- context: reporting
  purpose: Update the financial read model
  idempotencyKey: journalEntryId
  onFailure: retryThenDeadLetter
  isCritical: true
retention: 30 days after publication
notes: One consumer, and it is critical. Reporting reads the analytical replica (ADR-0016), so a journal
  that never reaches it produces a trial balance that disagrees with the ledger — and the ledger is
  right.
