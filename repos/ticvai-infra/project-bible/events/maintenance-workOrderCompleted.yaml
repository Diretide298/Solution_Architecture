# maintenance.workOrderCompleted v1 — published by maintenance
# Checked by tools/check-states.py against states/ and the contracts.

name: maintenance.workOrderCompleted
version: 1
publisher: maintenance
description: Work on an asset is finished and awaiting verification.
aggregate: workOrder
emittedWhen: WorkOrderStatus inProgress to completed
payload:
- field: workOrderId
  type: uuid
- field: assetId
  type: uuid
- field: venueId
  type: uuid
- field: completedByPrincipalId
  type: uuid
- field: findings
  type: string
- field: partsUsed
  type: array
- field: timeMinutes
  type: integer
- field: completedAt
  type: timestamp
consumers:
- context: inventory
  purpose: Consume the parts recorded against the job
  idempotencyKey: workOrderId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: reporting
  purpose: Downtime and mean time to repair
  idempotencyKey: workOrderId
  onFailure: retry
  isCritical: false
retention: 30 days after publication
notes: Completion is not return to service. The asset stays out until maintenance.assetReturnedToService.
