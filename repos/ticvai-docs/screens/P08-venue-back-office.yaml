  name: Parking Configuration
  module: Parking
  purpose: TODO — pending the 14 August MoM.
  capability: C39
  wave: 2
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
        notes: TODO
  states:
    loading: TODO
    empty: TODO
    error: TODO
  wireframe:
