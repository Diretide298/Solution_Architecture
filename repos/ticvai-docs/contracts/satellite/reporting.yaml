  # ---------------------------------------------------------------- natural language
  /reports/ask:
    post:
      operationId: askReportingQuestion
      x-ticvai-consumed-by:
        - "P04 POS-008 Reports"
        - "P08 BO-029 Report Builder"
        - "P08 BO-058 Reporting Home"
        - "P08 BO-059 Sales Reports"
        - "P08 BO-060 Attendance & Footfall"
        - "P08 BO-061 Scheduled Reports"
        - "P10 PTR-018 Reports & Sales Performance"
        - "P12 SUP-008 Agent Performance & SLA View"
      x-ticvai-audience: [staff, partner]
      x-ticvai-ai-capability: naturalLanguageQuery
      summary: Natural-language reporting query
      description: >
        **This is an AI capability and is governed as one.** It resolves its provider through
        `ai.provider`, respects `ai.policy` including the masking list, and writes an
        `ai.interaction` with its prompt, response, model, tokens and cost — the same audit
        trail as the assistant (8.3.55–8.3.57).

        Distinct from `sendAiMessage`, which retrieves from documents. **This generates a
        query against the analytical replica and returns it**, so a finance user can check
        the number rather than trust it.

        AI-57, Phase 1. Queries data that already exists, so it works from day one — unlike
        forecasting, which needs history.

        **Returns the generated query alongside the answer.** An answer nobody can check is
        worse than no answer, and a finance user asked to trust an unexplained number will
        rightly refuse.

        Runs under the caller's resolved permissions. The generated query cannot widen scope,
        because scope is applied after generation, not by it.
      tags: [naturalLanguage]
      x-ticvai-permission: REPORT_VIEW_VENUE
