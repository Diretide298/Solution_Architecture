      responses:
        '201':
          description: Saved as a definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDefinition' }

components:
  schemas:
    ReportCategory:
      type: string
      enum: [sales, admission, financial, inventory, guest, operations, marketing, workforce, compliance, custom]

    SeededReport:
      type: object
      description: >
        BL-053. **`ReportDefinition.isSystem` existed and nothing populated it.** Twenty-eight
        requirements asked for dashboards and analyses over data that was already there, and the
        answer to every one of them was *"the builder can do that"* — which is true and is not a
        deliverable.

        **A venue opening on Monday does not want a report builder. It wants the eight reports every
        venue runs**, and the ability to change them.

        Seeded at provisioning, `isSystem` true, **editable and forkable rather than locked**: a
        venue that cannot change a system report will rebuild it from scratch and maintain two.
      required: [code, name, category, dataSource]
      properties:
        code: { type: string }
        name: { type: string }
        category: { $ref: '#/components/schemas/ReportCategory' }
        dataSource: { $ref: '#/components/schemas/DataSource' }
        appliesToVenueKinds:
          type: array
          description: >
            **A water park does not need a theatre's seat-utilisation report.** Empty means every
            venue kind.
          items: { type: string }
        defaultSchedule: { $ref: '#/components/schemas/Cadence' }
        rationale:
          type: string
          description: >
            **Why this report ships, in words a venue manager reads.** A seeded report with no
            rationale is one somebody deletes as clutter in the first week.


    AlertRule:
      type: object
      x-ticvai-persistence: "reporting.alert_rule"
      description: >
        BL-152, CF-134. **Six contracts detect their own trouble and none told a person.**

        Five sections ask for this and it is the same gap as `MessageTrigger`, seen from the
        operational side — **that one tells a guest something happened; this one tells an operator
        something is wrong.**

        **A threshold that nobody is watching is a threshold nobody set.** 6.1.57 wants an exception
        when a KPI leaves range, and an exception that arrives in a nightly report is an exception
        nobody acted on.
      required: [id, name, metric, comparator, threshold, severity, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        metric:
          allOf:
            - $ref: '#/components/schemas/MetricSource'
          description: >
            **From the closed set**, so a rule cannot watch something nothing produces — the same
            discipline `MetricSource` exists for.
        comparator: { type: string, enum: [above, below, outsideRange, changesBy, equals] }
        threshold: { type: number }
        thresholdUpper: { type: number, nullable: true }
        windowMinutes:
          type: integer
          default: 15
          description: >
            **The window is what stops an alert firing on noise.** A queue that spikes for ninety
            seconds is not a queue that needs a manager, and a rule with no window is a rule
            somebody mutes within a week.
        severity: { type: string, enum: [info, warning, critical] }
        deliverTo:
          type: array
          description: >
            CF-134. **The dashboard panel is the default and the only one that always applies.**
            Email or WhatsApp where the matrix names them — an operational alert arriving by email
            is an alert nobody sees in time.
          items: { type: string, enum: [dashboardPanel, email, whatsapp, sms] }
        recipientRoleIds:
          type: array
          items: { type: string, format: uuid }
        cooldownMinutes:
          type: integer
          default: 30
          description: >
            **How long before the same rule may fire again.** Without it, a metric hovering on a
            threshold produces forty alerts an hour and the panel becomes something people close.
        isActive: { type: boolean }

    Alert:
      type: object
      x-ticvai-persistence: "reporting.alert"
      description: >
        A raised alert. **Acknowledged rather than dismissed** — CF-134 asked for it markable, and
        the difference is that an acknowledgement records who saw it.
      required: [id, ruleId, raisedAt, severity, status]
      properties:
        id: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        raisedAt: { type: string, format: date-time }
        severity: { type: string, enum: [info, warning, critical] }
        status: { type: string, enum: [raised, acknowledged, resolved, expired] }
        observedValue: { type: number }
        threshold: { type: number }
        scopePath: { type: string }
        acknowledgedByPrincipalId: { type: string, format: uuid, nullable: true }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            **Set when the metric returns to range, automatically.** An alert that only a person can
            close is an alert list that only grows.
        escalatedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Where `VenueSettings.alerting.escalateAfterMinutes` passed with no acknowledgement.
            **A critical alert nobody acknowledged is the case escalation exists for.**


    MetricSource:
      type: string
      description: >
        **A named metric with a verified source.** BL-053, 75 requirement rows.

        `reporting` is a generic builder, and **a generic builder makes every reporting requirement
        look covered** — it will happily assemble a report over data nobody produces. That is the
        shape to watch across the whole walk, and this enum is the answer to it: each value below
        was checked against the schema before being named.

        | Metric | Source |
        |---|---|
        | `occupancy` | `catalogue.envelope.sold` and `leased` against `capacity` |
        | `capacityUtilisation` | `catalogue.envelope.remaining` over the same window |
        | `admissionRate` | `access.scan_event.outcome`, in-direction |
        | `noShowRate` | Entitlements issued against scans that never arrived |
        | `conversion` | `orders.cart` against `orders.sales_order` |
        | `salesByOperator` | `orders.sales_order.principal_id` |
        | `salesByWorkstation` | The workstation on the shift that took it |
        | `waitTime` | `queue.entry.estimated_call_at` against `called_at` |
        | `throughput` | `queue.entry` completions per hour |
        | `abandonmentRate` | Queue entries that left before being called |

        **`salesByInstructor` is deliberately absent.** It needs the staff-assignment link that
        CL-01 covers, and naming a metric with no source is the defect this enum exists to prevent.
      enum: [occupancy, capacityUtilisation, admissionRate, noShowRate, conversion,
             salesByOperator, salesByWorkstation, waitTime, throughput, abandonmentRate,
             inventoryValuation, stockTurnover, stockAgeing, wastageRate,
             resaleVolume, resaleCommission,
             salesByInstructor, resourceUtilisation,
             allocationUtilisation, channelAllocationBurn,
             membershipChurn, membershipRenewalRate,
             supplierDeliveryPerformance,
             revenuePerEntitlement, revenuePerVisitor,
             assetDowntime, meanTimeToRepair,
             challengeCompletionRate, attributedRevenue]
      x-ticvai-extended: "18 August 2026"
      x-ticvai-extension-note: >
        **Nineteen metrics added when their upstream models landed**, which is how BL-053 was always
        going to close — not by changing `reporting` but by building the things it wanted to report
        on.

        `inventoryValuation`, `stockTurnover`, `stockAgeing` and `wastageRate` came from
        `inventory.StockBatch`; `resaleVolume` and `resaleCommission` from `orders.ResaleListing`;
        **`salesByInstructor` from `resources.Resource`, which was the one metric this enum
        deliberately refused to name in the morning** because nothing produced it.
        `allocationUtilisation` from `PartnerUser` and `ChannelListing`, `membershipChurn` from
        `Journey`, `supplierDeliveryPerformance` from `ProductionRun`, `assetDowntime` and
        `meanTimeToRepair` from `WorkOrder.downtimeMinutes`, `challengeCompletionRate` from
        `ChallengeProgress`, `attributedRevenue` from `AttributionTouch`.

        **Each was checked against the schema before being named.** That rule has not changed —
        naming a metric with no source is the defect this enum exists to prevent.


    DataSource:
      type: string
      description: >
        What a report may be built over. **A closed set, and that is the point** — a builder that
        accepts any table will happily produce a report over data nobody maintains.

        **Eight sources added 18 August** (BL-143), each because the matrix asks for a report the
        builder could not source. `stockCounts` and `waste`: 6.1.21 wants count variance and
        `stockMovements` records the movement rather than **the count that found the discrepancy**.
        `workstations`, `devices` and `principals`: 6.1.28 — **who did what at which till** is the
        question an auditor asks first and it had no source. `loyalty`: 6.1.37, points earned,
        burned and expiring. `reviews`: 6.1.46. `queueEntries`: **wait times are already measured
        and nothing could report on them.**

        **Adding a source is a decision, not an omission.** `principals`, `guests`, `loyalty` and
        `reviews` all name a person, and `REPORT_EXPORT_PII` gates them.
      enum:
        - orders
        - orderLines
        - payments
        - refunds
        - shifts
        - scanEvents
        - entitlements
        - products
        - inventory
        - stockMovements
        - stockCounts
        - waste
        - workstations
        - devices
        - principals
        - loyalty
        - reviews
        - queueEntries
        - guests
        - campaigns
        - cases
        - ledgerEntries
        - workOrders
        # Eleven added 18 August on the BL-053 re-walk, each because a requirement names a report
        # over it and the source has landed since this enum was last written.
        - approvals          # 11.1 x10 — throughput, ageing, bottleneck by approver
        - purchaseOrders     # 15.3 — spend by supplier, by category, by period
        - receipts           # 15.3.3, 15.3.17 — OTIF, short deliveries, rejection reasons
        - requisitions       # 15.4.4-6 — suggested against actual, and who overrode
        - stockBatches       # 15.4.8-9 — slow-moving, dead stock, expiring
        - resourceBookings   # utilisation of cabanas, instructors, equipment
        - delegations        # 5.5.17b portfolio aggregation — needed CF-132 first
        - forms              # waiver completion, survey scores
        - challenges         # 22.6 completion and reward cost
        - wallets            # 22.14.8 balance as a segment attribute
        - resaleListings     # volume, commission, price against face

    FieldType:
      type: string
      enum: [string, integer, decimal, money, boolean, date, dateTime, uuid, enum]

    ReportField:
      x-ticvai-persistence: "none — metadata catalogue, generated"
      type: object
      required: [key, label, type, isGroupable, isAggregatable, isFilterable]
      properties:
        key: { type: string }
        label: { type: string }
        type: { $ref: '#/components/schemas/FieldType' }
        isGroupable: { type: boolean }
        isAggregatable: { type: boolean }
        isFilterable: { type: boolean }
        isPersonalData:
          type: boolean
          description: Requires REPORT_EXPORT_PII to include in an export.
        requiredPermission: { type: string, nullable: true }
        enumValues:
          type: array
          items: { type: string }

    Aggregation:
      type: string
      enum: [none, count, countDistinct, sum, average, min, max]

    ReportColumn:
      x-ticvai-persistence: "reporting.report_column"
      type: object
      required: [field]
      properties:
        field: { type: string }
        label: { type: string }
        aggregation:
          allOf:
            - $ref: '#/components/schemas/Aggregation'
          default: none
        sortOrder: { type: integer }
        sortDirection:
          type: string
          enum: [asc, desc]
        format: { type: string, nullable: true }

    ReportFilter:
      x-ticvai-persistence: "reporting.report_filter"
      type: object
      required: [field, operator]
      properties:
        field: { type: string }
        operator:
          type: string
          enum: [equals, notEquals, greaterThan, lessThan, between, in, notIn, contains, isNull, isNotNull]
        value: {}
        values:
          type: array
          items: {}
        isParameter:
          type: boolean
          default: false
          description: >
            Prompted at run time rather than fixed. Parameters narrow the result; they never
            widen scope.

    ReportParameter:
      x-ticvai-persistence: "reporting.report_parameter"
      type: object
      required: [key, label, type, isRequired]
      properties:
        key: { type: string }
        label: { type: string }
        type: { $ref: '#/components/schemas/FieldType' }
        isRequired: { type: boolean }
        defaultValue: {}

    CreateReportRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [name, category, dataSource, columns, requiredPermission]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        category: { $ref: '#/components/schemas/ReportCategory' }
        dataSource: { $ref: '#/components/schemas/DataSource' }
        columns:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ReportColumn' }
        filters:
          type: array
          items: { $ref: '#/components/schemas/ReportFilter' }
        groupBy:
          type: array
          items: { type: string }
        parameters:
          type: array
          items: { $ref: '#/components/schemas/ReportParameter' }
        requiredPermission:
          type: string
          description: >
            Permission needed to run this report. **The author cannot assign one they do not
            hold** — otherwise a venue user could build themselves a tenant-wide view.
        maxDateRangeDays:
          type: integer
          nullable: true
          description: Guards against a query spanning years of scan events.

    ReportDefinition:
      x-ticvai-persistence: "reporting.report_definition + reporting.report_column + reporting.report_filter"
      allOf:
        - $ref: '#/components/schemas/CreateReportRequest'
        - type: object
          required: [id, version, isSystem, isRetired, createdAt]
          properties:
            id: { type: string, format: uuid }
            version: { type: string }
            isSystem:
              type: boolean
              description: Shipped with the platform. Cannot be amended, only cloned.
            isRetired: { type: boolean }
            estimatedCost:
              type: string
              enum: [low, medium, high]
              description: Informs whether it may run inline or must be queued.
            createdByPrincipalId: { type: string, format: uuid, nullable: true }
            createdAt: { type: string, format: date-time }
            lastRunAt: { type: string, format: date-time, nullable: true }

    RunReportRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      properties:
        parameters:
          type: object
          additionalProperties: true
        venueId:
          type: string
          format: uuid
          description: >
            Narrows to one venue. Omitting it returns everything the caller's scope permits —
            it cannot be used to reach beyond that.
        dateFrom: { type: string, format: date }
        dateTo: { type: string, format: date }
        forceAsync:
          type: boolean
          default: false
          description: Queue regardless of size, for a result to be collected later.

    ExecutionStatus:
      type: string
      enum: [queued, running, completed, failed, cancelled, expired]

    ReportExecution:
      x-ticvai-persistence: "reporting.execution"
      type: object
      required: [id, reportId, definitionVersion, status, requestedByPrincipalId, requestedAt]
      properties:
        id: { type: string }
        reportId: { type: string, format: uuid }
        reportName: { type: string }
        definitionVersion:
          type: string
          description: >
            The version this ran against. With the parameters and scope below, it is
            everything needed to reproduce the result.
        status: { $ref: '#/components/schemas/ExecutionStatus' }
        parameters:
          type: object
          additionalProperties: true
        scopeApplied:
          type: array
          description: Scope paths the caller held. What constrained the result.
          items: { type: string }
        rowCount: { type: integer, nullable: true }
        durationMs: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        requestedByPrincipalId: { type: string, format: uuid }
        scheduleId: { type: string, format: uuid, nullable: true }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: Results are retained for a limited period, then discarded.

    ReportResult:
      x-ticvai-persistence: "none — result set, cached in object storage"
      type: object
      required: [executionId, columns, rows]
      properties:
        executionId: { type: string }
        columns:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              type: { $ref: '#/components/schemas/FieldType' }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        totals:
          type: object
          additionalProperties: true
        rowCount: { type: integer }
        nextCursor: { type: string, nullable: true }
        generatedAt: { type: string, format: date-time }
        dataAsOf:
          type: string
          format: date-time
          description: >
            Replica position the result was read at. Reporting reads a lag-tolerant replica,
            so this may trail the primary by seconds — stating it prevents an argument about
            a figure that moved.

    Cadence:
      x-ticvai-persistence: "none — embedded in schedule"
      type: object
      required: [frequency]
      properties:
        frequency:
          type: string
          enum: [daily, weekly, monthly, quarterly, onShiftClose, onPeriodClose]
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        dayOfMonth: { type: integer, minimum: 1, maximum: 31 }
        timeOfDay: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        timeZone: { type: string }

    Recipient:
      x-ticvai-persistence: "reporting.schedule_recipient"
      type: object
      required: [kind, address]
      properties:
        kind:
          type: string
          enum: [principal, email, sftp, webhook]
        address: { type: string }
        principalId: { type: string, format: uuid }

    ExportFormat:
      type: string
      enum: [csv, xlsx, pdf, json]

    CreateReportScheduleRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [reportId, cadence, recipients, format]
      properties:
        reportId: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        cadence: { $ref: '#/components/schemas/Cadence' }
        parameters:
          type: object
          additionalProperties: true
        recipients:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Recipient' }
        format: { $ref: '#/components/schemas/ExportFormat' }
        includePersonalData: { type: boolean, default: false }
        skipIfEmpty:
          type: boolean
          default: true
          description: An empty report every morning trains people to ignore the report.

    ReportSchedule:
      x-ticvai-persistence: "reporting.schedule"
      allOf:
        - $ref: '#/components/schemas/CreateReportScheduleRequest'
        - type: object
          required: [id, ownerPrincipalId, isPaused, createdAt]
          properties:
            id: { type: string, format: uuid }
            ownerPrincipalId:
              type: string
              format: uuid
              description: >
                The schedule runs under this principal's permissions, not the recipients'.
                A standing grant of whatever the owner can see.
            isPaused: { type: boolean }
            lastRunAt: { type: string, format: date-time, nullable: true }
            lastRunStatus: { $ref: '#/components/schemas/ExecutionStatus' }
            nextRunAt: { type: string, format: date-time, nullable: true }
            consecutiveFailures: { type: integer }
            createdAt: { type: string, format: date-time }

    ReportExport:
      x-ticvai-persistence: "reporting.export"
      type: object
      required: [id, executionId, format, status, requestedByPrincipalId, requestedAt]
      properties:
        id: { type: string }
        executionId: { type: string }
        format: { $ref: '#/components/schemas/ExportFormat' }
        status:
          type: string
          enum: [queued, generating, ready, failed, expired]
        includesPersonalData: { type: boolean }
        purpose: { type: string, nullable: true }
        downloadUrl:
          type: string
          nullable: true
          description: Signed and expiring. Present only while status is `ready`.
        sizeBytes: { type: integer, nullable: true }
        requestedByPrincipalId: { type: string, format: uuid }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }

    DashboardTile:
      x-ticvai-persistence: "reporting.dashboard_tile"
      type: object
      required: [id, reportId, visualisation, position]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        reportId: { type: string, format: uuid }
        visualisation:
          type: string
          enum: [number, line, bar, stackedBar, pie, table, gauge, heatmap]
        parameters:
          type: object
          additionalProperties: true
        refreshSeconds:
          type: integer
          minimum: 30
          description: >
            Minimum thirty seconds. A tile refreshing every second is a load problem wearing
            a convenience costume.
        position:
          type: object
          required: [row, column, width, height]
          properties:
            row: { type: integer }
            column: { type: integer }
            width: { type: integer }
            height: { type: integer }

    CreateDashboardRequest:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [name, tiles]
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 1000 }
        venueId: { type: string, format: uuid }
        isShared: { type: boolean, default: false }
        tiles:
          type: array
          minItems: 1
          maxItems: 24
          items: { $ref: '#/components/schemas/DashboardTile' }

    Dashboard:
      x-ticvai-persistence: "reporting.dashboard + reporting.dashboard_tile"
      allOf:
        - $ref: '#/components/schemas/CreateDashboardRequest'
        - type: object
          required: [id, ownerPrincipalId, aggregateCost, createdAt]
          properties:
            id: { type: string, format: uuid }
            ownerPrincipalId: { type: string, format: uuid }
            aggregateCost:
              type: string
              enum: [low, medium, high]
              description: Combined refresh load of every tile.
            createdAt: { type: string, format: date-time }

    DashboardData:
      x-ticvai-persistence: "none — computed"
      allOf:
        - $ref: '#/components/schemas/Dashboard'
        - type: object
          properties:
            tileData:
              type: array
              items:
                type: object
                properties:
                  tileId: { type: string, format: uuid }
                  result: { $ref: '#/components/schemas/ReportResult' }
                  isCached: { type: boolean }
                  error: { type: string, nullable: true }

    NaturalLanguageAnswer:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [conversationId, question, interpretation, result, confidence]
      properties:
        conversationId: { type: string }
        question: { type: string }
        interpretation:
          type: string
          description: What the question was understood to mean, in plain language.
        generatedQuery:
          type: object
          description: >
            The structured query produced — data source, columns, filters, grouping. Returned
            so the answer can be checked. An answer nobody can verify is worse than no answer.
          properties:
            dataSource: { $ref: '#/components/schemas/DataSource' }
            columns:
              type: array
              items: { $ref: '#/components/schemas/ReportColumn' }
            filters:
              type: array
              items: { $ref: '#/components/schemas/ReportFilter' }
            groupBy:
              type: array
              items: { type: string }
        result: { $ref: '#/components/schemas/ReportResult' }
        confidence:
          type: number
          minimum: 0
          maximum: 1
        suggestedFollowUps:
          type: array
          items: { type: string }
        modelVersion: { type: string }
        tokensUsed: { type: integer }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
