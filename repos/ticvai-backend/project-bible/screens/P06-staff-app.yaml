- id: EMP-010
  name: Scan — ready
  module: Operations
  purpose: The raised centre action, and the thing this app is for.
  capability: C00
  wave: 1
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
        notes: Structure from the wireframe board. Components not yet enumerated.
  states:
    loading: Instant. This screen must never wait
    emptyFirstRun: —
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Camera failed — distinct from a bad scan and needing a different response
    offline: '**Keep working when the network does not.** The screen already had an `offline` state.'
    outcomeAdmitted: '**Confirm entry, then get out of the way.** Was a screen until 18 August; the
      name said it — `Scan — admitted` is a state of `Scan` with a dash in it.'
    outcomeDenied: '**Give the reason and the next action.**'
    overrideDialog: '**Admit against a failed validation, on the record.** A confirm dialog on `outcomeDenied`
      — an override is a decision taken while looking at the denial.'
  navigation:
    exitTo:
    - EMP-001
    - EMP-002
    - EMP-003
    inferred: true
  wireframe:
    status: drafted
    owner: wireframe board
    board: wireframes/P06 Staff App.dc.html#emp-010
    designReference: sources/designs/TICVAI_Employee_App_UI_Reference_1.pdf
    stateBoards:
    - state: outcomeAdmitted
      board: wireframes/P06 Staff App.dc.html#emp-011
    - state: outcomeDenied
      board: wireframes/P06 Staff App.dc.html#emp-012
    - state: overrideDialog
      board: wireframes/P06 Staff App.dc.html#emp-013
    - state: offline
      board: wireframes/P06 Staff App.dc.html#emp-016
    note: '**The absorbed outcomes are still drawn** and the drawings are still right — an admitted
      flash and a denial with a reason are different visuals. **What changed is that they are states
      of one screen rather than five routes**, so each board anchor is listed against the state it draws
      rather than deleted.'
  notes: Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. **Absorbed EMP-011, EMP-012, EMP-013, EMP-016 on 18 August.** A scanner is
    one screen the device sits on all day, and an outcome is a state of it — **routing to `/access/admitted`
    for something gone in 1.5 seconds is a page load per guest**, and at a gate doing 40 a minute that
    is the whole problem. Every absorbed screen kept its copy as a named state.
  implementation:
    app: venue-staff-app
    route: /operations/scan-ready
    component: apps/venue-staff-app/src/routes/operations/ScanReadyDetail.tsx
    status: notStarted
  apis:
  - operationId: listScans
    contract: access
    purpose: List scan events
    trigger: onLoad
  - operationId: syncScans
    contract: access
    purpose: Replay scans recorded offline
    trigger: onAction
  - operationId: getOfflinePackage
    contract: access
    purpose: Entitlement and rule set for offline validation
    trigger: onLoad
  - operationId: lookupTicket
