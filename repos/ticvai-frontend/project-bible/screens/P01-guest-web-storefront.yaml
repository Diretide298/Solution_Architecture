# P01 — Guest Web Storefront (B2C)
#
# WEB-001 to WEB-013 are the purchase path and are fully specified.
# The remainder carry structure and open questions; layout is still to be drawn.
#
# Validated against _schema.yaml; component kinds from _components.yaml.

platform:
  code: P01
  name: Guest Web Storefront
  surface: guestFacing
  runtime: reactWeb
  offlineCapable: false
  themes:
  - light
  directions:
  - ltr
  - rtl
  screenCount: 29
  app: web-b2c
  appStatus: scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
screens:
- id: WEB-001
  name: Home / Landing
  module: Discovery & Browse
  purpose: Show a guest what is on and give them one obvious way to start booking.
  wave: 1
  layout:
    template: dashboard
    regions:
    - name: header
      ref: appHeader
      components:
      - kind: iconButton
        label: Search
      - kind: secondaryButton
        label: Sign in
        notes: Becomes an account menu once authenticated
    - name: contentBody
      components:
      - kind: banner
        bindsTo: TenantAppStatus.maintenanceMessage
        notes: Only when isInMaintenance. Tenant-branded, never a generic error page
      - kind: cardList
        bindsTo: HomepageLayout.sections
        notes: Section order comes from tenant configuration (WLB-011), not from code. A section referencing
          a disabled module must not render at all
  states:
    loading: Section skeletons in configured order. Header renders immediately from cache.
    empty: No sections configured. Shows the tenant contact block rather than a blank page — a storefront
      with nothing on it should still tell a guest how to reach the venue.
    error: Config fetch failed. Falls back to the last cached configuration with a dismissible warning.
      A storefront that will not load because branding is unavailable is worse than an unbranded one.
  wireframe:
    status: notStarted
  capability: C79
  apis:
  - operationId: getTenantConfig
    purpose: Branding, navigation and homepage section order
    trigger: onLoad
    contract: white-label
  - operationId: getTenantAppStatus
    purpose: Maintenance check before rendering anything
    trigger: onLoad
    contract: white-label
  - operationId: listProducts
    purpose: Featured products per homepage section
    trigger: onLoad
    contract: catalogue
  navigation:
    isEntryPoint: true
    exitTo:
    - WEB-002
    - WEB-003
    - WEB-004
    - WEB-016
  accessibility:
    focusOrder: Skip link, then first section heading. Not the carousel.
  implementation:
    app: web-b2c
    route: /discovery-and-browse/home-landing
    component: apps/web-b2c/src/routes/discovery-and-browse/HomeLandingDashboard.tsx
    status: notStarted
- id: WEB-002
  name: Event & Attraction Listing
  module: Discovery & Browse
  purpose: Browse and filter everything bookable.
  wave: 1
  layout:
    template: list
    regions:
    - name: contentBody
      components:
      - kind: searchField
        label: Search events and attractions
      - kind: multiSelect
        label: Category
      - kind: datePicker
        label: Date
        notes: Format from region settings, not a locale guess
      - kind: cardList
        bindsTo: Product[]
        notes: Cursor pagination. Infinite scroll with an explicit load-more fallback
  states:
    loading: Card skeletons at the current page size.
    empty: No products match. Names the most restrictive filter and offers to clear it — an empty state
      with no action is a dead end.
    error: Retry with filters preserved. Filters are never silently reset.
  wireframe:
    status: notStarted
  capability: C79
  apis:
  - operationId: listProducts
    purpose: Paged, filtered product list
    trigger: onLoad
    contract: catalogue
  - operationId: listEvents
    purpose: Date and category filter options
    trigger: onLoad
    contract: catalogue
  navigation:
    entryFrom:
    - WEB-001
    - WEB-003
    exitTo:
    - WEB-004
  implementation:
    app: web-b2c
    route: /discovery-and-browse/event-and-attraction-listing
    component: apps/web-b2c/src/routes/discovery-and-browse/EventAndAttractionListingList.tsx
    status: notStarted
- id: WEB-003
  name: Search Results
