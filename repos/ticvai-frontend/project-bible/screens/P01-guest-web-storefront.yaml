- id: WEB-010
  name: Shopping Cart
  module: Cart & Checkout
  purpose: Review and confirm what is being bought.
  wave: 1
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: cartPanel
        bindsTo: PromotionEvaluation
      - kind: textField
        label: Promo code
      - kind: banner
        bindsTo: PromotionEvaluation.rejected
        notes: When a code does not apply, say which condition failed. "Expired" and "already used"
          are very different conversations
    - name: actionBar
      components:
      - kind: primaryButton
        label: Checkout
  states:
    loading: Totals skeleton. Line items render immediately from local state.
    empty: Empty cart with a route back to browsing.
    error: Pricing failed. Checkout blocked rather than proceeding on a stale total.
  wireframe:
    status: notStarted
  capability: C02
  apis:
  - operationId: evaluatePromotions
    purpose: Final pricing with any coupon applied
    trigger: onLoad
    contract: promotions
  - operationId: getCouponCode
    purpose: Validate a coupon before applying
    trigger: onAction
    contract: promotions
  navigation:
    entryFrom:
    - WEB-005
    - WEB-006
    - WEB-007
    - WEB-008
    exitTo:
    - WEB-011
  implementation:
    app: web-b2c
    route: /cart-and-checkout/shopping-cart
    component: apps/web-b2c/src/routes/cart-and-checkout/ShoppingCartDetail.tsx
    status: notStarted
- id: WEB-011
  name: Guest Details & Attendee Forms
  module: Cart & Checkout
  purpose: Collect who is coming and how to reach them.
  wave: 1
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: textField
        label: Full name
      - kind: textField
        label: Email
      - kind: textField
        label: Mobile
      - kind: detailPanel
        bindsTo: EntitlementTemplate.isNameBound
        notes: Per-attendee fields appear only where the entitlement is name-bound. Most are not — identity
          and entitlement are separate concerns
      - kind: consentBlock
        bindsTo: ConsentPurposeConfig[]
        notes: Marketing consent is opt-in and unticked. Transactional is required for service and is
          presented differently, not as a choice dressed as one
    - name: actionBar
      components:
      - kind: primaryButton
        label: Continue to payment
  states:
    loading: Form renders immediately; prefill populates when it arrives.
    empty: Not applicable.
    error: Prefill failed. The form still works, entered manually.
  wireframe:
    status: notStarted
  capability: C03
  apis:
  - operationId: getGuestProfile
    purpose: Prefill for a signed-in guest
    trigger: onLoad
    contract: marketing-crm
  - operationId: listConsentPurposes
    purpose: Which consents to present, with current notice versions
    trigger: onLoad
    contract: marketing-crm
  navigation:
    entryFrom:
    - WEB-010
    exitTo:
    - WEB-012
  accessibility:
    focusOrder: First empty field, not the top of the form.
    announcements: Validation errors announced on blur, not on every keystroke.
  implementation:
    app: web-b2c
    route: /cart-and-checkout/guest-details-and-attendee-forms
    component: apps/web-b2c/src/routes/cart-and-checkout/GuestDetailsAndAttendeeFormsForm.tsx
    status: notStarted
- id: WEB-012
  name: Checkout — Payment
  module: Cart & Checkout
  purpose: Take payment and create the order.
  wave: 1
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: paymentTerminal
        bindsTo: Payment
      - kind: cartPanel
        notes: Order summary stays visible throughout. Never collapsed behind a link
    - name: actionBar
      components:
      - kind: primaryButton
        label: Pay now
  states:
    loading: Button enters loading and is disabled. Double submission is impossible.
    empty: Not applicable.
    error: Declined, with the reason where it is safe to show, and a retry that reuses the same idempotency
      key.
  wireframe:
    status: notStarted
  capability: C04
  apis:
  - operationId: createOrder
    purpose: Create the order before payment
    trigger: onAction
    contract: orders
  - operationId: createPayment
    purpose: Capture payment
    trigger: onAction
    contract: orders
  - operationId: inquirePaymentStatus
    purpose: Resolve an unknown terminal outcome
    trigger: onAction
    contract: orders
  navigation:
    entryFrom:
    - WEB-011
    exitTo:
    - WEB-013
  notes: The unknown outcome is the one to build for. A payment taken but never confirmed must offer
    inquiry, not a retry — a retry double-charges and the guest finds out.
  openQuestions:
  - Sandbox credentials for Stripe and Network International are outstanding. The recovery paths cannot
    be tested without them.
  implementation:
    app: web-b2c
    route: /cart-and-checkout/checkout-payment
    component: apps/web-b2c/src/routes/cart-and-checkout/CheckoutPaymentForm.tsx
    status: notStarted
- id: WEB-013
  name: Order Confirmation
  module: Cart & Checkout
  purpose: Confirm the purchase and deliver the tickets.
  wave: 1
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: banner
        notes: Confirmation with the order number prominent
      - kind: detailPanel
        bindsTo: Order
      - kind: secondaryButton
        label: Add to wallet
      - kind: secondaryButton
        label: Resend confirmation
  states:
    loading: Skeleton. Order number shows immediately from the create response.
    empty: Not applicable.
    error: Payment succeeded but confirmation did not load. Shows the order number and a support route
      — never implies the purchase failed.
  wireframe:
    status: notStarted
  capability: C03
  apis:
  - operationId: getOrder
    purpose: Confirmed order with entitlements
    trigger: onLoad
    contract: orders
  - operationId: reprintOrder
    purpose: Resend to email, wallet or messaging
    trigger: onAction
    contract: orders
  navigation:
    entryFrom:
    - WEB-012
    exitTo:
    - WEB-001
    - WEB-018
  implementation:
    app: web-b2c
    route: /cart-and-checkout/order-confirmation
    component: apps/web-b2c/src/routes/cart-and-checkout/OrderConfirmationDetail.tsx
    status: notStarted
