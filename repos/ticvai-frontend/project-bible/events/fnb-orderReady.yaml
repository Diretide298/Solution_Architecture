# fnb.orderReady v1 — published by fnb
# Checked by tools/check-states.py against states/ and the contracts.

name: fnb.orderReady
version: 1
publisher: fnb
description: Food is ready to hand over.
aggregate: fnbOrder
emittedWhen: FnbOrderStatus inPreparation to ready
payload:
- field: orderId
  type: string
- field: orderNumber
  type: string
  notes: Short and readable. It gets called across a counter
- field: outletId
  type: uuid
- field: venueId
  type: uuid
- field: fulfilment
  type: string
  notes: collect, deliverToLocation or tableService
- field: deliveryLocationId
  type: uuid
  notes: Where a runner takes it
- field: readyAt
  type: timestamp
consumers:
- context: marketing
  purpose: Push the guest a notification
  idempotencyKey: orderId
  onFailure: retry
  isCritical: false
- context: reporting
  purpose: Preparation time
  idempotencyKey: orderId
  onFailure: retry
  isCritical: false
retention: 30 days after publication
notes: '**Not critical, deliberately.** A guest who missed the push still sees the counter screen and
  the order number, so a failed notification is an inconvenience rather than lost food.'
