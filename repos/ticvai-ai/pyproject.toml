[project]
name = "ticvai-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "asyncpg>=0.30",
  "redis>=5.2",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "structlog>=24.4",
  "tiktoken>=0.8",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.12"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "respx>=0.21"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E","F","I","N","UP","B","A","C4","PT","SIM","ARG","PL","RUF","ASYNC","S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
