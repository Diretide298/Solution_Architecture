components:
  schemas:
    ModifyOrderRequest:
      type: object
      required: [id, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        addLines:
          type: array
          items: { $ref: '#/components/schemas/CreateOrderLine' }
        removeLineIds:
          type: array
          items: { type: string }
        reason: { type: string, maxLength: 500 }
        recordedAt: { type: string, format: date-time }

    PerformanceTarget:
      type: object
      description: >
        BL-098, 2.14.3 and 2.14.4. **Performance targets existed nowhere in the package**, and
        `performance/SLA` was one of the three artefact classes still open — until CF-144 found the
        RFP stating 99.9% uptime, which had been there all along.

        **Latency budgets on the critical sale path only.** A budget on every operation is a budget
        nobody measures; **these are the six where a slow response loses a sale or holds a queue.**

        | Operation | Budget |
        |---|---|
        | `addCartLine` | 300ms p95 |
        | `createPayment` | 1500ms p95 — **includes the gateway, which is most of it** |
        | `validateAccess` | 200ms p95 — **a turnstile, and the guest is walking** |
        | `getSeatAvailability` | 500ms p95 |
        | `identifyGuest` | 400ms p95 |
        | `recordGamePlay` | 250ms p95 |

        **Measured at the edge, not in the service.** A 200ms service behind a 900ms gateway is a
        900ms turnstile to the guest standing at it.
      properties:
        operationId: { type: string }
        p95Ms: { type: integer }
        p99Ms: { type: integer }
        measuredAt: { type: string, enum: [edge, service], default: edge }
        isCriticalPath: { type: boolean }


    GroupBooking:
      type: object
      x-ticvai-persistence: "orders.group_booking"
      description: >
        BL-028. **`BO-026 Group Bookings` ran on generic order operations** — no group size, no
        quota, no leader, no per-attendee capture.

        **The leader is the point.** A school booking forty places has one person who pays, one who
        is called if the coach is late, and forty who need names collecting — and a generic order
        has one guest.
      required: [id, orderId, leaderSubjectId, expectedSize, status]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        leaderSubjectId: { type: string, format: uuid }
        organisationName: { type: string, nullable: true }
        expectedSize: { type: integer }
        confirmedSize: { type: integer, nullable: true }
        minimumSize:
          type: integer
          nullable: true
          description: >
            **Below which the group rate does not apply.** A booking for forty that arrives as
            twelve is a pricing question somebody has to answer at the gate, and stating the
            threshold means answering it at booking instead.
        attendeeCaptureRequired:
          type: boolean
          default: false
          description: >
            **Whether names are needed before admission.** A school trip usually needs them and a
            corporate day out usually does not, and the difference is a safeguarding requirement
            rather than a preference.
        attendeeCaptureDueBy: { type: string, format: date-time, nullable: true }
        status: { type: string, enum: [provisional, confirmed, namesPending, complete, cancelled] }

    WalletPass:
      type: object
      x-ticvai-persistence: "orders.wallet_pass"
      description: >
        BL-029. **`appleWallet` and `googlePay` are feature toggles on the native apps** — there is
        no pass generation, no update push, no serial and no authentication token.

        **A wallet pass is a live object, not a download.** The value over a PDF is that it updates:
        a changed gate, a cancelled performance, a time that moved. **A pass that cannot be pushed
        to is a screenshot with better rounding.**
      required: [id, entitlementId, platform, serialNumber, status]
      properties:
        id: { type: string, format: uuid }
        entitlementId: { type: string, format: uuid }
        platform: { type: string, enum: [apple, google] }
        serialNumber: { type: string }
        authenticationToken:
          type: string
          format: password
          description: >
            **Write-only.** How the device proves it may fetch an update, and the reason a leaked
            serial alone is not enough to read somebody's ticket.
        status: { type: string, enum: [issued, updated, voided, expired] }
        lastPushedAt: { type: string, format: date-time, nullable: true }
        deviceRegistrations:
          type: integer
          description: >
            How many devices hold it. **A guest with the pass on a phone and a watch is one
            entitlement and two registrations**, and both need the update.


    ResaleListing:
      type: object
      x-ticvai-persistence: "orders.resale_listing"
      description: >
        BL-060. **Smaller than it first looked** — most of the machinery exists. An entitlement can
        already be transferred, an order can already be created, and payment already routes. What
        was missing is the listing itself and a cart line that can point at one.

        **A resale is a transfer with money attached**, and the venue is in the middle: the seller's
        entitlement is voided and a new one issued to the buyer, so **the ticket that admits is
        always one the venue issued.** That is what stops a screenshot at the gate.
      required: [id, entitlementId, sellerSubjectId, askPrice, status]
      properties:
        id: { type: string, format: uuid }
        entitlementId: { type: string, format: uuid }
        sellerSubjectId: { type: string, format: uuid }
        askPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        priceCapPercent:
          type: number
          nullable: true
          description: >
            **A ceiling as a percentage of face value**, because uncapped resale is a venue watching
            its own tickets sold at four times the price with its name on them. Null means uncapped,
            which is a venue decision rather than a default.
        sellerFeePercent: { type: number }
        buyerFeePercent: { type: number }
        status: { type: string, enum: [listed, reserved, sold, withdrawn, expired] }
        listedAt: { type: string, format: date-time }
        soldToSubjectId: { type: string, format: uuid, nullable: true }
        payoutStatus:
          type: string
          enum: [pending, held, paid, failed]
          description: >
            **The seller is paid after the buyer is admitted, not after they pay.** A resale
            refunded at the gate for a void ticket cannot be clawed back from a seller who has
            already been paid.

    TicketTemplate:
      type: object
      x-ticvai-persistence: "orders.ticket_template"
      description: >
        BL-102. **A venue changing its ticket artwork had no path that was not a code change.**

        2.16.6 asks to print a proof without processing a sale — the equivalent of
        `white-label.createPreview`, and the same reason: **artwork is checked by looking at it, and
        the only way to look at it was to sell something.**
      required: [id, name, mediaType, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isRecyclable:
          type: boolean
          default: false
          description: >
            BL-103. **An RFID wristband handed back at the exit is stock, not waste** — and nothing
            released it, so a venue reissuing one had a card serving two entitlements.

            **Replacement disables the previous medium automatically**, following the F23 rule: a
            guest issued a replacement wristband must not walk in on the old one, and relying on
            somebody remembering to blacklist it is how they do.
        recycleAfterDays:
          type: integer
          nullable: true
          description: >
            **A quarantine before reissue.** A wristband returned today and reissued tomorrow to a
            different guest is a support call waiting to happen when the first guest's app still
            shows it.
        mediaType: { type: string, enum: [thermalTicket, a4Pdf, wristband, rfidCard, walletPass, qrOnly, sms] }
        appliesToProductKinds:
          type: array
          items: { type: string }
        appliesToChannels:
          type: array
          items: { $ref: '../shared/common.yaml#/components/schemas/SalesChannel' }
        selectionPriority:
          type: integer
          default: 100
          description: >
            2.16.x. **Automatic media-type selection**, which was absent — a kiosk with no printer
            and a guest with no smartphone need different answers, and neither should be chosen by
            the caller.
        layoutRef: { type: string }
        localeVariants:
          type: object
          additionalProperties: { type: string }
        isActive: { type: boolean }


    Chargeback:
      type: object
      x-ticvai-persistence: "orders.chargeback"
      description: >
        BL-118, CF-144. **A chargeback is not a refund**, and treating it as one is how a venue
        loses them by default.

        A refund is a decision the venue makes. **A chargeback is a decision a bank makes, on a
        clock the venue does not control** — evidence is due in days, a deadline missed is a case
        lost regardless of merit, and there is a fee either way.

        The money is already gone when this record is created. **Representment is an argument, not a
        reversal.**
      required: [id, paymentId, amount, reason, status, evidenceDueBy]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        providerId: { type: string, format: uuid }
        providerCaseReference: { type: string }
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        feeAmount:
          $ref: '../shared/common.yaml#/components/schemas/Money'
        reason:
          type: string
          enum: [fraudulent, productNotReceived, productUnacceptable, duplicate, subscriptionCancelled,
                 creditNotProcessed, unrecognised, other]
          description: >
            **The scheme's reason code, mapped.** Which evidence wins depends entirely on it — a
            *product not received* case is answered by a scan record and a *fraudulent* case is not.
        status: { type: string, enum: [received, underReview, evidenceSubmitted, won, lost, accepted, expired] }
        evidenceDueBy:
          type: string
          format: date-time
          description: >
            **The field the whole record exists for.** A deadline missed is a case lost on merit
            nobody read, and it is the one date that must reach a person rather than a report.
        evidenceSubmittedAt: { type: string, format: date-time, nullable: true }
        evidence:
          type: array
          description: >
            **What the platform can prove**, assembled rather than typed: the order, the scan that
            admitted them, the delivery, the terms accepted, the IP and device. A venue answering a
            chargeback by hand is a venue answering it late.
          items:
            type: object
            properties:
              kind: { type: string, enum: [order, scanRecord, deliveryProof, termsAccepted, communication, deviceFingerprint, other] }
              reference: { type: string }
        outcomeAt: { type: string, format: date-time, nullable: true }

    FraudRule:
      type: object
      x-ticvai-persistence: "orders.fraud_rule"
      description: >
        BL-118. **Evaluated before the charge, and it holds rather than refuses.**

        A rule that declines outright turns a false positive into a lost sale with an angry guest.
        **A rule that flags for review turns it into a delay** — and at a gate, review means a
        supervisor rather than a rejection.
      required: [id, name, condition, action, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        condition:
          type: object
          description: Velocity, amount, issuer country, device reuse, mismatched billing.
          additionalProperties: true
        action: { type: string, enum: [allow, flagForReview, requireStepUp, hold, decline] }
        riskWeight: { type: integer }
        isActive: { type: boolean }


    PaymentProvider:
      type: object
      x-ticvai-persistence: "orders.payment_provider"
      description: >
        BL-116, CF-131. **`Payment` carried `providerName` and `providerReference`, which records a
        provider and does not abstract one.**

        Two gateways are confirmed for Phase 1 — **Network International and Stripe** — and that is
        exactly the number that forces this: **one gateway can be hard-coded and two cannot.**

        Credentials live in the vault and never here, following `ai.AiProvider` (ADR-0020's rule
        applied outside AI): **no surface ever holds a provider key.**
      required: [id, name, kind, isActive]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [networkInternational, stripe, adyen, checkout, cash, wallet, other] }
        supportedMethods:
          type: array
          items: { type: string, enum: [card, applePay, googlePay, samsungPay, wallet, bankTransfer, cash, bnpl] }
        supportedCurrencies:
          type: array
          items: { type: string }
        supportsTokenisation:
          type: boolean
          description: >
            **The keystone.** Recurring billing, wallet auto-reload, one-click checkout and payment
            links all require a stored credential, and none of them can be designed until this is
            answered per provider.
        supportsPartialCapture: { type: boolean, default: true }
        acceptedOnChannels:
          type: array
          description: >
            BL-115. **Which channels may use this provider.** A kiosk taking cash and a website
            taking cards is not a policy either could infer, and a venue that accepts cash at a till
            and not online had no way to say so.
          items: { $ref: '../shared/common.yaml#/components/schemas/SalesChannel' }
        presentmentCurrencies:
          type: array
          description: >
            BL-070. **What a storefront may quote in**, distinct from what it settles in. A guest
            sees GBP and the venue books AED — the display currency is the provider's capability and
            the settlement currency is the venue's (CF-114 on multi-currency).
          items: { type: string }
        supports3ds: { type: boolean, default: true }
        terminal:
          type: object
          nullable: true
          description: >
            BL-119. **Terminal behaviour, where this provider drives a physical device.** Unstated
            until now, and every field here is one a certification body asks about.
          properties:
            emvCertificationRef: { type: string, nullable: true }
            offlineFloorLimit:
              allOf:
                - $ref: '../shared/common.yaml#/components/schemas/Money'
              description: >
                **What a terminal may approve with no connection.** Above it the sale waits; below
                it the venue carries the risk knowingly — and a floor limit of zero means a till
                stops when the line does.
            supportsOfflineApproval: { type: boolean, default: false }
            receiptSignatureRequired: { type: boolean, default: false }
            supportsTipOnTerminal: { type: boolean, default: false }
        credentialRef:
          type: string
          description: >
            A vault reference. **Never the credential**, never returned, and rotated without a
            contract change.
        scopeLevel: { type: string, enum: [tenant, region, venue] }
        scopePath: { type: string }
        isActive: { type: boolean }

    PaymentRouting:
      type: object
      x-ticvai-persistence: "orders.payment_routing"
      description: >
        **Which provider takes a given payment, and why.** With two gateways the question is live
        from day one: a UAE card may cost less through one and an international card less through
        the other.

        **Ordered rules, first match wins, and a fallback that is not optional.** A gateway outage
        with no fallback is a venue that cannot sell.
      required: [id, priority, providerId]
      properties:
        id: { type: string, format: uuid }
        priority: { type: integer }
        providerId: { type: string, format: uuid }
        conditions:
          type: object
          description: >
            **Match on what is known before the charge** — channel, currency, method, issuer
            country, amount band. Not on anything that requires asking the provider first.
          properties:
            channel: { $ref: '../shared/common.yaml#/components/schemas/SalesChannel' }
            currency: { type: string, nullable: true }
            method: { type: string, nullable: true }
            issuerCountry: { type: string, nullable: true }
            minAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            maxAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        fallbackProviderId:
          type: string
          format: uuid
          nullable: true
          description: >
            **Where this provider declines or is unreachable.** A decline is not always a fallback
            case — an insufficient-funds decline should not be retried elsewhere, and a gateway
            timeout should.

    PaymentToken:
      type: object
      x-ticvai-persistence: "orders.payment_token"
      description: >
        BL-116. **A stored credential, held by the provider and referenced here.** The platform
        never sees a card number, which is what keeps PCI scope where it belongs.

        **A token is provider-scoped.** A card tokenised with one gateway does not work with
        another, so a routing change does not silently move a guest's saved card — it means asking
        them again, and the model should make that visible rather than surprising.
      required: [id, subjectId, providerId, token, isDefault]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        providerId: { type: string, format: uuid }
        token:
          type: string
          format: password
          description: >
            **Write-only, never returned.** The provider's reference to a credential it holds.
        method: { type: string }
        maskedIdentifier:
          type: string
          description: >
            What a guest sees — the last four digits, the card brand. **Enough to choose between two
            saved cards and not enough to use one.**
        expiresAt: { type: string, format: date, nullable: true }
        isDefault: { type: boolean }
        consentPurposeId:
          type: string
          format: uuid
          nullable: true
          description: >
            **Storing a card for future use is a purpose a guest consents to**, separate from the
            payment they are making now. A token taken without it is a card kept on a guest's
            behalf that they never agreed to.


    Invitation:
      type: object
      x-ticvai-persistence: "orders.invitation"
      description: >
        8.1.3 to 8.1.5. **A complimentary entitlement, issued outside the order path.** No payment
        is expected, so nothing waits for one.
      required: [id, productId, quantity, reason, offeredByPrincipalId, issuedAt]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        performanceId: { type: string, format: uuid, nullable: true }
        quantity: { type: integer }
        reason: { type: string, enum: [hosting, media, sponsor, staff, compensation, community, trade] }
        offeredByPrincipalId: { type: string, format: uuid }
        issuedByPrincipalId:
          type: string
          format: uuid
          description: >
            **Who pressed the button, which is not always who offered it.** Both are recorded
            because the allowance belongs to the offerer and the audit belongs to the issuer.
        recipientName: { type: string, nullable: true }
        recipientEmail: { type: string, nullable: true }
        costCenterId: { type: string, format: uuid, nullable: true }
        entitlementIds:
          type: array
          items: { type: string, format: uuid }
        issuedAt: { type: string, format: date-time }

    InvitationAllowance:
      type: object
      x-ticvai-persistence: "orders.invitation_allowance"
      description: >
        8.1.5. **What a profile may give away, and over what period.** An unbounded comp right is
        how a venue gives away a season.
      required: [principalId, periodKind, allowance, used]
      properties:
        principalId: { type: string, format: uuid }
        roleId: { type: string, format: uuid, nullable: true }
        periodKind: { type: string, enum: [perPerformance, monthly, quarterly, annual, unlimited] }
        allowance: { type: integer }
        used: { type: integer, readOnly: true }
        remaining: { type: integer, readOnly: true }
        requiresApprovalAbove:
          type: integer
          nullable: true
          description: >
            Above this many, the issue routes through approvals. **Separate from the allowance** —
            a host may have fifty and still need a signature for twenty at once.


    OrderModificationResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [order, balanceDue]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        addedValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        removedValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        balanceDue:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Positive means the guest pays; negative means a refund is due.
        refundId: { type: string, nullable: true }
        revokedEntitlementIds:
          type: array
          items: { type: string }
        issuedEntitlementIds:
          type: array
          items: { type: string }

    ExchangeOrderRequest:
      type: object
      required: [id, outgoingLineIds, incomingLines, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        outgoingLineIds:
          type: array
          minItems: 1
          items: { type: string }
        incomingLines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateOrderLine' }
        waiveFee: { type: boolean, default: false }
        reason: { type: string, maxLength: 500 }
        recordedAt: { type: string, format: date-time }

    OrderExchangeResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [orderId, outgoingValue, incomingValue, difference]
      properties:
        orderId: { type: string }
        outgoingValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        incomingValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        exchangeFee: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        difference:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Only the difference settles. The replacement is held before the original is
            released, never the other way round.
        newLineIds:
          type: array
          items: { type: string }
        revokedEntitlementIds:
          type: array
          items: { type: string }
        issuedEntitlementIds:
          type: array
          items: { type: string }

    TicketTransfer:
      x-ticvai-persistence: "orders.ticket_transfer"
      type: object
      required: [id, orderId, ticketIds, status, offeredAt, expiresAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        ticketIds:
          type: array
          items: { type: string }
        fromSubjectId: { type: string, format: uuid }
        toSubjectId:
          type: string
          format: uuid
          nullable: true
          description: Set only on claim. Ownership moves then, not at offer.
        recipientAddressMasked: { type: string }
        status:
          type: string
          enum: [offered, claimed, expired, cancelled]
        claimUrl: { type: string, nullable: true }
        offeredAt: { type: string, format: date-time }
        claimedAt: { type: string, format: date-time, nullable: true }
        expiresAt:
          type: string
          format: date-time
          description: >
            An unclaimed transfer expires and the tickets return. A transfer to a mistyped
            address must not strand a ticket somewhere nobody can reach.

    OrderStatement:
      x-ticvai-persistence: "none — computed from order, payment, refund and ledger"
      type: object
      required: [orderId, orderNumber, currency, entries, currentBalance]
      properties:
        orderId: { type: string }
        orderNumber: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currencyScale: { type: integer }
        entries:
          type: array
          description: Sequential. What an agent reads to a guest asking about a charge.
          items:
            type: object
            required: [kind, amount, runningBalance, occurredAt]
            properties:
              kind:
                type: string
                enum: [sale, payment, refund, void, modification, exchange, fee, variance, chargeback]
              description: { type: string }
              amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              runningBalance: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              referenceId: { type: string, nullable: true }
              principalId: { type: string, format: uuid, nullable: true }
              occurredAt: { type: string, format: date-time }
        totalPaid: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        totalRefunded: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        currentBalance:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Positive means the guest owes; negative means a refund is outstanding.

    CreditPosition:
      x-ticvai-persistence: "orders.b2b_credit + orders.credit_override"
      type: object
      required: [accountId, creditLimit, used, available, isSuspended]
      properties:
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        creditLimit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        used: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        available: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        isOverLimit: { type: boolean }
        isSuspended: { type: boolean }
        paymentTermsDays: { type: integer }
        oldestUnpaidInvoiceAt: { type: string, format: date-time, nullable: true }
        daysOverdue: { type: integer }
        activeOverrides:
          type: array
          items:
            type: object
            properties:
              orderId: { type: string }
              amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              authorisedByPrincipalId: { type: string, format: uuid }
              reason: { type: string }
              expiresAt: { type: string, format: date-time, nullable: true }

    EntitlementStatus:
      type: string
      description: >
        **What the storage layer holds, and what a guest is shown.** `MediaEntitlements` carried
        only `isValid` and a reason string — a boolean cannot distinguish a ticket that was used
        from one that expired, was refunded, or was transferred to somebody else, and those are
        four different conversations at a gate.

        Added 17 August. `states/entitlement.yaml` had modelled these six since 14 August and
        the contract had no enum behind it, which the state checker reported correctly for three
        days.
      enum:
        - issued
        - partiallyConsumed
        - fullyConsumed
        - expired
        - cancelled
        - surrendered

    EntitlementSummary:
      type: object
      x-ticvai-persistence: "catalogue.entitlement_template"
      description: >
        One entitlement on a piece of media, as a guest or a steward sees it.
      required: [entitlementId, status]
      properties:
        entitlementId: { type: string, format: uuid }
        productName: { type: string }
        status: { $ref: '#/components/schemas/EntitlementStatus' }
        entriesAllowed: { type: integer, nullable: true }
        entriesUsed: { type: integer }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        transferredToSubjectId:
          type: string
          format: uuid
          nullable: true
          description: >
            Set where `surrendered`. **A guest whose ticket is gone should be told who has it**,
            not shown an invalid pass with no explanation.

    MediaEntitlements:
      type: object
      x-ticvai-persistence: "none — projection over entitlement and scan history"
      required: [mediaCode, isValid, entitlements]
      properties:
        mediaCode: { type: string }
        mediaKind:
          type: string
          enum: [qr, wristband, card, nfc, mobilePass]
        subjectId: { type: string, format: uuid, nullable: true }
        isValid: { type: boolean }
        invalidReason: { type: string, nullable: true }
        canAcceptMore:
          type: boolean
          description: >
            False where the media has been surrendered, expired or blocked. A cashier should
            know before taking money, not after.
        entitlements:
          type: array
          items:
            type: object
            properties:
              entitlementId: { type: string }
              name: { type: string }
              kind:
                type: string
                enum: [admission, locker, fnb, retail, parking, rental, experience, membership]
              orderId: { type: string }
              addedAt: { type: string, format: date-time }
              status:
                allOf:
                  - $ref: '#/components/schemas/EntitlementStatus'
                description: >
                  **Replaced `isRedeemed` on 17 August.** A boolean could not distinguish a
                  ticket that was used from one that expired, was refunded, or was transferred —
                  four different conversations at a gate, and the steward could see only "not
                  valid".
              entriesUsed: { type: integer }
              entriesAllowed: { type: integer, nullable: true }
              redeemedAt: { type: string, format: date-time, nullable: true }
              transferredToSubjectId:
                type: string
                format: uuid
                nullable: true
              validTo: { type: string, format: date-time, nullable: true }

    AppendEntitlementRequest:
      type: object
      x-ticvai-persistence: "none — request only"
      required: [id, lines, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [variantId, quantity]
            properties:
              variantId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1 }
              performanceId: { type: string, format: uuid, nullable: true }
        paymentMethod:
          type: string
          enum: [card, cash, wallet, giftCard, chargeToAccount]
        note: { type: string, maxLength: 300 }
        recordedAt: { type: string, format: date-time }

    AppendEntitlementResult:
      type: object
      x-ticvai-persistence: "none — computed"
      required: [order, media]
      properties:
        order:
          allOf:
            - $ref: '#/components/schemas/Order'
          description: >
            A **new** order. The original is untouched — it was paid, receipted and possibly
            reported on, and editing it would move yesterday's revenue.
        media:
          allOf:
            - $ref: '#/components/schemas/MediaEntitlements'
          description: The full set now on the media, so the cashier can say what the QR does.
        addedEntitlementIds:
          type: array
          items: { type: string }

    AppendRefusedProblem:
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          x-ticvai-persistence: "none — error shape"
          properties:
            refusedReason:
              type: string
              enum:
                - mediaExpired
                - mediaBlocked
                - mediaSurrendered
                - entitlementCannotShareMedia
                - venueMismatch
                - guestAlreadyDeparted
            mediaCode: { type: string }
            detail: { type: string }

    OrderResumeResult:
      type: object
      x-ticvai-persistence: "none — computed"
      required: [order, hasChanged]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        hasChanged:
          type: boolean
          description: >
            True where anything moved while the sale was parked. The cashier decides — silently
            charging the old price loses money, silently charging the new one loses the guest.
        changes:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [priceChanged, promotionExpired, promotionNowApplies, soldOut, seatHoldExpired, productWithdrawn]
              lineId: { type: string }
              detail: { type: string }
              wasAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              nowAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    ManualDiscountRequest:
      type: object
      x-ticvai-persistence: "none — request only"
      required: [id, reason, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        lineId:
          type: string
          nullable: true
          description: Omit to discount the order rather than a line.
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        percentage: { type: number, minimum: 0, maximum: 100 }
        reason:
          type: string
          minLength: 3
          maxLength: 300
          description: >
            Required, and free text rather than a code list. A cashier forced to pick the
            nearest reason picks the first one, and the register stops meaning anything.
        reasonCode:
          type: string
          nullable: true
          description: Optional alongside the free text, where the venue maintains a list.
        approverPrincipalId:
          type: string
          format: uuid
          nullable: true
          description: Required above the venue threshold. May not be the requester.
        recordedAt: { type: string, format: date-time }

    OrderChannel:
      type: string
      description: >
        Where the order originated. Added when guest self-ordering was contracted — an order a
        guest placed on their own phone is commercially and operationally different from one a
        cashier typed, and reporting that cannot separate them cannot answer whether
        self-ordering is working.
      enum: [pos, kiosk, guestApp, guestWeb, callCentre, partner, api, backOffice]

    OrderStatus:
      type: string
      enum: [pending, held, paid, partiallyPaid, completed, voided, refunded, partiallyRefunded, failed]
      description: >
        `held` is a parked sale — the cashier freed the till and the guest will return. It
        holds no inventory and expires, because a till that accumulates parked sales across a
        shift cannot be closed.

    Channel:
      type: string
      enum: [pos, kiosk, web, mobile, b2b, ota, callCentre]

    TenderKind:
      type: string
      enum: [cash, card, wallet, voucher, bankTransfer, hotelCharge, installment, giftCard, complimentary]

    CreateOrderRequest:
      type: object
      required: [id, venueId, channel, lines, recordedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: Client-generated ULID. Also the idempotency key.
        venueId: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/Channel' }
        shiftId: { type: string }
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: Null for an anonymous sale. Identity and entitlement are separate.
        guestLinkId:
          type: string
          nullable: true
          description: Present where the guest is linked across cells.
        catalogueBundleVersion:
          type: string
          description: >
            The bundle the client priced from. Lets the server explain a variance rather than
            merely report one.
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateOrderLine' }
        recordedAt: { type: string, format: date-time }

    CreateOrderLine:
      x-ticvai-persistence: "none — request only"
      type: object
      required: [id, variantId, quantity, quotedUnitPrice]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        variantId: { type: string, format: uuid }
        performanceId: { type: string, format: uuid }
        leaseId:
          type: string
          nullable: true
          description: Lease the units were drawn from. Absent for uncontended products.
        seatIds:
          type: array
          items: { type: string }
          description: Seated products only. Not available offline.
        quantity: { type: integer, minimum: 1 }
        quotedUnitPrice:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: What the client charged, from its local bundle.
        holderName: { type: string, nullable: true }
        dataMaskValues:
          type: object
          additionalProperties: true

    OrderLine:
      x-ticvai-persistence: "orders.order_line"
      allOf:
        - $ref: '#/components/schemas/CreateOrderLine'
        - type: object
          required: [serverUnitPrice, taxAmount, netAmount, grossAmount]
          properties:
            serverUnitPrice:
              allOf:
                - $ref: '../shared/common.yaml#/components/schemas/Money'
              description: What the server computed on ingest.
            priceVariance:
              allOf:
                - $ref: '../shared/common.yaml#/components/schemas/Money'
              description: >
                Server minus quoted. Non-zero means the quoted price was honoured and the
                difference posted to the variance account.
            taxAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            netAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            grossAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            entitlementIds:
              type: array
              items: { type: string }
            crossCellRightIds:
              type: array
              items: { type: string }
              description: Redemption rights propagated to other cells for this line.

    CartStatus:
      type: string
      enum: [active, expiring, expired, abandoned, checkedOut]

    CartLine:
      type: object
      x-ticvai-persistence: "orders.cart_line"
      required: [id, variantId, quantity]
      properties:
        id: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        productName: { type: string, readOnly: true }
        quantity: { type: integer, minimum: 1 }
        performanceId: { type: string, format: uuid, nullable: true }
        seatIds:
          type: array
          items: { type: string, format: uuid }
        overridePrice:
          $ref: '../shared/common.yaml#/components/schemas/Money'
        overrideReason:
          type: string
          nullable: true
          enum: [priceMatch, serviceRecovery, negotiated, damagedGoods, staffSale, error]
          description: >
            BL-085. **An operator could apply an approved discount and not enter a price.** A price
            match against a competitor and a service-recovery gesture are not discounts off a list —
            they are a number somebody decided.

            **Escalated above a configured threshold, and the reason is a closed set**: a free-text
            override reason is an override nobody can report on, and this is the field an auditor
            reads first.
        feeKind:
          type: string
          nullable: true
          enum: [booking, transaction, service, delivery, convenience, cancellation]
          description: >
            **A fee is a line, not an adjustment.** `orders` already separates a service charge from a
            tip for the reason that applies here: **a guest is entitled to see what they are being
            charged for**, and a fee folded into the ticket price is a fee nobody can question.

            Itemised at checkout, taxed on its own code, and refundable separately — **a cancellation
            fee is usually the one thing not refunded**, which only works if it is its own line.
        unitPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        lineTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        leaseId:
          type: string
          format: uuid
          nullable: true
          description: >
            The capacity held for this line. **Null for a product with no capacity** — a
            t-shirt needs stock, not a lease.
        leaseExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Shown to the guest. *"Your seats are held for 6 minutes"* is better than discovering
            it at checkout.
        isAvailable:
          type: boolean
          readOnly: true
          description: >
            Re-checked on every read. **A line can become unavailable while the cart sits** —
            a lease expiring is not the same as the product selling out, and both land here.

    CartConflict:
      type: object
      x-ticvai-persistence: "none — computed on read"
      description: >
        2.9.5. Golf at 13:00 and karting at 13:00 for the same guest. **A prompt, not a
        refusal** — a party of four may legitimately split, and refusing would be wrong more
        often than right.
      properties:
        kind: { type: string, enum: [overlappingTime, sameSessionDifferentVenue, exceedsPartySize, requiresPrerequisite] }
        lineIds:
          type: array
          items: { type: string, format: uuid }
        message: { type: string }
        isBlocking:
          type: boolean
          description: >
            Most are not. `requiresPrerequisite` is — an add-on with no ticket to attach to
            cannot be sold.

    Cart:
      type: object
      x-ticvai-persistence: "orders.cart"
      required: [id, venueId, channel, status, lines]
      properties:
        id: { type: string, format: uuid }
        token:
          type: string
          readOnly: true
          description: >
            **How an anonymous guest returns to their cart**, including from a recovery email.
            Rotated on claim, so a link shared before signing in does not reach the account
            after.
        venueId: { type: string, format: uuid }
        channel: { $ref: '../shared/common.yaml#/components/schemas/SalesChannel' }
        subjectId:
          type: string
          format: uuid
          nullable: true
          description: Null while anonymous. Set by `claimCart`.
        status: { $ref: '#/components/schemas/CartStatus' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/CartConflict' }
        subtotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        discountTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        taxTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        total: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        appliedPromotionIds:
          type: array
          description: >
            **Re-evaluated on every read.** A promotion that expired while the cart sat must not
            still be applied at checkout, and a promotion that became applicable should be.
          items: { type: string, format: uuid }
        expiresAt:
          type: string
          format: date-time
          description: The earliest lease expiry in the cart, or the cart's own window where it holds none.
        extensionsUsed: { type: integer, readOnly: true }
        maxExtensions: { type: integer, readOnly: true }
        locale: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AddCartLineRequest:
      type: object
      x-ticvai-persistence: "none — request only"
      required: [variantId, quantity]
      properties:
        variantId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        performanceId: { type: string, format: uuid }
        seatIds:
          type: array
          items: { type: string, format: uuid }
        parentLineId:
          type: string
          format: uuid
          nullable: true
          description: >
            For an add-on attaching to a ticket already in the cart. **Removing the parent
            removes the child** — a locker with no admission is not a sale.
        attributes:
          type: object
          additionalProperties: true

    CartMergeResult:
      type: object
      x-ticvai-persistence: "none — computed"
      required: [cart]
      properties:
        cart: { $ref: '#/components/schemas/Cart' }
        mergedLineCount: { type: integer }
        droppedLines:
          type: array
          description: >
            **Reported, never silent.** Lines that could not be re-leased on merge are named, so
            a guest signing in is told what they lost rather than discovering it at checkout.
          items:
            type: object
            properties:
              productName: { type: string }
              reason: { type: string, enum: [noCapacity, expired, notSellableOnChannel, duplicate] }

    AbandonedCart:
      type: object
      x-ticvai-persistence: "none — a projection of orders.cart"
      properties:
        cartId: { type: string, format: uuid }
        token: { type: string }
        subjectId: { type: string, format: uuid, nullable: true }
        hasContactPoint:
          type: boolean
          description: >
            **An anonymous cart with no email cannot be recovered.** Worth counting, because it
            sizes what a sign-in prompt earlier in the journey would be worth.
        venueId: { type: string, format: uuid }
        lineCount: { type: integer }
        value: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        topProductName: { type: string }
        abandonedAt: { type: string, format: date-time }
        remindersSent: { type: integer }

    Order:
      x-ticvai-persistence: "orders.sales_order + orders.order_line"
      type: object
      required: [id, venueId, scopePath, channel, status, currency, currencyScale, grossAmount, taxAmount, netAmount, lines, createdAt, recordedAt]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        channel:
          allOf:
            - $ref: '#/components/schemas/OrderChannel'
          description: >
            Where it came from. Drives revenue attribution, promotion eligibility and the
            self-service adoption figures the operator will ask for within a month of launch.
        venueId: { type: string, format: uuid }
        scopePath: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currencyScale: { type: integer, minimum: 0, maximum: 4 }
        grossAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        taxAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        netAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        refundedAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        totalPriceVariance:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Sum across lines. Zero on a normal order.
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        principalId: { type: string, format: uuid }
        workstationId: { type: string, format: uuid }
        shiftId: { type: string, nullable: true }
        subjectId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        syncedAt: { type: string, format: date-time, nullable: true }

    OrderSummary:
      x-ticvai-persistence: "none — projection"
      type: object
      required: [id, orderNumber, status, grossAmount, createdAt]
      properties:
        id: { type: string }
        orderNumber: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        grossAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        refundedAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        channel: { $ref: '#/components/schemas/Channel' }
        lineCount: { type: integer }
        createdAt: { type: string, format: date-time }

    RefundPolicy:
      x-ticvai-persistence: "orders.refund_policy"
      type: object
      description: >
        Venue-configured. Thresholds are policy, not permission scope — venues run different
        policies and the permission model should not encode commercial rules.
      required: [venueId, selfAuthoriseLimit, requiresApprovalAbove]
      properties:
        venueId: { type: string, format: uuid }
        selfAuthoriseLimit:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Up to this, a holder of ORDER_REFUND refunds alone. Zero means every refund
            needs a second authoriser.
        requiresSecondUserAbove:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Above this, a second user — cashier OR supervisor — names themselves as audit
            control. Dual-authorisation, not escalation (2.12.3).
        requiresApprovalAbove:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Above this, an ORDER_REFUND_APPROVE holder must approve.
        timeBands:
          type: array
          description: >
            Refundable percentage by time before the performance. Evaluated most-specific
            first.
          items:
            type: object
            required: [hoursBefore, percentage]
            properties:
              hoursBefore: { type: integer, minimum: 0 }
              percentage: { type: number, minimum: 0, maximum: 100 }
        allowPartial: { type: boolean, default: true }
        refundWindowDays: { type: integer, nullable: true }
        varianceThreshold:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Price variance above this is an exception requiring review rather than a routine
            posting (CF-38). Venue-configured.

    RefundPolicyProblem:
      allOf:
        - $ref: '../shared/common.yaml#/components/schemas/Problem'
        - type: object
          properties:
            requiredAuthorisation:
              type: string
              enum: [secondUser, approval]
            threshold: { $ref: '../shared/common.yaml#/components/schemas/Money' }
            policyVenueId: { type: string, format: uuid }

    CreateRefundRequest:
      type: object
      required: [id, amount, reason, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        lineIds:
          type: array
          items: { type: string }
          description: Omit to refund the whole order.
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        reason: { type: string, minLength: 3, maxLength: 500 }
        secondaryAuthorisation:
          type: object
          description: >
            Required above the venue's `requiresSecondUserAbove`. A second user — cashier or
            supervisor — names themselves. This is dual-authorisation, not escalation.
          required: [principalId, credential]
          properties:
            principalId: { type: string, format: uuid }
            credential: { type: string, maxLength: 512 }
        refundToOriginalTender: { type: boolean, default: true }
        alternateTender: { $ref: '#/components/schemas/TenderKind' }
        recordedAt: { type: string, format: date-time }

    Refund:
      x-ticvai-persistence: "orders.refund"
      type: object
      required: [id, orderId, amount, status, createdAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        fxRate:
          type: number
          nullable: true
          readOnly: true
          description: >
            **The rate on the original payment, not today's** (BL-087, CF-118).

            `Payment` records `tenderCurrency`, `fxRate` and `fxRateSource` at the moment of sale, so
            the sale rate is always retrievable. **Refunding at today's rate repays a different amount
            of money than was taken** — a guest who paid 100 USD at 3.67 and is refunded at 3.72 gets
            back more AED than they gave, and the venue carries the difference on every refund.

            The exposure runs both ways and neither direction is defensible: a guest short-changed by
            a moving rate has a complaint the venue cannot answer, because **the guest did nothing but
            wait.**
        taxReversalEntryId:
          type: string
          format: uuid
          nullable: true
          readOnly: true
          description: >
            **A refund reverses the tax entry it created, and this is where that is stated rather
            than implied.** `reverseJournalEntry` and `calculateTax` both exist, so both halves were
            present and the obligation was assumed — **an implied obligation is one a developer can
            miss without failing anything.**

            Null only where the original sale carried no tax.
        settleTo:
          type: string
          enum: [originalTender, advanceBalance, wireTransfer, storeCredit]
          default: originalTender
          description: >
            BL-086. **A refund could only go back the way it came.** A guest whose card has expired,
            a partner settling by wire, a guest who would rather have the credit — three real cases
            with one answer.

            **`originalTender` stays the default** because refunding elsewhere is how money laundering
            works, and anything else needs a reason.
        fxVariance:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: >
            Where the sale rate and the current rate differ, **the difference is booked as an FX
            variance rather than hidden in the refund**. `runFxRevaluation` already handles this
            class of movement and this is the same act at a smaller scale.
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        appliedPercentage:
          type: number
          description: From the venue's time bands, or an approver override.
        status:
          type: string
          enum: [pendingApproval, pendingGateway, completed, declined, failed]
        reason: { type: string }
        requestedByPrincipalId: { type: string, format: uuid }
        secondaryPrincipalId: { type: string, format: uuid, nullable: true }
        approvedByPrincipalId: { type: string, format: uuid, nullable: true }
        ledgerEntryId:
          type: string
          nullable: true
          description: Written before the gateway is called.
        gatewayReference: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    CreatePaymentRequest:
      type: object
      required: [id, orderId, tender, amount, recordedAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        orderId: { type: string }
        tender: { $ref: '#/components/schemas/TenderKind' }
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        tenderedAmount:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Cash only. Change is the difference.
        walletAuthorisationId:
          type: string
          nullable: true
          description: Cross-cell wallet hold, where the guest's home cell is elsewhere.
        deviceId: { type: string, format: uuid, nullable: true }
        recordedAt: { type: string, format: date-time }

    Payment:
      x-ticvai-persistence: "orders.payment"
      type: object
      required: [id, orderId, tender, amount, status, recordedAt]
      properties:
        id: { type: string }
        orderId: { type: string }
        tender: { $ref: '#/components/schemas/TenderKind' }
        tenderCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: >
            4.6.11. **What the guest actually handed over**, which is not always what the venue books. A
            tourist paying USD cash at a till is a foreign tender; the sale is still recorded in base
            currency.

            Equal to the base currency for almost every payment. **Present on all of them so the
            foreign-tender report has a source** — `getForeignTenderReport` promised *what was taken in
            which currency* and nothing recorded it until 18 August.
        tenderAmount:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: The amount in `tenderCurrency`, at that currency's own scale.
        fxRate:
          type: number
          nullable: true
          description: >
            The rate applied, **stored on the payment rather than looked up later** (CF-37). A payment
            reconciled next month is reconciled at the rate of the day it was taken.
        fxRateSource:
          type: string
          nullable: true
          enum: [manual, feed, cardScheme]
          description: >
            4.2.8. Manual or fed on a schedule. **`cardScheme` is where the terminal did the conversion
            and told us** — dynamic currency conversion, the scheme's rate rather than ours.
        changeCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
          nullable: true
          description: >
            4.6.11 is deliberately asymmetric: **accept foreign currency, refund in local.** A till giving
            change in five currencies needs five floats and five counts, and the variance becomes
            unattributable.
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        changeAmount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        status:
          type: string
          enum: [authorised, captured, pendingConfirmation, declined, failed, voided, refunded]
        providerName: { type: string, nullable: true }
        providerReference: { type: string, nullable: true }
        lastInquiryAt: { type: string, format: date-time, nullable: true }
        recordedAt: { type: string, format: date-time }
        syncedAt: { type: string, format: date-time, nullable: true }

    CreateReservationRequest:
      type: object
      required: [id, venueId, lines, expiresAt]
      properties:
        id: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
        venueId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/CreateOrderLine' }
        expiresAt: { type: string, format: date-time }

    Reservation:
      x-ticvai-persistence: "orders.reservation"
      type: object
      required: [id, venueId, status, expiresAt, createdAt]
      properties:
        id: { type: string }
        venueId: { type: string, format: uuid }
        status:
          type: string
          enum: [held, converted, expired, cancelled]
        lines:
          type: array
          items: { $ref: '#/components/schemas/CreateOrderLine' }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        convertedOrderId: { type: string, nullable: true }

    OfflineOrder:
      x-ticvai-persistence: "none — client-side journal, not server storage"
      allOf:
        - $ref: '#/components/schemas/CreateOrderRequest'
        - type: object
          required: [sequence, payments]
          properties:
            sequence:
              type: integer
              minimum: 1
              description: Monotonic per device. Processed in this order.
            payments:
              type: array
              items: { $ref: '#/components/schemas/CreatePaymentRequest' }

    OrderSyncResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [accepted, results]
      properties:
        accepted: { type: integer }
        stoppedAtSequence:
          type: integer
          nullable: true
          description: >
            First entry that could not be processed. Null when the batch succeeded. The
            client retries from here and never past it.
        results:
          type: array
          items:
            type: object
            required: [id, sequence, status]
            properties:
              id: { type: string }
              sequence: { type: integer }
              status:
                type: string
                enum: [accepted, duplicate, rejected]
              orderNumber: { type: string, nullable: true }
              priceVariance:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Money'
                description: Posted to the variance account. Not surfaced to the cashier.
              varianceExceedsThreshold:
                type: boolean
                description: True when review is required per the venue's variance threshold.
              error: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

    SyncRejection:
      x-ticvai-persistence: "sync.rejection"
      type: object
      required: [id, workstationId, kind, rejectedAt, problem]
      properties:
        id: { type: string }
        workstationId: { type: string, format: uuid }
        kind:
          type: string
          enum: [order, payment, refund, void, scan]
        recordedAt: { type: string, format: date-time }
        rejectedAt: { type: string, format: date-time }
        problem: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        payload:
          type: object
          additionalProperties: true
        resolvedAt: { type: string, format: date-time, nullable: true }
        resolvedByPrincipalId: { type: string, format: uuid, nullable: true }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
