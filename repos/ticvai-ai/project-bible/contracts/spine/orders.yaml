    post:
      operationId: createBulkRefund
      x-ticvai-consumed-by:
        - "P08 BO-004 Manual Wait Time Entry"
      x-ticvai-audience: [staff]
      summary: Refund every order against an event, performance or date
      description: >
        Cancellation handling. Always requires approval regardless of individual thresholds —
        the aggregate is what matters, not each line.
      tags: [refund]
      x-ticvai-permission: ORDER_REFUND_BULK
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
