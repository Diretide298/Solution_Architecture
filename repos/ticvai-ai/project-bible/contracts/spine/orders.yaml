openapi: 3.1.0
info:
  title: TICVAI Order & Payment
  version: 0.1.0
  x-ticvai-screen-count: 46
  x-ticvai-tier: spine
  x-ticvai-module: "2 — Ticketing Sales"
  x-ticvai-requirements: 343
  x-ticvai-capabilities: [C02, C03, C04, C34, C47]
  x-ticvai-platforms:
    - "P04 POS"
    - "P01 Guest Web"
    - "P02 Guest App"
    - "P05 Guest Kiosk"
    - "P10 Partner Web"
    - "P12 Venue Support"
  description: >
    ## What this contract covers

    **Money moves here. One atomic transaction with entitlement and ledger.**

    | | |
    |---|---|
    | **Tier** | spine |
    | **Matrix domain** | 2 — Ticketing Sales |
    | **Requirements** | ~343 |
    | **Capabilities** | C02, C03, C04, C34, C47 |
    | **Consumed by** | P04 POS · P01 Guest Web · P02 Guest App · P05 Guest Kiosk · P10 Partner Web · P12 Venue Support |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table
    name, a list of tables, or `none` with a reason. It is documentation of the mapping, not
    a generator input — the DDL lives in versioned SQL migrations, because partitioning, RLS
    policies, `ltree` indexes and partial indexes have no expression in OpenAPI.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Orders, payments, refunds, voids and reservations. Shift and till are separate
    (`shift.yaml`).

    Positions this encodes:

    - **The server re-prices every line on ingest** (ADR-0013). The local price is the
      guest's answer; the server is authoritative for the ledger. Where they disagree the
      quoted price is honoured and a variance is posted — the guest has already paid and
      left, so the ledger records what happened rather than what should have.
    - **Refund thresholds are venue policy, not permission scope** (CF-36). `ORDER_REFUND`
      is binary. How much a holder may refund without a second authoriser is configured per
      venue, because venues run different policies.
    - **Dual-authorisation, not escalation** (2.12.3). Above threshold a second user — cashier
      or supervisor — names themselves as audit control. That is a different mechanism from
      escalating to a higher permission.
    - **Orders never span cells** (ADR-0010). The selling cell owns the order; redemption
      rights propagate.
    - Payment recovery matters more than the happy path. A terminal that charged a card and
      never received a response is the normal failure, not the exotic one.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: order
  - name: b2b
  - name: payment
  - name: refund
  - name: reservation
  - name: policy
  - name: sync

paths:
  /carts:
    post:
      operationId: createCart
      x-ticvai-audience: [guest]
      summary: Start a cart
      description: >
        **A cart holds leases; an order holds money.** Different lifetimes, different failure
        modes, and merging them is why this contract did not exist until 17 August — `createOrder`
        takes a whole basket at once, which is correct for a till and cannot be resumed on
        another device.

        Created against a guest subject where one is known, or an anonymous token where it is
        not. **The token is what lets a guest browse before signing in** and keep their cart when
        they do (2.1.31).

        **POS does not use this.** A till builds its sale locally and submits atomically, because
        it works offline and does not need a resumable cart. Same order contract, different
        channel.
      tags: [cart]
      x-ticvai-permission: null   # a guest session, or anonymous before one exists
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueId, channel]
              properties:
                venueId: { type: string, format: uuid }
                channel: { $ref: '../shared/common.yaml#/components/schemas/SalesChannel' }
                subjectId: { type: string, format: uuid, nullable: true }
                locale: { type: string }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /orders/{orderId}/convert-to-term:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: convertToTermProduct
      summary: Turn a visit into a membership or season pass
      description: >
        BL-031. **Not a line exchange, because the price treatment differs.** An exchange swaps one
        product for another at a price difference; a conversion **credits what the guest paid today
        against a term product and starts a new validity period.**

        The classic case: a guest at the gate told *"today's ticket comes off an annual pass."*
        **That offer is the single most effective upsell a venue has**, and it needed an operation.

        **The credit window is bounded.** A ticket from three months ago is not a deposit, and
        `creditWithinDays` says how long the offer stands.
      tags: [orders]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetProductId]
              properties:
                targetProductId: { type: string, format: uuid }
                creditWithinDays: { type: integer, default: 30 }
                startFrom: { type: string, format: date, nullable: true }
      responses:
        '200':
          description: Converted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /guest-credit-accounts:
    post:
      operationId: openGuestCreditAccount
      summary: A credit limit for an individual booking ahead
      description: >
        BL-051, 1.3.51. **`orders.CreditPosition` is B2B only** — a partner with net terms. The
        requirement puts a 25,000 AED limit on an **individual** who books ahead and settles X days
        before.

        **Extending B2B credit to a guest is the same mechanism and a different risk.** A partner is
        a company with a contract; a guest is a person with a phone number, so **`requiresApproval`
        defaults true and the limit is per guest rather than per tier.**

        Where a venue does not want this, the answer is not to open accounts — the model does not
        force it on anybody.
      tags: [orders]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-permission-escalated: ORDER_DISCOUNT
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, creditLimit]
              properties:
                subjectId: { type: string, format: uuid }
                creditLimit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                settlementDaysBeforeVisit: { type: integer, default: 7 }
                requiresApproval: { type: boolean, default: true }
      responses:
        '201':
          description: Opened
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /orders/{orderId}/split:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: splitOrder
      summary: Break one order into independent orders
      description: >
        BL-089. **A group that booked together and now pays separately**, or a corporate booking
        being invoiced per department.

        **Payments follow the lines they paid for.** A split that leaves one payment against two
        orders is a reconciliation nobody can do, so a partly-paid order refuses to split until the
        payment is allocated.
      tags: [orders]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groups]
              properties:
                groups:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    properties:
                      lineIds: { type: array, items: { type: string, format: uuid } }
                      subjectId: { type: string, format: uuid, nullable: true }
      responses:
        '200':
          description: Split
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }

  /entitlements/{entitlementId}/reissue:
    parameters:
      - name: entitlementId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reissueEntitlement
      summary: Zero-value reissue of an expired entitlement for a later date
      description: >
        BL-084. **A goodwill act with no money in it**, and treating it as a refund plus a sale puts
        two transactions through the ledger for a gesture that moved nothing.

        Voids the old, issues the new. **The reason is recorded and the original is traceable**,
        because a reissue with no audit is indistinguishable from a ticket appearing from nowhere.
      tags: [orders]
      x-ticvai-permission: ORDER_EXCHANGE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [venueClosure, weather, goodwill, systemError, medicalIssue, bereavement] }
                validFrom: { type: string, format: date, nullable: true }
                note: { type: string, nullable: true }
      responses:
        '201':
          description: Reissued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /entitlements/{entitlementId}/share:
    parameters:
      - name: entitlementId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: shareEntitlement
      summary: Let somebody else use this, without giving it away
      description: >
        BL-014. **Transfer is contracted and sharing is not, and they are different acts.** A
        transfer changes the holder; a share lets a second person present the same entitlement while
        the first still owns it.

        **The owner can revoke; the recipient cannot transfer on.** That asymmetry is the whole
        point — a shared family pass should not become a resale chain.

        Governed by `EntitlementTemplate.canShareMedia`, which already exists and had nothing behind
        it.
      tags: [orders]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toSubjectId]
              properties:
                toSubjectId: { type: string, format: uuid }
                validUntil: { type: string, format: date-time, nullable: true }
      responses:
        '200':
          description: Shared
          content:
            application/json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /wallet-passes:
    post:
      operationId: issueWalletPass
      x-ticvai-consumed-by:
        - "P02 GST-018 Add to Calendar / Reminders"
      summary: Generate an Apple or Google wallet pass
      description: >
        BL-029. **A wallet pass is a live object, not a download.** Its value over a PDF is that it
        updates — a changed gate, a cancelled performance, a time that moved.

        **A pass that cannot be pushed to is a screenshot with better rounding.**
      tags: [orders]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entitlementId, platform]
              properties:
                entitlementId: { type: string, format: uuid }
                platform: { type: string, enum: [apple, google] }
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletPass' }

  /wallet-passes/{passId}/push:
    parameters:
      - name: passId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: pushWalletPassUpdate
      summary: Push a change to every device holding it
      description: >
        **Every registered device, not just the one that asked.** A guest with the pass on a phone
        and a watch is one entitlement and two registrations, and a gate change that reaches one of
        them is worse than one that reaches neither — **they will trust the stale one.**
      tags: [orders]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-audience: [staff, service]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, enum: [gateChange, timeChange, cancellation, upgrade, brandingUpdate] }
      responses:
        '200':
          description: Pushed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletPass' }

  /resale-listings:
    post:
      operationId: createResaleListing
      summary: List an entitlement for resale
      description: >
        BL-060. **A resale is a transfer with money attached, and the venue stays in the middle** —
        the seller's entitlement is voided and a new one issued to the buyer, so **the ticket that
        admits is always one the venue issued.** That is what stops a screenshot at the gate.

        Refuses where the entitlement is partly consumed, name-bound, or past its resale window.
      tags: [orders]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResaleListing' }
      responses:
        '201':
          description: Listed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResaleListing' }
        '409':
          description: >
            Not resellable, and the reason says which — **partly consumed, name-bound, or outside
            the resale window** are three different conversations with the seller.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /orders/{orderId}/upgrade-quote:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: quoteUpgrade
      summary: What an upgrade costs, pro-rata
      description: >
        BL-092. **`proRataListPrice` splits a bundle's discount across components and `prorate` on a
        subscription is time-based against a plan** — neither computes the price of moving a ticket
        from one product to another.

        **The unused portion is the credit**, and what counts as unused depends on the entitlement:
        an unused day of an annual pass, an unadmitted entry of a multi-visit, a performance not yet
        attended.

        **Quotes without applying.** An upgrade a guest declines should not have moved anything, and
        a price shown before payment is a price the venue is held to.
      tags: [orders]
      x-ticvai-permission: ORDER_MODIFY
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entitlementId, targetProductId]
              properties:
                entitlementId: { type: string, format: uuid }
                targetProductId: { type: string, format: uuid }
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentValue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                  unusedCredit: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                  targetPrice: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                  amountDue: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                  basis:
                    type: string
                    enum: [unusedDays, unusedEntries, unattendedPerformances, flat]
                    description: >
                      **How the credit was computed, returned with the quote.** A guest disputing an
                      upgrade price is disputing the basis, and an operator who cannot see it cannot
                      answer.

  /ticket-templates/{templateId}/proof:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: printTicketProof
      summary: Print a sample without selling anything
      description: >
        2.16.6. **Artwork is checked by looking at it, and the only way to look at it was to sell
        something.**

        Marked as a proof on the artefact itself — **a proof that can be mistaken for a ticket is a
        ticket**, and one left on a counter will be presented at a gate.
      tags: [orders]
      x-ticvai-permission: ORDER_REPRINT
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sampleProductId: { type: string, format: uuid, nullable: true }
                locale: { type: string, nullable: true }
      responses:
        '200':
          description: Proof
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /chargebacks:
    get:
      operationId: listChargebacks
      summary: Open disputes, by deadline
      description: >
        **Sorted by `evidenceDueBy`, not by date received.** A case received yesterday with two days
        left outranks one received last week with twelve.
      tags: [orders]
      x-ticvai-permission: ORDER_REFUND_APPROVE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Chargebacks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Chargeback' }

  /chargebacks/{chargebackId}/respond:
    parameters:
      - name: chargebackId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: respondToChargeback
      summary: Submit evidence, or accept the loss
      description: >
        **Accepting is a legitimate outcome and is recorded as a decision.** A 40 AED case with a
        30 AED fee and two hours of work is one a venue should be able to concede deliberately
        rather than by forgetting.

        Evidence is assembled from what the platform already holds — **the order, the scan that
        admitted them, the terms accepted.** A venue typing this by hand is a venue answering late.
      tags: [orders]
      x-ticvai-permission: ORDER_REFUND_APPROVE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [represent, accept] }
                evidence:
                  type: array
                  items:
                    type: object
                    properties:
                      kind: { type: string }
                      reference: { type: string }
                note: { type: string, nullable: true }
      responses:
        '200':
          description: Responded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Chargeback' }

  /payment-providers:
    get:
      operationId: listPaymentProviders
      summary: Gateways configured for this scope
      tags: [orders]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PaymentProvider' }
    put:
      operationId: setPaymentProvider
      summary: Configure a gateway and its routing
      description: >
        CF-131. **Network International and Stripe for Phase 1** — two gateways, which is the number
        that makes routing a real question rather than a future one.

        **The credential goes to the vault and never to the database.** `credentialRef` is what is
        stored, following the rule ADR-0020 set for AI providers and applied here: **no surface ever
        holds a provider key.**
      tags: [orders]
      x-ticvai-permission: TENANT_CONFIGURE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-config-scope: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentProvider' }
      responses:
        '200':
          description: Configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentProvider' }

  /payment-tokens:
    get:
      operationId: listPaymentTokens
      summary: A guest's saved payment methods
      description: >
        **Masked, always.** The last four digits and the brand — enough to choose between two saved
        cards and not enough to use one.
      tags: [orders]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PaymentToken' }
    post:
      operationId: storePaymentToken
      summary: Save a payment method for future use
      description: >
        BL-116. **The keystone.** Recurring membership billing, wallet auto-reload, one-click
        checkout and payment links all wait on this, and none could be designed until it existed.

        **The card never reaches the platform.** The provider tokenises and returns a reference,
        which is what keeps PCI scope where it belongs.

        **Requires its own consent purpose.** Storing a card for future use is not the same act as
        paying now, and a token taken without it is a card kept on a guest's behalf that they never
        agreed to.
      tags: [orders]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, providerToken, consentPurposeId]
              properties:
                providerId: { type: string, format: uuid }
                providerToken: { type: string, format: password }
                consentPurposeId: { type: string, format: uuid }
                setDefault: { type: boolean, default: false }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentToken' }

  /payment-links:
    post:
      operationId: createPaymentLink
      summary: Send a guest a link to pay later
      description: >
        BL-072. **A booking taken at POS cannot currently be paid later by the guest**, so a phone
        booking either takes a card over the phone or is not taken.

        Expires, because an unpaid link holding inventory is inventory nobody can sell — **the
        expiry releases the hold, not just the link.**
      tags: [orders]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, expiresAt]
              properties:
                orderId: { type: string, format: uuid }
                expiresAt: { type: string, format: date-time }
                channel: { type: string, enum: [email, sms, whatsapp] }
                releaseHoldOnExpiry: { type: boolean, default: true }
      responses:
        '201':
          description: Link created and sent
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /invitations:
    post:
      operationId: issueInvitation
      summary: Issue a complimentary entitlement, with no payment expected
      description: >
        8.1.3 to 8.1.5. **A complimentary ticket is not a 100% discount** — a discount runs through
        the order path and produces a zero-value sale; an invitation never enters it. **No payment
        is expected, so nothing waits for one.**

        Three requirements and one operation, because they are one act: **issue it, record who
        offered it, and refuse where the issuer's profile does not allow it.**

        `x-ticvai-permission-escalated` gates issuance above the configured value. **8.1.5 asks for
        restriction by profile, and an unbounded comp is how a venue gives away a season** — a host
        with a ten-ticket allowance and a general manager with none are different people.

        **Recognised at issue, not at admission.** An invitation has no revenue to defer, so the
        entitlement is issued and the accounting is a marketing cost rather than a deferral.
      tags: [orders]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-permission-escalated: ORDER_DISCOUNT
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, quantity, reason, offeredByPrincipalId]
              properties:
                productId: { type: string, format: uuid }
                performanceId: { type: string, format: uuid, nullable: true }
                quantity: { type: integer, minimum: 1 }
                reason:
                  type: string
                  enum: [hosting, media, sponsor, staff, compensation, community, trade]
                  description: >
                    **Why, in a closed set.** A free-text reason is a reason nobody can report on,
                    and 8.1.2's no-show reporting has a sibling question: how many comps went out
                    and to whom.
                offeredByPrincipalId:
                  type: string
                  format: uuid
                  description: >
                    8.1.4. **Who offered it, recorded on the invitation rather than inferred from
                    who pressed the button** — a host's allocation issued by a box-office clerk is
                    the host's comp, and the allowance is the host's to spend.
                recipientName: { type: string, nullable: true }
                recipientEmail: { type: string, format: email, nullable: true }
                costCenterId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Which budget carries it. Comps are a cost, not an absence of revenue.
      responses:
        '201':
          description: Issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '403':
          description: >
            8.1.5. **The issuer's profile does not permit this**, or their allowance is spent. The
            reason says which, because *"not permitted"* on a host who has an allowance is a
            support call.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /invitations/allowances:
    get:
      operationId: listInvitationAllowances
      summary: Who may issue comps, and how many are left
      description: >
        8.1.5. **The allowance is the control.** Without it, restriction by profile is a yes/no on
        an unbounded right, which is not a restriction.
      tags: [orders]
      x-ticvai-permission: ORDER_VIEW
      x-ticvai-audience: [staff]
      x-ticvai-scope-level: venue
      x-ticvai-read-routing: replica
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Allowances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InvitationAllowance' }

  /stored-value/authorisations:
    post:
      operationId: authoriseStoredValue
      x-ticvai-consumed-by:
        - "P08 BO-097 Check Out & Check In"
      summary: Hold a balance on any stored-value instrument
      description: >
        CF-126. **`authoriseWalletSpend` did this for the retail wallet and for nothing else**, so a
        guest with 200 game credits starting a play the machine then failed had no held balance —
        the credits were either taken or not, with no third state.

        Works against a wallet, a gift card, a game card, a voucher, a loyalty position or a prepaid
        entitlement. **The instruments stay distinct; the spend mechanism is shared.**

        Refuses where the balance is insufficient **after existing holds**, which is what stops the
        same credits being committed twice.
      tags: [orders]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-guest-callable: true
      x-ticvai-audience: [staff, guest, device]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, instrumentId, amount]
              properties:
                kind: { $ref: '../shared/common.yaml#/components/schemas/StoredValueKind' }
                instrumentId: { type: string, format: uuid }
                amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
                reference: { type: string }
                holdSeconds:
                  type: integer
                  default: 300
                  description: >
                    **An arcade play is seconds and a table tab is hours.** Held balance is balance
                    a guest cannot spend elsewhere, so the window belongs to the caller.
      responses:
        '201':
          description: Held
          content:
            application/json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/StoredValueAuthorisation' }
        '409':
          description: >
            Insufficient balance after existing holds. **The reason says which**, because
            *"insufficient funds"* on a card the guest just topped up is a support call.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /stored-value/authorisations/{authorisationId}/capture:
    parameters:
      - name: authorisationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: captureStoredValue
      summary: Take some or all of a held balance
      description: >
        Partial capture is the normal case, not the exception — **a tab authorised at 200 and
        settled at 140**, or an arcade play that cost less than the hold.

        The remainder stays held until released or expired.
      tags: [orders]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-audience: [staff, device]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
      responses:
        '200':
          description: Captured
          content:
            application/json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/StoredValueAuthorisation' }

  /stored-value/authorisations/{authorisationId}/release:
    parameters:
      - name: authorisationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: releaseStoredValue
      x-ticvai-consumed-by:
        - "P08 BO-097 Check Out & Check In"
      summary: Give a hold back
      description: >
        The play failed, the guest left, the tab closed short. **Released holds return immediately**
        — and expiry releases automatically, because a hold nobody releases is a guest whose balance
        is short with no explanation.
      tags: [orders]
      x-ticvai-permission: ORDER_CREATE
      x-ticvai-audience: [staff, device]
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/StoredValueAuthorisation' }

  /carts/{cartId}:
    parameters:
      - name: cartId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getCart
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
        - "P01 WEB-014 Payment Link Landing"
        - "P02 GST-009 Review & Payment"
        - "P02 GST-032 AI Concierge – Chat"
        - "P02 GST-041 Checkout Entry"
        - "P02 GST-053 Build Your Own Itinerary"
        - "P05 KSK-006 Review"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience: [guest, partner]
      summary: The cart, priced and checked, right now
      description: >
        2.9.2. **Re-prices and re-checks on every read**, because a cart is a claim about the
        future and the future moves. Availability, promotions and lease expiry are all live.

        Returns the conflicts (2.9.5) and the leases with their remaining time, so the interface
        can say *"your seats are held for 6 minutes"* rather than discovering it at checkout.
      tags: [cart]
      x-ticvai-permission: null   # the cart's own token or the guest who owns it
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: primary
      responses:
        '200':
          description: The cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '410':
          description: >
            Expired. **Distinct from not found** — a guest returning to a link needs to know
            their cart existed and lapsed, not that it never was.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

    delete:
      operationId: abandonCart
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
      x-ticvai-audience: [guest]
      summary: Empty it deliberately
      description: >
        **Releases every lease immediately** rather than waiting for expiry. A guest who has
        decided not to buy should not hold capacity for another twenty minutes.

        Distinct from expiry: this is a decision, and the recovery campaign must not chase
        someone who said no (22.3.6).
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Abandoned and leases released

  /carts/{cartId}/lines:
    parameters:
      - name: cartId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: addCartLine
      x-ticvai-consumed-by:
        - "P01 WEB-008 Add-ons & Upsell"
        - "P01 WEB-010 Shopping Cart"
        - "P01 WEB-033 Shop"
        - "P02 GST-032 AI Concierge – Chat"
        - "P02 GST-048 Upsell / Cross-Sell"
        - "P02 GST-050 Resource Booking – Cabana"
        - "P02 GST-053 Build Your Own Itinerary"
        - "P02 GST-056 Bundle Package"
        - "P05 KSK-006 Review"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience: [guest, partner]
      summary: Add something
      description: >
        2.9.4. **Acquiring the lease is the whole reason this is a server operation.** A
        capacity-bound product added to a cart reserves capacity for a configured window, and a
        cart held in a browser cannot reserve anything.

        **Refused rather than added where capacity has gone.** A line added optimistically and
        removed at checkout is a guest who thinks they bought something.

        Returns the cart with any conflicts the addition created (2.9.5) — golf at 13:00 already
        in the cart and karting at 13:00 being added is a prompt, not a refusal, because a party
        of four may legitimately split.
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCartLineRequest' }
      responses:
        '200':
          description: Added, and the cart re-priced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409':
          description: >
            No capacity, or the product is not sellable on this channel. **The reason is
            specific** — sold out for this session reads differently from sold out for the day.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /carts/{cartId}/lines/{lineId}:
    parameters:
      - name: cartId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: lineId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateCartLine
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience: [guest, partner]
      summary: Change a quantity
      description: >
        Increasing extends the lease and may fail on capacity; decreasing releases part of it.
        **Releasing immediately matters** — a guest reducing from six to two should return four
        seats to sale now, not in twenty minutes.
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409':
          description: Not enough capacity to increase
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

    delete:
      operationId: removeCartLine
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience: [guest, partner]
      summary: Take something out
      description: Releases its lease immediately.
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Removed, and the cart re-priced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  /carts/{cartId}/extend:
    parameters:
      - name: cartId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: extendCart
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
      x-ticvai-audience: [guest]
      summary: Give the guest more time
      description: >
        Extends every lease in the cart. **Capped, and the cap is configuration** — an
        indefinitely extendable hold is capacity permanently removed from sale by someone who
        left the tab open.

        Offered once, typically, and the interface should say it is the last extension rather
        than letting a guest discover the cap by hitting it.
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Extended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '409':
          description: Extension cap reached, or a lease could not be extended because the capacity has gone
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /carts/{cartId}/claim:
    parameters:
      - name: cartId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: claimCart
      x-ticvai-consumed-by:
        - "P01 WEB-016 Login / Register"
      x-ticvai-audience: [guest]
      summary: Attach an anonymous cart to a guest
      description: >
        2.1.31. **The operation that makes cross-channel work.** A guest who built a cart
        anonymously and then signs in keeps it; a guest who signs in on a laptop finds the cart
        they started on their phone.

        Where the guest already has a cart, the two **merge rather than one replacing the
        other** — losing a cart at the moment of signing in is the worst possible time to lose
        one. Lines that cannot be re-leased are reported rather than dropped silently.
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Claimed, and merged where the guest already had one
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartMergeResult' }

  /carts/{cartId}/checkout:
    parameters:
      - name: cartId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: checkoutCart
      x-ticvai-consumed-by:
        - "P01 WEB-010 Shopping Cart"
        - "P01 WEB-014 Payment Link Landing"
        - "P02 GST-009 Review & Payment"
        - "P02 GST-032 AI Concierge – Chat"
        - "P02 GST-041 Checkout Entry"
        - "P05 KSK-006 Review"
        - "P10 PTR-010 Cart & Quote"
      x-ticvai-audience: [guest, partner]
      summary: Turn the cart into an order
      description: >
        **Transfers the leases to the order rather than releasing and re-acquiring them.**
        Releasing first would let another guest take the capacity between the two calls, which
        is the failure that makes a checkout feel unreliable at exactly the wrong moment.

        The cart is retained, not deleted — a checkout that fails at payment must be resumable,
        and a guest whose card was declined should still have their seats.

        **One cart, one order, one receipt** across ticketing, F&B and retail (14 August).
      tags: [cart]
      x-ticvai-permission: null
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subjectId: { type: string, format: uuid }
                attendees:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '201':
          description: An order, pending payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409':
          description: >
            A lease expired between the last read and checkout. **Names which line**, so the
            guest loses one thing rather than the cart.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /carts/abandoned:
    get:
      operationId: listAbandonedCarts
      x-ticvai-audience: [staff]
      summary: Carts that lapsed without checking out
      description: >
        22.3.6 and 2.6.45. Feeds recovery campaigns.

        **Excludes carts abandoned deliberately.** A guest who emptied their cart said no, and
        chasing them is the difference between a reminder and a nuisance.
      tags: [cart]
      x-ticvai-permission: MARKETING_MANAGE
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      x-ticvai-read-routing: analytical
      parameters:
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: minValue
          in: query
          description: Recovery is worth more on a large cart than a small one.
          schema: { type: number }
      responses:
        '200':
          description: Abandoned carts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AbandonedCart' }

  /payments/{paymentId}/void:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: voidPayment
      x-ticvai-audience: [staff]
      summary: Release an authorisation before it is captured
      description: >
        **Cheaper and cleaner than a refund, and the guest never sees a charge.** An authorisation
        released the same day usually leaves no trace on a statement; a capture followed by a
        refund leaves two lines and a phone call.

        Only valid before capture. **A captured payment is refunded, not voided** — the money has
        moved and pretending otherwise loses the audit trail.
      tags: [orders]
      x-ticvai-permission: PAYMENT_VOID
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [guestAbandoned, cashierError, priceCorrection, duplicateAuthorisation, systemError]
                note: { type: string, maxLength: 300 }
      responses:
        '200':
          description: Voided
