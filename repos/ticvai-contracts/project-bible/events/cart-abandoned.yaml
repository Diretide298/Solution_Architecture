# cart.abandoned v1 — published by orders
# Checked by tools/check-states.py.

name: cart.abandoned
version: 1
publisher: orders
description: A cart lapsed without checking out.
aggregate: cart
emittedWhen: CartStatus active or expiring to expired
payload:
- field: cartId
  type: uuid
- field: token
  type: string
  notes: How a recovery link returns the guest to it
- field: subjectId
  type: uuid
  notes: Null where the cart was never claimed
- field: hasContactPoint
  type: boolean
  notes: '**An anonymous cart with no email cannot be recovered.** Worth carrying, because it sizes
    what an earlier sign-in prompt would be worth'
- field: venueId
  type: uuid
- field: lineCount
  type: integer
- field: value
  type: Money
  notes: Recovery is worth more on a large cart
- field: topProductName
  type: string
  notes: So a reminder can name what they left
- field: abandonedAt
  type: timestamp
consumers:
- context: marketing
  purpose: Recovery campaign (22.3.6, 2.6.45)
  idempotencyKey: cartId
  onFailure: retry
  isCritical: false
- context: catalogue
  purpose: Capacity returned to sale
  idempotencyKey: cartId
  onFailure: retryThenDeadLetter
  isCritical: true
- context: reporting
  purpose: Abandonment rate by channel and product
  idempotencyKey: cartId
  onFailure: retry
  isCritical: false
retention: 90 days, with the recovery window. Beyond that it is a reporting aggregate, not a cart
notes: '**Fires on expiry, not on `abandonCart`.** A guest who emptied their cart deliberately said
  no, and a recovery campaign that chases them is the difference between a reminder and a nuisance.


  The catalogue consumer is critical because it returns capacity to sale. A lapsed cart nobody released
  is a sold-out session with nothing sold.'
