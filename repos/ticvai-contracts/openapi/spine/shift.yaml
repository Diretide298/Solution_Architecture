openapi: 3.1.0
info:
  title: TICVAI Shift & Till
  version: 1.0.0
  x-ticvai-screen-count: 0
  x-ticvai-tier: spine
  x-ticvai-module: "2 — Ticketing Sales (cash handling)"
  x-ticvai-capabilities: [C01]
  x-ticvai-platforms:
    - "P04 POS"
    - "P08 Venue Back Office"
  description: >
    ## What this contract covers

    **Cash reconciles to a drawer and a person.**

    | | |
    |---|---|
    | **Tier** | spine |
    | **Matrix domain** | 2 — Ticketing Sales (cash handling) |
    | **Capabilities** | C01 |
    | **Consumed by** | P04 POS · P08 Venue Back Office |

    ## How to read this file

    **This file is a contract.** It is hand-authored and it is the source of truth for one
    bounded context: server code, client code and mock servers are generated from it, never
    the other way round. If a field is not here, it does not exist.

    **Contracts are split into two tiers.**

    - **Spine** — the eight contexts everything else depends on: tenancy, identity,
      catalogue, orders, shift, access, finance, cross-cell. Frozen first. A change here
      requires a formal change request, because every satellite has pinned against it.
    - **Satellite** — a domain that builds on the spine and can move independently.
      Cheaper to change.

    **`paths` are operations.** Each one declares four TICVAI extensions, and Redocly
    rejects any that does not:

    | Extension | Answers |
    |---|---|
    | `x-ticvai-permission` | Which permission the caller needs. From one enum in `shared/permissions.yaml` — never hand-typed |
    | `x-ticvai-scope-level` | Where in the seven-level hierarchy that permission must be held |
    | `x-ticvai-offline-capable` | Whether a disconnected terminal may queue this |
    | `x-ticvai-conflict-policy` | How a replayed operation resolves — `append`, `serverWins`, `manual` |

    Where `x-ticvai-permission` is null, one of these says why: `x-ticvai-auth: service`
    (cell-to-cell), `x-ticvai-self-scoped` (acts only on the caller's own resources), or
    `security: []` (genuinely public).

    **`components.schemas` are API schemas — the shape of data on the wire.** They are not
    database tables. One API schema may become three columns (`Money`) or five tables
    (`Order`); some have no table at all (`ValidationResult`, `TrialBalance`). Roughly 70%
    of the DDL derives from these, and the rest — partitioning, RLS, the PII split — is
    storage design that lives in the migration scripts.

    **Where a schema maps to storage, `x-ticvai-persistence` says so.** The value is a table
    name, a list of tables, or `none` with a reason. It is documentation of the mapping, not
    a generator input — the DDL lives in versioned SQL migrations, because partitioning, RLS
    policies, `ltree` indexes and partial indexes have no expression in OpenAPI.

    **`security` arrays hold OAuth scopes.** Empty means "this scheme, no scopes" — for
    bearer tokens there is nothing to list. Empty is not the same as absent: absent means
    unauthenticated.


    ## This context

    Shift lifecycle and cash handling at a workstation. Capability C01.

    Settled positions this encodes:

    - One user per workstation at a time. A user must log out or SUSPEND their shift before
      another logs in. Suspension is a first-class state, not a workaround — it exists so a
      break can be covered without a blind close-out.
    - Blind close-out: the operator counts without seeing the expected figure.
    - Cash lift: traced mid-shift removal from an open float, leaving the shift open.
    - Supervisor approval is configurable on close AND on open.
    - Over/short beyond a configured threshold requires explicit acceptance.

    Money carries an explicit scale throughout. Denomination counts are integers of a
    named denomination, never a derived total the client computed.

servers:
  - url: https://{cellHost}/api/v1
    variables:
      cellHost:
        default: cell.ticvai.local

security:
  - bearerAuth: []

tags:
  - name: shift
  - name: cash

paths:
  /shifts:
    get:
      operationId: listShifts
      x-ticvai-read-routing: primary   # open-shift state gates workstation actions
      summary: List shifts
      tags: [shift]
      x-ticvai-permission: REPORT_VIEW_WORKSTATION
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: serverWins
      parameters:
        - name: workstationId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ShiftStatus' }
        - name: openedFrom
          in: query
          schema: { type: string, format: date-time }
        - name: openedTo
          in: query
          schema: { type: string, format: date-time }
        - $ref: '../shared/common.yaml#/components/parameters/PageSize'
        - $ref: '../shared/common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: Shifts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '../shared/common.yaml#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Shift' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

    post:
      operationId: openShift
      summary: Open a shift
      description: >
        Fails if another shift is already open on this workstation. Where the venue is
        configured to require approval on open, the shift is created in
        `pendingApproval` and cannot transact until approved.
      tags: [shift]
      x-ticvai-permission: SHIFT_OPEN
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenShiftRequest' }
      responses:
        '201':
          description: Opened, or awaiting approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
          headers:
            X-Consistency-Token:
              schema: { type: string }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          description: >
            A shift is already open on this workstation, or a required device is absent.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /shifts/current:
    get:
      operationId: getCurrentShift
      x-ticvai-read-routing: primary   # cash position drives close-out
      summary: The open or suspended shift on the session's workstation
      tags: [shift]
      x-ticvai-permission: SHIFT_OPEN
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Current shift
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '404':
          description: No shift open on this workstation
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /shifts/{shiftId}:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: getShift
      x-ticvai-read-routing: primary
      summary: Read a shift
      tags: [shift]
      x-ticvai-permission: REPORT_VIEW_WORKSTATION
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Shift
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../shared/common.yaml#/components/responses/NotFound' }

  /shifts/{shiftId}/suspend:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: suspendShift
      summary: Suspend a shift so another user can log in
      description: >
        The break mechanism. The float and the shift stay intact; the workstation becomes
        available to another principal. Resuming requires the original principal, or a
        principal holding SHIFT_CLOSE_OTHER to close it out instead.
      tags: [shift]
      x-ticvai-permission: SHIFT_SUSPEND
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          description: Shift is not in a suspendable state
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /shifts/{shiftId}/resume:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: resumeShift
      summary: Resume a suspended shift
      tags: [shift]
      x-ticvai-permission: SHIFT_OPEN
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Resumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '403':
          description: >
            Not the principal who suspended it, and the caller does not hold
            SHIFT_CLOSE_OTHER.
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }
        '409':
          description: Another shift is now open on this workstation
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /shifts/{shiftId}/close:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: closeShift
      summary: Blind close-out
      description: >
        The operator submits a counted denomination breakdown. The expected figure is not
        returned before submission — that is what makes the count blind.

        The response carries the variance. Where it exceeds the configured threshold, the
        shift moves to `pendingVariance` and requires OVERSHORT_ACCEPT to finalise.

        Closing a shift opened by another principal requires SHIFT_CLOSE_OTHER.
      tags: [shift]
      x-ticvai-permission: SHIFT_CLOSE
      x-ticvai-scope-level: workstation
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseShiftRequest' }
      responses:
        '200':
          description: Closed, or held pending variance acceptance or approval
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftCloseResult' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          description: Shift already closed, or open orders remain
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

  /shifts/{shiftId}/accept-variance:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    post:
      operationId: acceptShiftVariance
      summary: Accept an over/short beyond the threshold
      tags: [shift]
      x-ticvai-permission: OVERSHORT_ACCEPT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: false
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: Retained for audit. The accepting principal is recorded.
      responses:
        '200':
          description: Accepted and finalised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shift' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

  /shifts/{shiftId}/cash-movements:
    parameters:
      - name: shiftId
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    get:
      operationId: listCashMovements
      x-ticvai-read-routing: primary
      summary: Lifts, adds and the opening float
      tags: [cash]
      x-ticvai-permission: REPORT_VIEW_WORKSTATION
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: serverWins
      responses:
        '200':
          description: Movements in sequence
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CashMovement' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }

    post:
      operationId: createCashMovement
      summary: Record a cash lift or add
      description: >
        A lift removes cash from an open float mid-shift without closing it — the supervisor
        takes the excess to the safe and the cashier keeps trading. Both directions are
        traced, both record the authorising principal, and both adjust the expected figure
        used at close.
      tags: [cash]
      x-ticvai-permission: CASH_LIFT
      x-ticvai-scope-level: venue
      x-ticvai-offline-capable: true
      x-ticvai-conflict-policy: append
      parameters:
        - $ref: '../shared/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCashMovementRequest' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CashMovement' }
        '400': { $ref: '../shared/common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '../shared/common.yaml#/components/responses/Forbidden' }
        '409':
          description: Shift is not open, or the lift exceeds the counted float
          content:
            application/problem+json:
              schema: { $ref: '../shared/common.yaml#/components/schemas/Problem' }

components:
  schemas:
    ShiftStatus:
      type: string
      enum:
        - pendingApproval    # awaiting SHIFT_APPROVE_OPEN where configured
        - open
        - suspended          # break cover; float intact, workstation released
        - pendingVariance    # counted, over/short beyond threshold
        - pendingClosure     # awaiting SHIFT_APPROVE_CLOSE where configured
        - closed
        - autoClosed         # closed by the inactivity job, supervisor notified

    Denomination:
      x-ticvai-persistence: "none — reference data in region_settings"
      type: object
      required: [value, count]
      properties:
        value:
          $ref: '../shared/common.yaml#/components/schemas/Money'
        count:
          type: integer
          minimum: 0
          description: >
            Units of this denomination. The server computes the total — a client-computed
            total cannot be reconciled against the count.

    DenominationCount:
      x-ticvai-persistence: "orders.cash_count_line"
      type: array
      items: { $ref: '#/components/schemas/Denomination' }
      minItems: 1

    OpenShiftRequest:
      type: object
      required: [workstationId, openingFloat]
      properties:
        workstationId: { type: string, format: uuid }
        openingFloat: { $ref: '#/components/schemas/DenominationCount' }
        depositBoxCode:
          type: string
          maxLength: 64
          description: >
            Physical container assigned to this shift. Required where the venue configures
            deposit box allocation.
        bagNumber:
          type: string
          maxLength: 64
          description: Required where the venue configures bag numbers as mandatory.
        recordedAt:
          type: string
          format: date-time
          description: >
            When the device recorded it. Differs from server receipt time for shifts opened
            offline.

    CloseShiftRequest:
      type: object
      required: [countedCash, recordedAt]
      properties:
        countedCash: { $ref: '#/components/schemas/DenominationCount' }
        nonCashDeclared:
          type: array
          description: >
            Declared totals per non-cash tender, for reconciliation against captured
            payments.
          items:
            type: object
            required: [tender, amount]
            properties:
              tender: { type: string }
              amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        notes: { type: string, maxLength: 1000 }
        releaseHeldLeases:
          type: boolean
          default: true
          description: >
            Return unsold inventory leases held by this workstation (ADR-0013 C103). Closing
            without releasing strands capacity until TTL expiry, which is visible at a gate
            during peak.
        recordedAt: { type: string, format: date-time }

    ShiftCloseResult:
      x-ticvai-persistence: "none — computed"
      type: object
      required: [shift, expectedCash, countedCash, variance, requiresAcceptance]
      properties:
        shift: { $ref: '#/components/schemas/Shift' }
        expectedCash:
          $ref: '../shared/common.yaml#/components/schemas/Money'
        countedCash:
          $ref: '../shared/common.yaml#/components/schemas/Money'
        variance:
          allOf:
            - $ref: '../shared/common.yaml#/components/schemas/Money'
          description: Counted minus expected. Negative is short.
        requiresAcceptance:
          type: boolean
          description: True when the variance exceeds the configured threshold.
        nonCashVariances:
          type: array
          items:
            type: object
            required: [tender, declared, captured, variance]
            properties:
              tender: { type: string }
              declared: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              captured: { $ref: '../shared/common.yaml#/components/schemas/Money' }
              variance: { $ref: '../shared/common.yaml#/components/schemas/Money' }

    Shift:
      x-ticvai-persistence: "orders.shift"
      type: object
      required: [id, workstationId, venueId, scopePath, principalId, status, currency, currencyScale, openedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: Client-generated ULID. Also the idempotency key.
        workstationId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        scopePath: { type: string }
        principalId:
          type: string
          format: uuid
          description: Who opened it. Cash reconciles to a person and a drawer.
        principalDisplayName: { type: string }
        status: { $ref: '#/components/schemas/ShiftStatus' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currencyScale: { type: integer, minimum: 0, maximum: 4 }
        depositBoxCode: { type: string, nullable: true }
        bagNumber: { type: string, nullable: true }
        openingFloat: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        salesTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        refundsTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        liftsTotal: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        heldLeaseCount:
          type: integer
          description: >
            Inventory leases currently held by this workstation. Surfaced so an operator
            closing a shift can see what will be returned.
        openedAt: { type: string, format: date-time }
        recordedAt:
          type: string
          format: date-time
          description: When the device recorded the open. Differs from `openedAt` when offline.
        suspendedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        syncedAt:
          type: string
          format: date-time
          nullable: true
          description: Null while the shift has unsynced operations.
        approvals:
          type: array
          items:
            type: object
            required: [kind, principalId, at]
            properties:
              kind:
                type: string
                enum: [open, close, variance]
              principalId: { type: string, format: uuid }
              at: { type: string, format: date-time }
              reason: { type: string }

    CashMovementKind:
      type: string
      enum: [openingFloat, lift, add]

    CreateCashMovementRequest:
      type: object
      required: [id, kind, amount, recordedAt]
      properties:
        id:
          type: string
          pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
          description: Client-generated ULID.
        kind: { $ref: '#/components/schemas/CashMovementKind' }
        amount: { $ref: '../shared/common.yaml#/components/schemas/Money' }
        denominations:
          $ref: '#/components/schemas/DenominationCount'
        reference:
          type: string
          maxLength: 64
          description: Safe drop reference or bag number.
        reason: { type: string, maxLength: 500 }
        recordedAt: { type: string, format: date-time }

    CashMovement:
      x-ticvai-persistence: "orders.cash_movement"
      allOf:
        - $ref: '#/components/schemas/CreateCashMovementRequest'
        - type: object
          required: [shiftId, authorisedByPrincipalId, sequence]
          properties:
            shiftId: { type: string }
            authorisedByPrincipalId:
              type: string
              format: uuid
              description: The principal who authorised the movement, recorded for audit.
            sequence:
              type: integer
              description: Monotonic within the shift. Preserves order across an offline batch.
            syncedAt: { type: string, format: date-time, nullable: true }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
