# P13 — Staff Web — White-Label CMS
#
# Derived from the wireframe board on 14 August. **Purposes and navigation are real;
# components, states and operations are not yet written.** Every screen carries
# wireframe.status drafted so the gap is visible rather than implied.

platform:
  code: P13
  audience: staff
  formFactor: web
  shortName: Staff Web
  name: Staff Web — White-Label CMS
  surface: staffFacing
  runtime: reactWeb
  app: backoffice
  appStatus: scaffolded
  offlineCapable: false
  packages:
  - design-tokens
  - ui
  - api-client
  deployment:
    target: browser, desktop
    distribution: served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell
    storeReview: false
    deviceOwnership: tenant workstation
    networkAssumption: public internet
    releaseCadence: weekly
  screenCount: 20
  wireframeBoard: wireframes/P13 White-Label CMS.dc.html
screens:
