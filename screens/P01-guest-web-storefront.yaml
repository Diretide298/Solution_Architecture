# P01 — Guest Web Storefront (B2C)
#
# WEB-001 to WEB-013 are the purchase path and are fully specified.
# The remainder carry structure and open questions; layout is still to be drawn.
#
# Validated against _schema.yaml; component kinds from _components.yaml.

platform:
  code: P01
  audience: guest
  formFactor: web
  shortName: Guest Web
  name: Guest Web — Storefront
  surface: guestFacing
  runtime: reactWeb
  offlineCapable: false
  themes:
  - light
  directions:
  - ltr
  - rtl
  screenCount: 35
  app: guest-web
  appStatus: scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  deployment:
    target: browser
    distribution: CDN + edge
    bundleUpdate: immediate on deploy
    hosting: static build served from the cell region
    storeReview: false
    deviceOwnership: guest device
    networkAssumption: public internet, unmanaged
    releaseCadence: continuous
  wireframeBoard: wireframes/P01 Guest Web.dc.html
  designReferences:
  - path: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
    note: White Label Builder boards 1 and 2 — brand, app structure, homepage, content and publishing.
  operator: guest
screens:
- id: WEB-001
  name: Home / Landing
  module: Discovery & Browse
  purpose: Show a guest what is on and give them one obvious way to start booking.
  wave: 1
  layout:
    template: dashboard
    regions:
    - name: header
      ref: appHeader
      components:
      - kind: iconButton
        label: Search
      - kind: secondaryButton
        label: Sign in
        notes: Becomes an account menu once authenticated
    - name: contentBody
      components:
      - kind: banner
        bindsTo: TenantAppStatus.maintenanceMessage
        notes: Only when isInMaintenance. Tenant-branded, never a generic error page
      - kind: cardList
        bindsTo: HomepageLayout.sections
        notes: Section order comes from tenant configuration (WLB-011), not from code. A section referencing
          a disabled module must not render at all
  states:
    loading: Section skeletons in configured order. Header renders immediately from cache.
    emptyFirstRun: No sections configured. Shows the tenant contact block rather than a blank page —
      a storefront with nothing on it should still tell a guest how to reach the venue.
    emptyNoResults: TODO — the filter matched nothing. The action widens or clears, never creates.
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Config fetch failed. Falls back to the last cached configuration with a dismissible warning.
      A storefront that will not load because branding is unavailable is worse than an unbranded one.
  wireframe:
    status: drafted
    board: wireframes/P01 Guest Web.dc.html#web-001
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  capability: C79
  apis:
  - operationId: getTenantAppStatus
    purpose: Maintenance check before rendering anything
    trigger: onLoad
    contract: white-label
  - operationId: getTenantConfig
    contract: white-label
    purpose: Full working configuration
    trigger: onLoad
  - operationId: listProducts
    contract: catalogue
    purpose: List products
    trigger: onLoad
  navigation:
    isEntryPoint: true
    exitTo:
    - WEB-002
    - WEB-003
    - WEB-004
    - WEB-016
  accessibility:
    focusOrder: Skip link, then first section heading. Not the carousel.
  implementation:
    app: guest-web
    route: /discovery-and-browse/home-landing
    component: apps/guest-web/src/routes/discovery-and-browse/HomeLandingDashboard.tsx
    status: notStarted
  density: compact
- id: WEB-002
  name: Event & Attraction Listing
  module: Discovery & Browse
  purpose: Browse and filter everything bookable.
  wave: 1
  layout:
    template: list
    regions:
    - name: contentBody
      components:
      - kind: searchField
        label: Search events and attractions
      - kind: multiSelect
        label: Category
      - kind: datePicker
        label: Date
        notes: Format from region settings, not a locale guess
      - kind: cardList
        bindsTo: Product[]
        notes: Cursor pagination. Infinite scroll with an explicit load-more fallback
  states:
    loading: Card skeletons at the current page size.
    emptyFirstRun: No products match. Names the most restrictive filter and offers to clear it — an
      empty state with no action is a dead end.
    emptyNoResults: TODO — the filter matched nothing. The action widens or clears, never creates.
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Retry with filters preserved. Filters are never silently reset.
  wireframe:
    status: drafted
    board: wireframes/P01 Guest Web.dc.html#web-002
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  capability: C79
  navigation:
    entryFrom:
    - WEB-001
    - WEB-003
    exitTo:
    - WEB-001
    - WEB-003
    - WEB-004
  implementation:
    app: guest-web
    route: /discovery-and-browse/event-and-attraction-listing
    component: apps/guest-web/src/routes/discovery-and-browse/EventAndAttractionListingList.tsx
    status: notStarted
  apis:
  - operationId: listProducts
    contract: catalogue
    purpose: List products
    trigger: onLoad
  - operationId: listPerformances
    contract: catalogue
    purpose: List performances of an event
    trigger: onLoad
  - operationId: searchCatalogue
    contract: catalogue
    purpose: Find something by name
    trigger: onLoad
  density: compact
- id: WEB-003
  name: Search Results
  module: Discovery & Browse
  purpose: Find something when the guest does not know what it is called.
  wave: 1
  layout:
    template: list
    regions:
    - name: contentBody
      components:
      - kind: searchField
      - kind: dataTable
  states:
    loading: Results stream in; facets render first
    emptyFirstRun: '**No results is a real answer.** Offers what is on rather than an empty page, because
      a guest who searched for a closed attraction still came to buy something'
    emptyNoResults: TODO — the filter matched nothing. The action widens or clears, never creates.
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Search unavailable. Falls back to browsing the catalogue
  wireframe:
    status: drafted
    board: wireframes/P01 Guest Web.dc.html#web-003
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  capability: C79
  implementation:
    app: guest-web
    route: /discovery-and-browse/search-results
    component: apps/guest-web/src/routes/discovery-and-browse/SearchResultsList.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    exitTo:
    - WEB-001
    - WEB-002
    - WEB-004
    inferred: true
  notes: Purpose derived from the screen name and its operations on 17 August, not from a requirement.
  apis:
  - operationId: searchCatalogue
    contract: catalogue
    purpose: Find something by name
    trigger: onLoad
  - operationId: listProducts
    contract: catalogue
    purpose: List products
    trigger: onLoad
  density: compact
- id: WEB-004
  name: Event / Attraction Detail
  module: Discovery & Browse
  purpose: Decide whether to book this.
  wave: 1
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
        bindsTo: Product
      - kind: banner
        bindsTo: Product.lifecycleState
        notes: Shown only when withdrawn — reachable via a stale link but no longer sellable. A silent
          404 on a shared link is a bad guest experience
    - name: actionBar
      components:
      - kind: primaryButton
        label: Select tickets
        notes: Disabled with a stated reason when not sellable
  states:
    loading: Detail skeleton with the image slot reserved to avoid layout shift.
    emptyFirstRun: Not applicable — a product either exists or the screen is notFound.
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Product unavailable, with a route back to the listing.
  wireframe:
    status: drafted
    board: wireframes/P01 Guest Web.dc.html#web-004
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  capability: C79
  navigation:
    entryFrom:
    - WEB-001
    - WEB-002
    - WEB-003
    exitTo:
    - WEB-001
    - WEB-002
    - WEB-003
    - WEB-005
  implementation:
    app: guest-web
    route: /discovery-and-browse/event-attraction-detail
    component: apps/guest-web/src/routes/discovery-and-browse/EventAttractionDetail.tsx
    status: notStarted
  apis:
  - operationId: getProduct
    contract: catalogue
    purpose: Read a product
    trigger: onLoad
  - operationId: listPerformances
    contract: catalogue
    purpose: List performances of an event
    trigger: onLoad
  density: compact
- id: WEB-005
  name: Ticket Type Selection
  module: Booking & Selection
  purpose: Choose which ticket and how many.
  wave: 1
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: cardList
        bindsTo: ProductVariant[]
        notes: Each row is a variant with a stepper. Price updates live
      - kind: banner
        bindsTo: PromotionEvaluation.rejected
        notes: Shows near-miss offers — "add one more for the family rate". Uses the rejected list,
          which exists precisely so this can be said
    - name: actionBar
      components:
      - kind: primaryButton
        label: Continue
  states:
    loading: Variant rows skeleton.
    emptyFirstRun: No ticket types on sale, with the next on-sale date if known.
    emptyNoResults: TODO — the filter matched nothing. The action widens or clears, never creates.
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Pricing unavailable. Continue is blocked rather than showing a stale price.
  wireframe:
    status: drafted
    board: wireframes/P01 Guest Web.dc.html#web-005
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  capability: C80
  navigation:
    entryFrom:
    - WEB-004
    exitTo:
    - WEB-001
    - WEB-006
    - WEB-007
    - WEB-008
    - WEB-010
  implementation:
    app: guest-web
    route: /booking-and-selection/ticket-type-selection
    component: apps/guest-web/src/routes/booking-and-selection/TicketTypeSelectionForm.tsx
    status: notStarted
  apis:
  - operationId: evaluatePromotions
    contract: promotions
    purpose: Evaluate promotions against a cart
    trigger: onAction
  - operationId: listProductVariants
    contract: catalogue
    purpose: List generated variants
    trigger: onLoad
  density: compact
- id: WEB-006
  name: Date & Session Selection
  module: Booking & Selection
  purpose: Pick a date and time that has capacity.
  wave: 1
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: datePicker
        notes: Sold-out dates disabled with a reason on hover, not hidden
      - kind: cardList
        bindsTo: Availability.performances
        notes: Session times with remaining counts. Availability is per channel — a session showing
          sold out here may still have counter allocation, which is correct behaviour and not a defect
    - name: actionBar
      components:
      - kind: primaryButton
        label: Continue
  states:
    loading: Calendar skeleton with the current month reserved.
    emptyFirstRun: No sessions in range, with the next available date offered.
    emptyNoResults: TODO — the filter matched nothing. The action widens or clears, never creates.
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Availability unavailable. Selection blocked — overselling is worse than waiting.
  wireframe:
    status: drafted
    board: wireframes/P01 Guest Web.dc.html#web-006
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  capability: C81
  navigation:
    entryFrom:
    - WEB-005
    exitTo:
    - WEB-001
    - WEB-005
    - WEB-007
    - WEB-008
    - WEB-010
  notes: Availability is read live and never cached beyond a few seconds. A guest selecting a session
    that filled while they were reading is a worse outcome than a slightly slower screen.
  implementation:
    app: guest-web
    route: /booking-and-selection/date-and-session-selection
    component: apps/guest-web/src/routes/booking-and-selection/DateAndSessionSelectionForm.tsx
    status: notStarted
  apis:
  - operationId: getAvailability
    contract: catalogue
    purpose: Live remaining capacity
    trigger: onLoad
  density: compact
- id: WEB-007
  name: Seat Map Selection
  module: Booking & Selection
  purpose: Choose specific seats.
  wave: 2
  layout:
    template: canvas
    regions:
    - name: contentBody
      components:
      - kind: seatMap
        bindsTo: SeatAvailability
      - kind: banner
        notes: Hold countdown, always visible. A selection that expires silently while a guest enters
          card details is the worst outcome in this flow
    - name: contextPanel
      components:
      - kind: cartPanel
        bindsTo: SeatHold
    - name: actionBar
      components:
      - kind: primaryButton
        label: Continue to checkout
  states:
    loading: Map skeleton at the venue's aspect ratio.
    emptyFirstRun: No seats available in the selected category.
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Map unavailable, with the option to continue on best-available instead.
  wireframe:
    status: drafted
    board: wireframes/P01 Guest Web.dc.html#web-007
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  capability: C51
  navigation:
    entryFrom:
    - WEB-006
    exitTo:
    - WEB-001
    - WEB-005
    - WEB-006
    - WEB-008
    - WEB-010
  notes: 'A map with no geometry falls back to category and best-available selection. Availability returns
    renderMode: list, and the screen renders groups rather than a plan. Never refuses the seated flow.'
  implementation:
    app: guest-web
    route: /booking-and-selection/seat-map-selection
    component: apps/guest-web/src/routes/booking-and-selection/SeatMapSelectionCanvas.tsx
    status: notStarted
  apis:
  - operationId: createSeatHold
    contract: seating
    purpose: Hold specific seats
    trigger: onAction
  - operationId: getSeatAvailability
    contract: seating
    purpose: Seat status for a performance
    trigger: onLoad
  density: compact
- id: WEB-008
  name: Add-ons & Upsell
  module: Booking & Selection
  purpose: See add-ons & upsell for this venue.
  wave: 2
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
  states:
    loading: Upsells resolve after the cart is priced
    emptyFirstRun: No add-ons for this product — the step is skipped entirely rather than shown empty
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Upsells unavailable. **The purchase continues** — a failed upsell must never block a sale
  wireframe:
    status: drafted
    board: wireframes/P01 Guest Web.dc.html#web-008
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  capability: C86
  implementation:
    app: guest-web
    route: /booking-and-selection/add-ons-and-upsell
    component: apps/guest-web/src/routes/booking-and-selection/AddOnsAndUpsellDetail.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    inferred: true
    exitTo:
    - WEB-001
    - WEB-005
    - WEB-006
    - WEB-007
  notes: Purpose derived from the screen name and its operations on 17 August, not from a requirement.
  apis:
  - operationId: addCartLine
    contract: orders
    purpose: Add something
    trigger: onAction
  - operationId: listCatalogueBundles
    contract: catalogue
    purpose: List published bundles
    trigger: onLoad
  - operationId: getUpsellSuggestions
    contract: promotions
    purpose: Suggestions for a cart
    trigger: onAction
  density: compact
- id: WEB-009
  name: Wishlist
  module: Booking & Selection
  purpose: Find the right one quickly, and act on it without opening it.
  wave: 3
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
  states:
    loading: Saved items load
    emptyFirstRun: Nothing saved — explains what the list is for
    error: Could not load
  wireframe:
    status: drafted
    board: wireframes/P01 Guest Web.dc.html#web-009
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  capability: C79
  apis:
  - operationId: getWishlist
    purpose: Saved items
    trigger: onLoad
    contract: marketing-crm
  - operationId: addToWishlist
    purpose: Save an item
    trigger: onAction
    contract: marketing-crm
  - operationId: removeFromWishlist
    purpose: Remove a saved item
    trigger: onAction
    contract: marketing-crm
  - operationId: listGuestDevices
    contract: marketing-crm
    purpose: A guest's registered devices
    trigger: onLoad
  - operationId: recordConsent
    contract: marketing-crm
    purpose: Record a consent decision
    trigger: onAction
  - operationId: registerGuestDevice
    contract: marketing-crm
    purpose: Register a device for push
    trigger: onAction
  - operationId: revokeGuestDevice
    contract: marketing-crm
    purpose: Revoke a device registration
    trigger: onAction
  notes: Withdrawn products stay in the list marked unavailable. A guest who saved something and finds
    it silently gone assumes the feature is broken. Purpose derived from the screen name and its operations
    on 17 August, not from a requirement.
  implementation:
    app: guest-web
    route: /booking-and-selection/wishlist
    component: apps/guest-web/src/routes/booking-and-selection/WishlistDetail.tsx
    status: notStarted
  navigation:
    entryFrom:
    - WEB-001
    inferred: true
    exitTo:
    - WEB-001
    - WEB-005
    - WEB-006
    - WEB-007
  density: compact
- id: WEB-010
  name: Shopping Cart
  module: Cart & Checkout
  purpose: Review and confirm what is being bought.
  wave: 1
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: cartPanel
        bindsTo: PromotionEvaluation
      - kind: textField
        label: Promo code
      - kind: banner
        bindsTo: PromotionEvaluation.rejected
        notes: When a code does not apply, say which condition failed. "Expired" and "already used"
          are very different conversations
    - name: actionBar
      components:
      - kind: primaryButton
        label: Checkout
  states:
    loading: Totals skeleton. Line items render immediately from local state.
    emptyFirstRun: Empty cart with a route back to browsing.
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Pricing failed. Checkout blocked rather than proceeding on a stale total.
  wireframe:
    status: drafted
    board: wireframes/P01 Guest Web.dc.html#web-010
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  capability: C02
  apis:
  - operationId: getCart
    contract: orders
    purpose: The cart, priced and checked, right now
    trigger: onLoad
  - operationId: addCartLine
    contract: orders
    purpose: Add something
    trigger: onAction
  - operationId: updateCartLine
    contract: orders
    purpose: Change a quantity
    trigger: onAction
  - operationId: removeCartLine
    contract: orders
    purpose: Take something out
    trigger: onAction
  - operationId: extendCart
    contract: orders
    purpose: Give the guest more time
    trigger: onAction
  - operationId: checkoutCart
    contract: orders
    purpose: Turn the cart into an order
    trigger: onAction
  - operationId: abandonCart
    contract: orders
    purpose: Empty it deliberately
    trigger: onAction
  - operationId: evaluatePromotions
    contract: promotions
    purpose: Evaluate promotions against a cart
    trigger: onAction
  - operationId: getCouponCode
    contract: promotions
    purpose: Look up a code
    trigger: onLoad
  navigation:
    entryFrom:
    - WEB-005
    - WEB-006
    - WEB-007
    - WEB-008
    exitTo:
    - WEB-001
    - WEB-011
    - WEB-012
    - WEB-013
  implementation:
    app: guest-web
    route: /cart-and-checkout/shopping-cart
    component: apps/guest-web/src/routes/cart-and-checkout/ShoppingCartDetail.tsx
    status: notStarted
  density: compact
- id: WEB-011
  name: Guest Details & Attendee Forms
  module: Cart & Checkout
  purpose: Collect who is coming and how to reach them.
  wave: 1
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: textField
        label: Full name
      - kind: textField
        label: Email
      - kind: textField
        label: Mobile
      - kind: detailPanel
        bindsTo: EntitlementTemplate.isNameBound
        notes: Per-attendee fields appear only where the entitlement is name-bound. Most are not — identity
          and entitlement are separate concerns
      - kind: consentBlock
        bindsTo: ConsentPurposeConfig[]
        notes: Marketing consent is opt-in and unticked. Transactional is required for service and is
          presented differently, not as a choice dressed as one
    - name: actionBar
      components:
      - kind: primaryButton
        label: Continue to payment
  states:
    loading: Form renders immediately; prefill populates when it arrives.
    emptyFirstRun: Not applicable.
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Prefill failed. The form still works, entered manually.
  wireframe:
    status: drafted
    board: wireframes/P01 Guest Web.dc.html#web-011
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  capability: C03
  apis:
  - operationId: addToWishlist
    contract: marketing-crm
    purpose: Save an item
    trigger: onAction
  - operationId: getWishlist
    contract: marketing-crm
    purpose: Read a guest's saved items
    trigger: onLoad
  - operationId: listGuestDevices
    contract: marketing-crm
    purpose: A guest's registered devices
    trigger: onLoad
  - operationId: recordConsent
    contract: marketing-crm
    purpose: Record a consent decision
    trigger: onAction
  - operationId: registerGuestDevice
    contract: marketing-crm
    purpose: Register a device for push
    trigger: onAction
  - operationId: removeFromWishlist
    contract: marketing-crm
    purpose: Remove a saved item
    trigger: onAction
  - operationId: revokeGuestDevice
    contract: marketing-crm
    purpose: Revoke a device registration
    trigger: onAction
  - operationId: getGuestProfile
    contract: marketing-crm
    purpose: Read a guest profile
    trigger: onLoad
  - operationId: listConsentPurposes
    contract: marketing-crm
    purpose: Configured consent purposes
    trigger: onLoad
  navigation:
    entryFrom:
    - WEB-010
    exitTo:
    - WEB-001
    - WEB-010
    - WEB-012
    - WEB-013
  accessibility:
    focusOrder: First empty field, not the top of the form.
    announcements: Validation errors announced on blur, not on every keystroke.
  implementation:
    app: guest-web
    route: /cart-and-checkout/guest-details-and-attendee-forms
    component: apps/guest-web/src/routes/cart-and-checkout/GuestDetailsAndAttendeeFormsForm.tsx
    status: notStarted
  density: compact
- id: WEB-012
  name: Checkout — Payment
  module: Cart & Checkout
  purpose: Take payment and create the order.
  wave: 1
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: paymentTerminal
        bindsTo: Payment
      - kind: cartPanel
        notes: Order summary stays visible throughout. Never collapsed behind a link
    - name: actionBar
      components:
      - kind: primaryButton
        label: Pay now
  states:
    loading: Button enters loading and is disabled. Double submission is impossible.
    emptyFirstRun: Not applicable.
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Declined, with the reason where it is safe to show, and a retry that reuses the same idempotency
      key.
  wireframe:
    status: drafted
    board: wireframes/P01 Guest Web.dc.html#web-012
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  capability: C04
  apis:
  - operationId: transferOrderTickets
    contract: orders
    purpose: Transfer tickets to another guest
    trigger: onAction
  - operationId: createOrder
    contract: orders
    purpose: Create an order
    trigger: onAction
  - operationId: createPayment
    contract: orders
    purpose: Take a payment against an order
    trigger: onAction
  navigation:
    entryFrom:
    - WEB-011
    exitTo:
    - WEB-001
    - WEB-010
    - WEB-011
    - WEB-013
  notes: The unknown outcome is the one to build for. A payment taken but never confirmed must offer
    inquiry, not a retry — a retry double-charges and the guest finds out. **Card only, so tender currency
    equals base currency.** A guest paying with a foreign card is converted by their own issuer at their
    own rate — that is not our conversion and is not recorded as one. The displayed comparison price
    (`WEB-035`) and the charged amount are different numbers and the screen says so before the guest
    commits.
  openQuestions:
  - Sandbox credentials for Stripe and Network International are outstanding. The recovery paths cannot
    be tested without them.
  implementation:
    app: guest-web
    route: /cart-and-checkout/checkout-payment
    component: apps/guest-web/src/routes/cart-and-checkout/CheckoutPaymentForm.tsx
    status: notStarted
  density: compact
- id: WEB-013
  name: Order Confirmation
