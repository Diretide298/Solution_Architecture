- id: BO-003
  name: Queue Integration Setup
  module: Queue Management
  purpose: Connect a queue to an on-site system, or leave it on manual entry.
  capability: C05
  wave: 1
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: selectField
        label: Source
        notes: Manual, sensor API, webhook, MQTT, vendor poll, turnstile count, CV camera. Manual is
          the default and a valid end state
      - kind: textField
        label: Endpoint or topic
        notes: Hidden when the source is manual
      - kind: textField
        label: Credential reference
        notes: A key vault reference, never the secret. A secret typed into a form ends up in a screenshot
      - kind: numberField
        label: Expected interval (seconds)
        notes: Drives the went-quiet alarm. Too tight and a duty manager learns to ignore it
      - kind: secondaryButton
        label: Test connection
        notes: Runs testQueueFeed. Configuring an integration without a test is configuring it blind
      - kind: detailPanel
        bindsTo: FeedTestResult
        notes: Five checks, plus the mapped sample reading and the raw payload. A source that is reachable
          and returns a shape nobody mapped looks like silence, not an error
      - kind: toggle
        label: Enabled
        notes: Disabled by default. A feed goes live only after a passing test
    - name: actionBar
      components:
      - kind: primaryButton
        label: Save
  states:
    loading: Form skeleton
    empty: Not applicable
    error: Save failed. The test result stays on screen — losing it forces the configurer to run the
      test again
  wireframe:
    status: drafted
    board: wireframes/P08 Staff Web Back Office.dc.html#bo-003
  permission: QUEUE_MANAGE
  apis:
  - operationId: configureQueueFeed
    contract: queue
    purpose: Set the source
    trigger: onAction
  - operationId: testQueueFeed
    contract: queue
    purpose: One exchange with the configured source
    trigger: onAction
  - operationId: getQueueFeedHealth
    contract: queue
    purpose: Current feed state
    trigger: onLoad
  - operationId: listOrders
    contract: orders
    purpose: From the flow it appears in
    trigger: onLoad
  - operationId: getRefundPolicy
    contract: orders
    purpose: From the flow it appears in
    trigger: onLoad
  - operationId: applyManualDiscount
    contract: orders
    purpose: Apply a discount a cashier chose
    trigger: onAction
  - operationId: createOrder
    contract: orders
    purpose: Create an order
    trigger: onAction
  - operationId: createRefund
    contract: orders
    purpose: Refund an order, wholly or in part
    trigger: onAction
  - operationId: exchangeOrderLines
    contract: orders
    purpose: Exchange lines for different products or dates
    trigger: onAction
  - operationId: getOrder
    contract: orders
    purpose: Read an order
    trigger: onLoad
  - operationId: getOrderStatement
    contract: orders
    purpose: Full financial history of an order
    trigger: onLoad
  - operationId: holdOrder
    contract: orders
    purpose: Park a sale and free the till
    trigger: onAction
  - operationId: listDeliveryLocations
    contract: fnb
    purpose: Where an order can be delivered
    trigger: onLoad
  - operationId: listDiningOutlets
    contract: fnb
    purpose: Where a guest can eat, right now
    trigger: onLoad
  - operationId: listOrderRefunds
    contract: orders
    purpose: List refunds against an order
    trigger: onLoad
  - operationId: listQueueFeeds
    contract: queue
    purpose: List configured sensor feeds
    trigger: onLoad
  - operationId: modifyOrder
    contract: orders
    purpose: Add or remove lines on an existing order
    trigger: onAction
  - operationId: reprintOrder
    contract: orders
    purpose: Reprint or resend tickets
    trigger: onAction
  - operationId: rescheduleOrder
    contract: orders
    purpose: Move an order to another performance
    trigger: onAction
  - operationId: resumeOrder
    contract: orders
    purpose: Bring a parked sale back to a till
    trigger: onAction
  - operationId: setRefundPolicy
    contract: orders
    purpose: Set a venue's refund policy
    trigger: onAction
