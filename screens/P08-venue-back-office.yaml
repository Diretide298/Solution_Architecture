    fromFlows: true
- id: BO-004
  name: Manual Wait Time Entry
  module: Queue Management
  purpose: Set a wait time by hand, whether or not a feed exists.
  capability: C05
  wave: 1
  layout:
    template: form
    regions:
    - name: contentBody
      components:
      - kind: cardList
        bindsTo: Queue[]
        notes: One row per queue with a stepper and the current value
      - kind: banner
        notes: Where a feed is live, a manual entry overrides it for a stated period and then reverts.
          A permanent silent override is how a broken sensor goes unnoticed for a season
    - name: actionBar
      components:
      - kind: primaryButton
        label: Publish
  states:
    loading: Rows skeleton. Current values render immediately
    empty: No queues configured
    error: Publish failed. The entered value is kept on screen
  wireframe:
