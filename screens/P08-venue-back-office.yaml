    trigger: onAction
  notes: ADR-0012, adaptor-first. A named vendor is a driver behind a stable inbound shape, so adding
    one is configuration plus a driver rather than a core change. Vendor selection is CF-33a and deliberately
    late.
  implementation:
    app: venue-management-web
    route: /queue-management/queue-integration-setup
