# P08 — Venue Back Office
#
# STARTED, NOT COMPLETE. The page inventory counts 73 back office screens and
# itemises none of them — a figure carried from v1 with no list behind it.
# These six are the queue integration surface the client decided on 14 August,
# plus a parking placeholder pending that day's MoM.

platform:
  code: P08
  audience: staff
  formFactor: web
  shortName: Venue Management
  name: Venue Management — Back Office
  surface: staffFacing
  runtime: reactWeb
  offlineCapable: false
  themes:
  - light
  - dark
  directions:
  - ltr
  - rtl
  screenCount: 90
  app: venue-management-web
  appStatus: scaffolded
  packages:
  - design-tokens
  - ui
  - api-client
  deployment:
    target: browser, desktop
    distribution: served from the cell
    bundleUpdate: immediate on deploy
    hosting: in-cell, in-region
    storeReview: false
    deviceOwnership: venue-owned workstation
    networkAssumption: venue LAN
    releaseCadence: weekly
  wireframeBoard: wireframes/P08 Staff Web Back Office.dc.html
  operator: venue
screens:
- id: BO-001
