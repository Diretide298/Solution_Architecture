# P07 — Staff Scanner — Access Control
#
# Derived from the wireframe board on 14 August. **Purposes and navigation are real;
# components, states and operations are not yet written.** Every screen carries
# wireframe.status drafted so the gap is visible rather than implied.

platform:
  code: P07
  audience: staff
  formFactor: handheld
  shortName: Staff Scanner
  name: Staff Scanner — Access Control
  surface: staffFacing
  runtime: reactNative
  app: scanner
  appStatus: scaffolded
  offlineCapable: true
  packages:
  - design-tokens
  - ui
  - api-client
  - offline-core
  deployment:
    target: rugged handheld — Android
    distribution: MDM
    bundleUpdate: at shift start
    hosting: local, offline-first (ADR-0013)
    storeReview: false
    deviceOwnership: venue-owned, issued per shift
    networkAssumption: must function with none
    releaseCadence: monthly, never on an event day
  screenCount: 16
  wireframeBoard: wireframes/P07 Staff Scanner.dc.html
screens:
- id: SCN-001
  name: Sign in
  module: Access
  purpose: PIN or badge. Session carries the workstation.
  capability: C00
  wave: 1
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
        notes: Structure from the wireframe board. Components not yet enumerated.
  states:
    loading: Session check against the local store, then the server if reachable
    empty: Not applicable
    error: Sign-in failed. The reason is shown — wrong PIN reads differently from no network
    offline: '**Signs in against the cached principal list from the last bundle.** A steward locked
      out at 08:00 because the venue wifi is down is a gate that does not open'
  navigation:
    exitTo: []
    inferred: true
  wireframe:
    status: drafted
    owner: wireframe board
    board: wireframes/P07 Staff Scanner.dc.html#scn-001
  notes: Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written.
  implementation:
    app: scanner
    route: /access/sign-in
    component: apps/scanner/src/routes/access/SignInDetail.tsx
    status: notStarted
  apis:
  - operationId: login
    contract: identity
    purpose: From the flow it appears in
    trigger: onLoad
  - operationId: getCurrentShift
    contract: shift
    purpose: From the flow it appears in
    trigger: onLoad
