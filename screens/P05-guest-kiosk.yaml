- id: KSK-007
  name: Payment
  module: orders
  purpose: Take a card, and nothing else.
  capability: C00
  wave: 2
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
        notes: Structure from the wireframe board. Components not yet enumerated.
  states:
    loading: Terminal state, shown plainly
    empty: Not applicable
    error: Declined, with the reason. The lease is held for the remaining window so a second card is
      possible
    offline: Not available. **Card only, and card needs the acquirer**
  navigation:
    exitTo:
    - KSK-001
    - KSK-002
    - KSK-003
    - KSK-009
    inferred: true
    fromFlows: true
  wireframe:
    status: drafted
    owner: wireframe board
    board: wireframes/P05 Guest Kiosk.dc.html#ksk-007
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  notes: 'Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written. **Card only. No foreign cash** — a kiosk accepting foreign notes needs a note
    reader and a per-currency float, and neither is specified. A guest paying by card in a foreign currency
    is converted by their own issuer, which is not our rate. **Card only. No foreign cash** — a kiosk
    accepting notes needs a note reader and a per-currency float, and neither is specified. Dynamic
    currency conversion by the terminal is recorded as `fxRateSource: cardScheme`, because that rate
    is the scheme''s rather than ours.'
  implementation:
    app: guest-app
    route: /sell/payment
    component: apps/guest-app/src/routes/sell/PaymentDetail.tsx
    status: notStarted
  apis:
