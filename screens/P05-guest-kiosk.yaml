- id: KSK-015
  name: Assistant
  module: catalogue
  purpose: Help a guest choose and pay, and nothing else.
  capability: C00
  wave: 2
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
  apis:
  - operationId: sendAiMessage
    contract: ai
    purpose: Ask
    trigger: onAction
  - operationId: listProducts
    contract: catalogue
    purpose: List products
    trigger: onLoad
  - operationId: getAvailability
    contract: catalogue
    purpose: Live remaining capacity
    trigger: onLoad
