  notes: 'Added 17 August for 2.1.28, which names the kiosk explicitly and was the only surface with
    no AI screen. **Scoped to `guestCapabilityScope`** — ticket selection, promotions, FAQs, recommendations
    and checkout, and nothing else. **No keyboard**: voice or a constrained touch interface, which is
    why the app chat pattern does not transfer. Depends on CF-14. **Not on the wireframe board.** **Wave
    2 with the rest of the kiosk.** Set to Wave 1 in error on 17 August — an assistant that guides a
    guest through ticket selection and checkout cannot ship before the screens that do the selecting
    and the checking out.'
  modules:
  - catalogue
  - ai
  - marketing-crm
