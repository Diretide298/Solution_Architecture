# P05 — Guest Kiosk — Self-Service
#
# Derived from the wireframe board on 14 August. **Purposes and navigation are real;
# components, states and operations are not yet written.** Every screen carries
# wireframe.status drafted so the gap is visible rather than implied.

platform:
  code: P05
  audience: guest
  formFactor: kiosk
  shortName: Guest Kiosk
  name: Guest Kiosk — Self-Service
  surface: guestFacing
  runtime: reactWeb
  app: guest-app
  appStatus: scaffolded
  offlineCapable: false
  packages:
  - design-tokens
  - ui
  - api-client
  deployment:
    target: kiosk hardware, kiosk-mode shell
    distribution: device management push
    bundleUpdate: on deploy
    hosting: in-cell
    storeReview: false
    deviceOwnership: venue-owned, unattended
    networkAssumption: venue LAN, generally reliable
    releaseCadence: monthly, out of hours
  screenCount: 15
  wireframeBoard: wireframes/P05 Guest Kiosk.dc.html
  designReferences:
  - path: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
    note: Kiosk is white-labelled like the guest surfaces, not TICVAI-branded like the POS (14 August).
  operator: guest
  directions:
  - ltr
  - rtl
screens:
- id: KSK-001
  name: Attract Loop
  module: Sell
  purpose: Pull somebody standing in a queue out of it.
  capability: C00
  wave: 2
  layout:
    template: detail
    regions:
    - name: contentBody
      components:
      - kind: detailPanel
        notes: Structure from the wireframe board. Components not yet enumerated.
  states:
    loading: Not applicable — the attract loop is the idle state
    empty: Not applicable
    error: Falls through to KSK-014 if the kiosk cannot reach the server
    offline: '**Not available.** An unattended terminal selling from a stale catalogue oversells with
      nobody watching'
  navigation:
    exitTo:
    - KSK-002
    - KSK-003
    - KSK-004
    inferred: true
  wireframe:
    status: drafted
    owner: wireframe board
    board: wireframes/P05 Guest Kiosk.dc.html#ksk-001
    designReference: sources/designs/TICVAI_White_Label_Guest_App_UI_Reference_1.pdf
  notes: Definition derived from the wireframe board on 14 August. Components, states and operations
    still to be written.
  implementation:
