    contract: marketing-crm
    purpose: Pass an assistant conversation to a person
    trigger: onAction
  states:
    loading: Answers stream. **The purchase flow stays on screen behind it** — the assistant helps with
      the task rather than replacing it
    empty: —
    error: '**Falls back to Call staff** (KSK-013), not to an error. A guest stuck at a kiosk with a
      broken assistant needs a person, and there is one in the building'
  navigation:
    exitTo:
    - KSK-001
    - SUP-004
