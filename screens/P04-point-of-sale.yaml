- id: POS-004
  name: Sell — Seat Map
  module: Sell
  purpose: Choose specific seats for a seated event.
  capability: C51
  wave: 2
  layout:
    template: canvas
    regions:
    - name: contentBody
      components:
      - kind: seatMap
        bindsTo: SeatAvailability
        notes: Category filter, zoom, legend. Available, selected, sold, accessible — exactly the four
          states in the design
      - kind: banner
        notes: Hold countdown
    - name: contextPanel
      components:
      - kind: cartPanel
        bindsTo: SeatHold
        notes: Seat total plus booking fee, itemised as designed
    - name: actionBar
      components:
      - kind: primaryButton
        label: Add seats to cart
  states:
    loading: Map skeleton at the venue aspect ratio
    emptyFirstRun: No seats in the selected category
    emptyNoAccess: TODO — this person may not see it. Never rendered as empty.
    error: Map unavailable, with best-available offered instead
    offline: '**Not available offline.** Seat holds require the primary; two terminals selling the same
      seat is unrecoverable'
  wireframe:
    status: approved
    owner: client mockup
    board: wireframes/P04 Staff POS.dc.html#pos-004
    designReference: sources/designs/Park_POS_dc.html
  permission: ORDER_CREATE
  apis:
  - operationId: getSeatAvailability
    contract: seating
    purpose: Seat status
    trigger: onLoad
  - operationId: createSeatHold
    contract: seating
    purpose: Hold on selection
    trigger: onAction
  - operationId: extendSeatHold
    contract: seating
    purpose: Extend during payment
    trigger: onAction
  - operationId: cancelPerformance
    contract: catalogue
    purpose: Cancel a performance
    trigger: onAction
  - operationId: getPerformance
    contract: catalogue
    purpose: Read a performance
    trigger: onLoad
  - operationId: getSeatHold
    contract: seating
