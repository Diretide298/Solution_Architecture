    trigger: onLoad
  - operationId: recommendSeats
    contract: seating
    purpose: Recommend seats for a party
    trigger: onAction
  - operationId: releaseSeatHold
    contract: seating
    purpose: Release a hold
    trigger: onAction
  - operationId: updatePerformance
    contract: catalogue
    purpose: Amend a performance
    trigger: onAction
  - operationId: createOrder
    contract: orders
    purpose: Create an order
    trigger: onAction
  - operationId: createPayment
    contract: orders
    purpose: Take a payment against an order
    trigger: onAction
  - operationId: evaluateApprovalRequirement
    contract: approvals
    purpose: Does this need approval, and from whom
    trigger: onAction
  notes: 'Design: Park_POS_dc.html, "Reserved Seating / Seat Map". Booking fee is a separate line —
    it is a fee, not part of the seat price, and reporting separates them. Foreign tender: **cash in
    a currency the venue accepts, converted at the rate on the payment** (4.6.11). Change is given in
    base currency only, so the till holds one float and one count per currency it takes in.'
  implementation:
    app: venue-pos
    route: /sell/sell-seat-map
    component: apps/venue-pos/src/routes/sell/SellSeatMapCanvas.tsx
    status: notStarted
  navigation:
