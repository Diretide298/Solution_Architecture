    purpose: List merchandise
    trigger: onLoad
  - operationId: lookupMerchandise
    contract: retail
    purpose: Price and stock check by barcode
    trigger: onLoad
  - operationId: issueGameCard
    contract: games
    purpose: Issue or activate a game card
    trigger: onAction
  - operationId: loadGameCredits
