    trigger: onAction
  notes: 'Design: Park_POS_dc.html, "Ticket Catalogue / Product Selection". The mockup exposes Hold
    Order and Discount as first-class buttons — neither existed as an operation until 14 August. Where
    a foreign note is offered, the tender currency and rate are recorded on the payment. **The sale
    is still booked in base currency** — 2.9.1: the sale finalises in local currency.'
