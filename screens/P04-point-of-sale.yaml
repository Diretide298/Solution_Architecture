    trigger: onAction
  - operationId: updateProduct
    contract: catalogue
    purpose: Update a product
    trigger: onAction
  - operationId: updatePromotion
    contract: promotions
    purpose: Amend a promotion
    trigger: onAction
  - operationId: voidOrder
    contract: orders
    purpose: Void an order
    trigger: onAction
  - operationId: evaluateApprovalRequirement
    contract: approvals
