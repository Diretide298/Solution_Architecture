openapi: 3.1.0
info:
  title: Greenleaf Library - Lending
  version: 1.0.0
  description: |
    Lending for Greenleaf, a small community library. Members borrow books and
    return them. This is the ADAM demo package and has nothing to do with any
    client project.

    Rules every endpoint follows:
    - Errors are `application/problem+json` with a `code` a client can switch on.
    - Dates are ISO 8601 strings in UTC.
    - Ids are strings: books `bk_…`, members `mb_…`, loans `ln_…`.
tags:
  - name: Books
  - name: Members
  - name: Loans
paths:
  /books:
    get:
      operationId: listBooks
      tags: [Books]
      summary: List books with how many copies are on the shelf
      responses:
        '200':
          description: Every book in the catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
    post:
      operationId: addBook
      tags: [Books]
      summary: Add a book to the catalogue
      description: |
        Staff add a title. `title` and `author` are required and trimmed; `totalCopies`
        is 1 to 50. The new book starts with every copy on the shelf. A book with the
        same title and author (ignoring case) already in the catalogue is 409
        `duplicate_book`; a bad body is 400 `invalid_request`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewBook' }
      responses:
        '201':
          description: The book that was added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: That book is already in the catalogue.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /books/search:
    get:
      operationId: searchBooks
      tags: [Books]
      summary: Find books by title or author
      description: |
        `q` matches title or author, case-insensitive, anywhere in the text; at least
        2 characters, else 400 `invalid_request`. `available=true` keeps only books
        with a copy on the shelf. Results are sorted by title.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: available
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '200':
          description: Matching books.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Book' }
        '400':
          $ref: '#/components/responses/BadRequest'
  /members:
    post:
      operationId: registerMember
      tags: [Members]
      summary: Register a member
      description: |
        `name` is required (2 to 80 characters, trimmed); `email` is required and must
        look like an address. An email already registered (ignoring case) is 409
        `duplicate_member`. The new member has no loans.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMember' }
      responses:
        '201':
          description: The member that was registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Member' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: That email is already registered.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /loans/overdue:
    get:
      operationId: listOverdueLoans
      tags: [Loans]
      summary: Every overdue loan, for the desk
      description: |
        Active loans whose `dueAt` is before now, most overdue first, each with
        `daysOverdue` (whole days, at least 1) and the member's name and the book's
        title so the desk can call without a second lookup.
      responses:
        '200':
          description: Overdue loans.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OverdueLoan' }
  /books/{bookId}/reserve:
    post:
      operationId: reserveBook
      tags: [Loans]
      summary: Join the queue for a book that is all out
      description: |
        A member queues for a book whose copies are all on loan. Checked in this
        order: an unknown member is 404 `member_not_found`; an unknown book is 404
        `book_not_found`; a book with a copy on the shelf is 409 `copies_available`,
        because it should be borrowed rather than reserved; a member already in that
        book's queue is 409 `already_reserved`.

        A new reservation is `queued`, and `position` is its place in the queue,
        counting from 1 over that book's queued reservations, oldest first.
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveRequest' }
      responses:
        '201':
          description: The reservation that was placed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The reservation is not allowed right now.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /reservations/{reservationId}:
    delete:
      operationId: cancelReservation
      tags: [Loans]
      summary: Leave the queue
      description: |
        Cancels a queued reservation and closes the gap behind it: every later
        reservation for that book moves up one place. An unknown reservation is 404
        `reservation_not_found`; one already cancelled is 409 `already_cancelled`.
      parameters:
        - name: reservationId
          in: path
          required: true
          schema: { type: string, example: rs_0001 }
      responses:
        '200':
          description: The cancelled reservation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already cancelled.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /members/{memberId}:
    get:
      operationId: getMember
      tags: [Members]
      summary: One member, with what they have out
      description: |
        The member with a count of their active loans, how many of those are
        overdue, and how many books they are queued for. An unknown member is 404
        `member_not_found`.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, example: mb_0001 }
      responses:
        '200':
          description: The member.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSummary' }
        '404':
          $ref: '#/components/responses/NotFound'
  /books/{bookId}:
    get:
      operationId: getBook
      tags: [Books]
      summary: One book
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: The book.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '404':
          $ref: '#/components/responses/NotFound'
  /loans:
    post:
      operationId: borrowBook
      tags: [Loans]
      summary: Borrow a book
      description: |
        A member borrows one copy of a book.

        Business rules, checked in this order:
        1. The member must exist, else 404 `member_not_found`.
        2. The book must exist, else 404 `book_not_found`.
        3. A member may hold at most **3** active loans, else 409 `loan_limit_reached`.
        4. The book must have at least one available copy, else 409 `no_copies_available`.

        On success one copy is taken off the shelf (`availableCopies` goes down by
        one), and the loan is `active`, due **14 days** after `borrowedAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BorrowRequest' }
      responses:
        '201':
          description: The loan that was created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The loan is not allowed right now.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /loans/{loanId}/return:
    post:
      operationId: returnBook
      tags: [Loans]
      summary: Return a borrowed book
      description: |
        Marks an active loan `returned`, sets `returnedAt`, and puts the copy
        back on the shelf. Returning a loan twice is 409 `already_returned`.
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: string, example: ln_0001 }
      responses:
        '200':
          description: The returned loan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already returned.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /loans/{loanId}/renew:
    post:
      operationId: renewLoan
      tags: [Loans]
      summary: Renew a loan for another 14 days
      description: |
        Moves `dueAt` 14 days later and counts the renewal. Checked in this order:
        an unknown loan is 404 `loan_not_found`; a returned loan is 409
        `already_returned`; an overdue loan (`dueAt` before now) is 409
        `loan_overdue`; a loan already renewed twice is 409 `renewal_limit_reached`.
      parameters:
        - name: loanId
          in: path
          required: true
          schema: { type: string, example: ln_0001 }
      responses:
        '200':
          description: The renewed loan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Loan' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The loan cannot be renewed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /members/{memberId}/loans:
    get:
      operationId: listMemberLoans
      tags: [Loans]
      summary: A member's loans
      description: |
        Every loan the member has, newest `borrowedAt` first. `?status=active`
        or `?status=returned` narrows it; any other value is 400
        `invalid_request`. An unknown member is 404 `member_not_found`.
        Each active loan whose `dueAt` is before now carries `overdue: true`.
      parameters:
        - name: memberId
          in: path
          required: true
          schema: { type: string, example: mb_0001 }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, returned] }
      responses:
        '200':
          description: The member's loans.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Loan' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema: { type: string, example: bk_0001 }
  responses:
    BadRequest:
      description: The body is missing a field or has the wrong type. `code` is `invalid_request`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Something named in the request does not exist.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Book:
      type: object
      required: [id, title, author, totalCopies, availableCopies]
      properties:
        id: { type: string, example: bk_0001 }
        title: { type: string }
        author: { type: string }
        totalCopies: { type: integer, minimum: 0 }
        availableCopies:
          type: integer
          minimum: 0
          description: Copies on the shelf now. Never above totalCopies, never below 0.
    BorrowRequest:
      type: object
      required: [memberId, bookId]
      additionalProperties: false
      properties:
        memberId: { type: string, example: mb_0001 }
        bookId: { type: string, example: bk_0001 }
    Loan:
      type: object
      required: [id, memberId, bookId, status, borrowedAt, dueAt]
      properties:
        id: { type: string, example: ln_0001 }
        memberId: { type: string }
        bookId: { type: string }
        status:
          type: string
          enum: [active, returned]
        borrowedAt: { type: string, format: date-time }
        dueAt:
          type: string
          format: date-time
          description: borrowedAt plus 14 days.
        returnedAt:
          type: [string, 'null']
          format: date-time
        overdue:
          type: boolean
          description: Only on listMemberLoans. True for an active loan past dueAt.
        renewals:
          type: integer
          minimum: 0
          maximum: 2
          description: How many times renewLoan has extended it.
    NewBook:
      type: object
      required: [title, author]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        author: { type: string, minLength: 1, maxLength: 120 }
        totalCopies: { type: integer, minimum: 1, maximum: 50, default: 1 }
    Member:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, example: mb_0003 }
        name: { type: string }
        email: { type: string, format: email }
    MemberSummary:
      allOf:
        - $ref: '#/components/schemas/Member'
        - type: object
          required: [activeLoans, overdueLoans, reservations]
          properties:
            activeLoans: { type: integer, minimum: 0 }
            overdueLoans:
              type: integer
              minimum: 0
              description: Active loans past dueAt. Never above activeLoans.
            reservations:
              type: integer
              minimum: 0
              description: Books this member is queued for.
    NewMember:
      type: object
      required: [name, email]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email }
    OverdueLoan:
      allOf:
        - $ref: '#/components/schemas/Loan'
        - type: object
          required: [daysOverdue, memberName, bookTitle]
          properties:
            daysOverdue: { type: integer, minimum: 1 }
            memberName: { type: string }
            bookTitle: { type: string }
    Reservation:
      type: object
      required: [id, memberId, bookId, status, placedAt]
      properties:
        id: { type: string, example: rs_0001 }
        memberId: { type: string }
        bookId: { type: string }
        status:
          type: string
          enum: [queued, cancelled]
        placedAt: { type: string, format: date-time }
        cancelledAt:
          type: [string, 'null']
          format: date-time
        position:
          type: integer
          minimum: 1
          description: Place in that book's queue, oldest first. Absent once cancelled.
    ReserveRequest:
      type: object
      required: [memberId]
      additionalProperties: false
      properties:
        memberId: { type: string, example: mb_0001 }
    Problem:
      type: object
      required: [status, code, title]
      properties:
        status: { type: integer }
        code:
          type: string
          enum:
            - invalid_request
            - member_not_found
            - book_not_found
            - loan_not_found
            - loan_limit_reached
            - no_copies_available
            - already_returned
            - loan_overdue
            - renewal_limit_reached
            - duplicate_book
            - duplicate_member
            - reservation_not_found
            - already_reserved
            - already_cancelled
            - copies_available
        title: { type: string }
        detail: { type: string }
